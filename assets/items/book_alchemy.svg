<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="book_alchemy-cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0524a"/>
      <stop offset="0.5" stop-color="#8e1b2b"/>
      <stop offset="1" stop-color="#5e0f1c"/>
    </linearGradient>
    <linearGradient id="book_alchemy-pages" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe2c4"/>
      <stop offset="0.6" stop-color="#d8c49a"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
    <radialGradient id="book_alchemy-medal" cx="0.42" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#5e0f1c"/>
      <stop offset="1" stop-color="#2a1838"/>
    </radialGradient>
    <linearGradient id="book_alchemy-em" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c8"/>
      <stop offset="0.45" stop-color="#f2d27a"/>
      <stop offset="1" stop-color="#d9a441"/>
    </linearGradient>
  </defs>
  <g transform="translate(32 32) rotate(-12) translate(-32.3 -32.3)">
    <!-- shadow -->
    <rect x="16" y="11" width="38.6" height="48.6" rx="2" fill="#14101a" opacity="0.45"/>
    <!-- page block -->
    <path d="M14 9.6 L51.6 10.6 L51.6 56.6 L15.6 56.6 Z" fill="url(#book_alchemy-pages)" stroke="#14101a" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M50 13 L50 55 M48.6 55.2 L17 55.2" fill="none" stroke="#8a5a1c" stroke-width="0.6" opacity="0.7"/>
    <path d="M51 16 L51 54" stroke="#fff8e6" stroke-width="0.5" opacity="0.6"/>
    <!-- cover -->
    <rect x="13" y="8" width="36" height="46" rx="1.4" fill="url(#book_alchemy-cover)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- spine strip -->
    <path d="M13 8 L19.8 8 L19.8 54 L13 54 Z" fill="#14101a" opacity="0.28"/>
    <path d="M19.8 8.6 L19.8 53.4" stroke="#14101a" stroke-width="0.8" opacity="0.6"/>
    <!-- inner border -->
    <rect x="22" y="10.6" width="24.6" height="40.8" rx="0.6" fill="none" stroke="#f2d27a" stroke-width="0.6" opacity="0.55"/>
    <!-- binding thread -->
    <g stroke="#efe2c4" stroke-width="1" stroke-linecap="round" fill="none">
      <path d="M16.8 12.4 L16.8 49.6"/>
      <path d="M12.6 12.4 L16.8 12.4 M12.6 24.8 L16.8 24.8 M12.6 37.2 L16.8 37.2 M12.6 49.6 L16.8 49.6"/>
    </g>
    <g fill="#14101a"><circle cx="16.8" cy="12.4" r="0.8"/><circle cx="16.8" cy="24.8" r="0.8"/><circle cx="16.8" cy="37.2" r="0.8"/><circle cx="16.8" cy="49.6" r="0.8"/></g>
    <!-- corner wraps -->
    <g fill="#d9a441" stroke="#14101a" stroke-width="0.8" stroke-linejoin="round">
      <path d="M12.4 7.6 L17 7.6 L17 10.2 L12.4 10.2 Z"/><path d="M12.4 51.8 L17 51.8 L17 54.4 L12.4 54.4 Z"/>
    </g>
    <!-- cover highlight -->
    <path d="M15 9.6 L47 9.6" stroke="#fff8e6" stroke-width="0.9" stroke-linecap="round" opacity="0.45"/>
    <path d="M47.6 11 L47.6 40" stroke="#fff8e6" stroke-width="0.7" stroke-linecap="round" opacity="0.25"/>
    <!-- medallion -->
    <circle cx="34.3" cy="31" r="12.4" fill="#14101a" opacity="0.35"/>
    <circle cx="34.3" cy="31" r="11.6" fill="url(#book_alchemy-medal)" stroke="#d9a441" stroke-width="1.4"/>
    <circle cx="34.3" cy="31" r="12.5" fill="none" stroke="#14101a" stroke-width="0.8"/>
    <circle cx="34.3" cy="31" r="10.2" fill="none" stroke="#8a5a1c" stroke-width="0.5"/>
    <g transform="translate(34.3 31)">
    <g stroke="#14101a" stroke-linejoin="round">
      <path d="M-5.4 4.6 L-7 9.4 M0 6 L0 9.8 M5.4 4.6 L7 9.4" stroke="#14101a" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M-5.4 4.6 L-7 9.4 M0 6 L0 9.8 M5.4 4.6 L7 9.4" stroke="#d9a441" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M-8.6 -2.6 Q-9.4 6.4 0 6.6 Q9.4 6.4 8.6 -2.6 Z" fill="url(#book_alchemy-em)" stroke-width="1.1"/>
      <path d="M-8.6 -1 Q-11 -1.6 -10.6 1.2 Q-10 3 -8 2.2 M8.6 -1 Q11 -1.6 10.6 1.2 Q10 3 8 2.2" fill="none" stroke="#d9a441" stroke-width="1.3"/>
      <path d="M-9.4 -2.6 L9.4 -2.6 L8 -4.6 L-8 -4.6 Z" fill="#d9a441" stroke-width="1"/>
      <path d="M-6 -4.6 Q0 -9.4 6 -4.6 Z" fill="url(#book_alchemy-em)" stroke-width="1"/>
      <circle cx="0" cy="-8.2" r="1.5" fill="#f2d27a" stroke-width="0.8"/>
      <path d="M0 4.6 Q-3 2.4 -1.4 -0.6 Q-0.6 1 0 0 Q0.4 -1.6 1.6 -1.4 Q3 2.4 0 4.6 Z" fill="#e0524a" stroke-width="0.8"/>
      <path d="M0 3.6 Q-1 2.4 0 1.4 Q1 2.4 0 3.6 Z" fill="#ffc56b" stroke="none"/>
    </g>
    <path d="M0.4 -9.8 Q-1.6 -11.4 0.6 -13" fill="none" stroke="#e9dfcc" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>
    <path d="M-6.6 -1 Q-7 3 -3.6 5" fill="none" stroke="#fff3c8" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>
    </g>
    <path d="M25.4 25 Q27.6 20.6 32 19.6" fill="none" stroke="#f2d27a" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
