<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="intel-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe2c4"/>
      <stop offset="0.55" stop-color="#d8c49a"/>
      <stop offset="1" stop-color="#9c8558"/>
    </linearGradient>
    <linearGradient id="intel-flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dfcc"/>
      <stop offset="1" stop-color="#c2aa78"/>
    </linearGradient>
    <radialGradient id="intel-wax" cx="0.38" cy="0.34" r="0.7">
      <stop offset="0" stop-color="#e0524a"/>
      <stop offset="0.45" stop-color="#c43a3a"/>
      <stop offset="0.8" stop-color="#8e1b2b"/>
      <stop offset="1" stop-color="#5e0f1c"/>
    </radialGradient>
    <radialGradient id="intel-mist" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b3474" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#3d2350" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2a1838" stop-opacity="0"/>
    </radialGradient>
    <filter id="intel-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#intel-mist)"/>
  <!-- purple mist wisps -->
  <g fill="none" stroke="#5b3474" stroke-linecap="round" filter="url(#intel-blur)" opacity="0.9">
    <path d="M6 22 Q12 14 20 16 Q26 10 22 5" stroke-width="3"/>
    <path d="M58 44 Q52 52 44 50 Q38 56 42 60" stroke-width="3"/>
    <path d="M54 12 Q48 8 50 4" stroke-width="2.4"/>
  </g>
  <!-- shadow -->
  <ellipse cx="33" cy="55" rx="24" ry="4" fill="#14101a" opacity="0.5"/>
  <g transform="rotate(-9 32 33)">
    <!-- back sheet (second letter peeking) -->
    <path d="M9 20 L53 18 L55 46 L11 48 Z" fill="#b8a173" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round" transform="rotate(8 32 33)"/>
    <!-- envelope body -->
    <path d="M7 19 L57 19 L57 48 L7 48 Z" fill="url(#intel-paper)" stroke="#14101a" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- lower fold lines -->
    <path d="M7 48 L28 33 M57 48 L36 33" fill="none" stroke="#8a7a5c" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M9 46 L27 33.5" fill="none" stroke="#f4e6c4" stroke-width="0.8" opacity="0.7"/>
    <!-- top flap -->
    <path d="M7 19 L32 37 L57 19 Z" fill="url(#intel-flap)" stroke="#14101a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M7 19 L32 37 L57 19" fill="none" stroke="#14101a" stroke-width="1" opacity="0.35" transform="translate(0 1.6)"/>
    <!-- faint ink lines (secret writing glimpsed) -->
    <g stroke="#3d2350" stroke-width="0.9" stroke-linecap="round" opacity="0.55">
      <path d="M12 42 h6 M12 44.5 h4 M47 42 h5 M49 44.5 h3"/>
    </g>
    <!-- highlight -->
    <path d="M10 21.5 L22 30" stroke="#f4fbff" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
    <!-- red binding cord -->
    <path d="M7 34 Q20 36 26 36 M38 36 Q46 36 57 33" fill="none" stroke="#14101a" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M7 34 Q20 36 26 36 M38 36 Q46 36 57 33" fill="none" stroke="#8e1b2b" stroke-width="1.3" stroke-linecap="round"/>
    <!-- wax drips -->
    <path d="M27 41 Q26 46 28 47.5 Q30 46 29.5 42 Z M36 42 Q37.5 46 36 49 Q34 47.5 34.5 42.5 Z" fill="#8e1b2b" stroke="#14101a" stroke-width="1" stroke-linejoin="round"/>
    <!-- wax seal -->
    <path d="M32 26.5 Q36 26 38.5 28.5 Q42 30 41.2 33.5 Q42.5 37.5 39 39.8 Q37 43 32.5 42.4 Q28.5 43.5 26 40.4 Q22.5 38.5 23.3 34.5 Q22 30.5 25.5 28.5 Q28 25.8 32 26.5 Z" fill="url(#intel-wax)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="32.2" cy="34.4" r="6" fill="none" stroke="#5e0f1c" stroke-width="1.2"/>
    <!-- eye sigil -->
    <path d="M26.6 34.4 Q32.2 29 37.8 34.4 Q32.2 39.8 26.6 34.4 Z" fill="#14101a"/>
    <path d="M28 34.4 Q32.2 31 36.4 34.4 Q32.2 37.8 28 34.4 Z" fill="#f2d27a"/>
    <ellipse cx="32.2" cy="34.4" rx="1" ry="2.3" fill="#14101a"/>
    <path d="M32.2 28.6 v1.6 M32.2 38.6 v1.6 M27.4 30.6 l1 1 M37 30.6 l-1 1" stroke="#f2d27a" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M26.5 30 Q28.5 27.6 31.5 27.4" fill="none" stroke="#ffd6cc" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
