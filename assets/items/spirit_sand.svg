<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="spirit_sand-jade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd6b5"/>
      <stop offset="0.5" stop-color="#3fae8f"/>
      <stop offset="1" stop-color="#1f5c4c"/>
    </linearGradient>
    <linearGradient id="spirit_sand-pile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="0.35" stop-color="#cfefff"/>
      <stop offset="0.75" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#4a8fb8"/>
    </linearGradient>
    <radialGradient id="spirit_sand-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfefff" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#8fd3ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#8fd3ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="spirit_sand-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#spirit_sand-halo)"/>
  <!-- light pillar -->
  <path d="M24 34 L28 4 L36 4 L40 34 Z" fill="#cfefff" opacity="0.35" filter="url(#spirit_sand-glow)"/>
  <ellipse cx="32" cy="56.6" rx="24" ry="3.6" fill="#14101a" opacity="0.45"/>
  <!-- jade dish -->
  <path d="M6 41 Q7 50 18 53.6 Q32 57.4 46 53.6 Q57 50 58 41 Z" fill="url(#spirit_sand-jade)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
