  <path d="M12 47 Q20 52 32 52.6 Q44 52 52 47" fill="none" stroke="#7fd6b5" stroke-width="0.8" opacity="0.7"/>
  <path d="M10 44.6 Q12 48.6 17 50.4" fill="none" stroke="#f4fbff" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- cloud motif on dish -->
  <path d="M27 50 q2.5 -2.5 5 0 q2.5 -2.5 5 0" fill="none" stroke="#1f5c4c" stroke-width="0.9" stroke-linecap="round"/>
  <ellipse cx="32" cy="41" rx="26" ry="5.6" fill="#7fd6b5" stroke="#14101a" stroke-width="1.8"/>
  <ellipse cx="32" cy="41.4" rx="22.6" ry="4" fill="#1f5c4c"/>
  <!-- sand pile -->
  <path d="M10.4 41.6 Q14 37 19 33 Q24 22 32 20 Q40 22 45 33 Q50 37 53.6 41.6 Q44 45.6 32 45.6 Q20 45.6 10.4 41.6 Z" fill="#8fd3ff" opacity="0.8" filter="url(#spirit_sand-glow)"/>
  <path d="M11 41.6 Q14.6 37.4 19.4 33.6 Q24.4 22.6 32 20.6 Q39.6 22.6 44.6 33.6 Q49.4 37.4 53 41.6 Q44 45 32 45 Q20 45 11 41.6 Z" fill="url(#spirit_sand-pile)" stroke="#4a8fb8" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M38 24.6 Q42 29 44 35 Q48 38.6 50 41.6 Q42 44.4 34 44.6 Q39.6 37 38 24.6 Z" fill="#4a8fb8" opacity="0.4"/>
  <path d="M25.4 27 Q28 22.6 31.6 21.6" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  <!-- grains -->
  <g fill="#ffffff">
    <circle cx="29" cy="28" r="0.7"/><circle cx="34" cy="26" r="0.6"/><circle cx="31" cy="33" r="0.8"/>
    <circle cx="25" cy="35" r="0.6"/><circle cx="38" cy="32" r="0.7"/><circle cx="21" cy="39" r="0.7"/>
    <circle cx="35" cy="38" r="0.6"/><circle cx="42" cy="38.6" r="0.7"/><circle cx="28" cy="41" r="0.6"/>
    <circle cx="46" cy="41" r="0.5"/><circle cx="16" cy="41" r="0.5"/>
  </g>
  <g fill="#4a8fb8" opacity="0.8">
    <circle cx="27" cy="31" r="0.5"/><circle cx="36" cy="35" r="0.5"/><circle cx="31" cy="39" r="0.5"/><circle cx="40" cy="41.6" r="0.5"/><circle cx="23" cy="42" r="0.5"/>
  </g>
  <!-- star glints on sand -->
  <g fill="#ffffff">
    <path d="M32 14 L33 18.6 L37.6 19.6 L33 20.6 L32 25.2 L31 20.6 L26.4 19.6 L31 18.6 Z"/>
    <path d="M23 31 L23.6 33.4 L26 34 L23.6 34.6 L23 37 L22.4 34.6 L20 34 L22.4 33.4 Z"/>
    <path d="M41 33.4 L41.6 35.6 L43.8 36.2 L41.6 36.8 L41 39 L40.4 36.8 L38.2 36.2 L40.4 35.6 Z"/>
  </g>
