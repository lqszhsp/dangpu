  <g fill="#cfefff">
    <path d="M52 12 L53 16 L57 17 L53 18 L52 22 L51 18 L47 17 L51 16 Z"/>
    <path d="M12 18 L12.8 20.4 L15.2 21.2 L12.8 22 L12 24.4 L11.2 22 L8.8 21.2 L11.2 20.4 Z"/>
    <path d="M56 32 L56.5 33.5 L58 34 L56.5 34.5 L56 36 L55.5 34.5 L54 34 L55.5 33.5 Z"/>
    <circle cx="8" cy="33" r="0.9"/><circle cx="44" cy="8" r="0.8"/><circle cx="20" cy="9" r="0.7"/><circle cx="48" cy="26" r="0.7"/>
  </g>
</svg>
