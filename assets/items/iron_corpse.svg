<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 192">
  <defs>
    <linearGradient id="iron_corpse-skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2f36"/>
      <stop offset="0.4" stop-color="#9aa88a"/>
      <stop offset="0.7" stop-color="#6b7d5a"/>
      <stop offset="1" stop-color="#2a2f36"/>
    </linearGradient>
    <linearGradient id="iron_corpse-iron" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f1626"/>
      <stop offset="0.35" stop-color="#5c6370"/>
      <stop offset="0.6" stop-color="#3a3f4a"/>
      <stop offset="1" stop-color="#14101a"/>
    </linearGradient>
    <linearGradient id="iron_corpse-robe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14101a"/>
      <stop offset="0.4" stop-color="#2a1838"/>
      <stop offset="1" stop-color="#14101a"/>
    </linearGradient>
    <linearGradient id="iron_corpse-paper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a441"/>
      <stop offset="0.5" stop-color="#f2d27a"/>
      <stop offset="1" stop-color="#d9a441"/>
    </linearGradient>
    <filter id="iron_corpse-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="iron_corpse-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <!-- corpse qi aura -->
  <g filter="url(#iron_corpse-blur)" opacity="0.8">
    <ellipse cx="32" cy="100" rx="26" ry="80" fill="#1f5c4c" opacity="0.6"/>
    <path d="M8 150 Q2 130 9 112 M56 156 Q63 135 55 118 M14 40 Q8 28 14 16 M50 44 Q57 30 50 18" fill="none" stroke="#6b7d5a" stroke-width="4"/>
  </g>
