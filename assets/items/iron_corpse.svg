    <path d="M18.4 64 H45.7 M18.6 71 H45.5 M18.8 78 H45.4 M18.9 85 H45.3 M19 92 H45.2 M19 98 H45.1"/>
    <path d="M23 57 V64 M28 55.5 V64 M33 55 V64 M38 55.5 V64 M43 56.5 V64 M25.5 64 V71 M30.5 64 V71 M35.5 64 V71 M40.5 64 V71 M23 71 V78 M28 71 V78 M33 71 V78 M38 71 V78 M43 71 V78 M25.5 78 V85 M30.5 78 V85 M35.5 78 V85 M40.5 78 V85 M23 85 V92 M28 85 V92 M33 85 V92 M38 85 V92 M43 85 V92 M25.5 92 V98 M30.5 92 V98 M35.5 92 V98 M40.5 92 V98"/>
  </g>
  <path d="M21 59 L20.5 100" stroke="#9aa88a" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
