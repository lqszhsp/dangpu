  <!-- legs -->
  <path d="M19.5 128 L31 128 L30.5 174 L20.5 174 Z" fill="url(#iron_corpse-robe)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M33 128 L44.5 128 L43.5 174 L33.5 174 Z" fill="url(#iron_corpse-robe)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
