  <path d="M21.5 27 Q21.5 13 32 13 Q42.5 13 42.5 27 Q42.5 37 38.5 41.5 Q35.5 44.5 32 44.5 Q28.5 44.5 25.5 41.5 Q21.5 37 21.5 27 Z" fill="url(#iron_corpse-skin)" stroke="#14101a" stroke-width="2" stroke-linejoin="round"/>
