  <rect x="15" y="102" width="34" height="7" rx="2" fill="#1f1626" stroke="#14101a" stroke-width="1.6"/>
  <path d="M28 100.5 H36 V110.5 H28 Z" fill="#6b7d5a" stroke="#14101a" stroke-width="1.4" stroke-linejoin="round"/>
