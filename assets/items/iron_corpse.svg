  <path d="M23.5 34 Q24.5 38 26.5 39.5 M40.5 34 Q39.5 38 37.5 39.5" fill="none" stroke="#2a2f36" stroke-width="1" stroke-linecap="round"/>
  <path d="M27.3 39.5 L28.3 42.5 L29 39.6 Z M36.7 39.5 L35.7 42.5 L35 39.6 Z" fill="#e9dfcc" stroke="#14101a" stroke-width="0.5"/>
