  <path d="M29 16.5 L35.2 16.2 L35.8 41 L33.8 39.5 L32.4 42 L31 39.5 L28.8 41 Z" fill="url(#iron_corpse-paper)" stroke="#14101a" stroke-width="1.2" stroke-linejoin="round"/>
  <g fill="none" stroke="#c43a3a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30.3 19.5 H34 M32.2 18 V22.5 M30.5 24 Q32.2 22.8 34.2 24.2 Q32.2 26 30.5 25"/>
    <path d="M32.3 26.5 V37 M30.4 29 H34.3 M30.6 32 Q32.3 31 34.3 32.5 M30.6 35 H34.4"/>
  </g>
  <!-- iron rivets highlight -->
  <path d="M24 16 Q27 14.5 29 15" fill="none" stroke="#9aa88a" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
</svg>
