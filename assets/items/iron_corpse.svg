  <ellipse cx="26.2" cy="29" rx="3" ry="2.2" fill="#14101a"/>
  <ellipse cx="37.8" cy="29" rx="3" ry="2.2" fill="#14101a"/>
  <g fill="#e0524a" filter="url(#iron_corpse-glow)">
    <circle cx="26.2" cy="29" r="2.2"/>
    <circle cx="37.8" cy="29" r="2.2"/>
  </g>
  <circle cx="26.2" cy="29" r="1" fill="#f2d27a"/>
  <circle cx="37.8" cy="29" r="1" fill="#f2d27a"/>
