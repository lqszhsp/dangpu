      <path d="M0 -9.6 Q-7.4 -9.6 -7.4 -1 Q-7.4 7 0 9.4 Q1.6 8.6 2.4 7.4 Q-0.6 3 2.6 -0.6 Q1.6 -5 4.6 -8.2 Q2.6 -9.6 0 -9.6 Z" fill="url(#book_forgery-em)" stroke-width="1"/>
      <path d="M4.6 -8.2 Q1.6 -5 2.6 -0.6 Q-0.6 3 2.4 7.4 Q5.6 5.4 4.4 2.4 Q6.6 -0.4 4.8 -3 Q7 -5.6 4.6 -8.2 Z" fill="#d8c49a" stroke-width="0.9"/>
