<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="book_forgery-cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9aa88a"/>
      <stop offset="0.5" stop-color="#5c6370"/>
      <stop offset="1" stop-color="#3a3f4a"/>
