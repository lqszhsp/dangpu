    <path d="M55 9.6 L58 13.5 L53 10.6 Z"/>
    <path d="M14 10 L13 15 L16.5 9.6 Z"/>
  </g>
  <!-- curled tendril -->
  <path d="M50 10.5 Q54 16 51 19 Q48.5 21 47.5 18.5 Q47 16.5 49.5 16.5" fill="none" stroke="#14101a" stroke-width="1.6" stroke-linecap="round"/>
  <!-- dark leaf -->
  <path d="M40 12 Q48 18 55 18 Q52 12 44 11 Z" fill="#1f1626" stroke="#14101a" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M41.5 12.4 Q48 15.5 53 17" fill="none" stroke="#5e0f1c" stroke-width="0.7"/>
  <!-- cluster stalks -->
  <path d="M29 9 Q30 16 31.5 22 M31.5 22 Q25 24 21 30 M31.5 22 Q37 25 42 30 M31.5 22 Q32 30 31 36 M27 26 Q24 36 25 44 M36 26 Q40 36 38.5 44 M31 36 Q31.5 42 31.5 49" fill="none" stroke="#14101a" stroke-width="1.8" stroke-linecap="round"/>
  <!-- berries (back to front) -->
  <g stroke="#14101a" stroke-width="1.5" fill="url(#vine_fruit-berry)">
    <circle cx="31.5" cy="25" r="5"/>
    <circle cx="21" cy="31" r="5.6"/>
    <circle cx="42" cy="31" r="5.6"/>
    <circle cx="31" cy="35" r="6"/>
    <circle cx="24.5" cy="44" r="6"/>
    <circle cx="38.5" cy="44" r="6"/>
    <circle cx="31.5" cy="52" r="5.4"/>
  </g>
  <!-- inner red glow -->
  <g fill="#e0524a" filter="url(#vine_fruit-blur)" opacity="0.8">
    <circle cx="31" cy="36" r="3"/>
    <circle cx="24.5" cy="45" r="3"/>
    <circle cx="38.5" cy="45" r="3"/>
    <circle cx="31.5" cy="53" r="2.6"/>
    <circle cx="21" cy="32" r="2.6"/>
    <circle cx="42" cy="32" r="2.6"/>
  </g>
  <!-- glossy highlights -->
  <g fill="#f4fbff" opacity="0.85">
    <ellipse cx="29.3" cy="32.4" rx="1.8" ry="1.1" transform="rotate(-30 29.3 32.4)"/>
    <ellipse cx="22.5" cy="41.4" rx="1.8" ry="1.1" transform="rotate(-30 22.5 41.4)"/>
    <ellipse cx="36.5" cy="41.4" rx="1.8" ry="1.1" transform="rotate(-30 36.5 41.4)"/>
    <ellipse cx="29.8" cy="49.6" rx="1.6" ry="1" transform="rotate(-30 29.8 49.6)"/>
    <ellipse cx="19.2" cy="28.6" rx="1.6" ry="1" transform="rotate(-30 19.2 28.6)"/>
    <ellipse cx="40.2" cy="28.6" rx="1.6" ry="1" transform="rotate(-30 40.2 28.6)"/>
    <ellipse cx="30" cy="23" rx="1.4" ry="0.9" transform="rotate(-30 30 23)"/>
  </g>
  <!-- calyx dots -->
  <g fill="#14101a">
    <circle cx="31" cy="29.4" r="0.9"/>
    <circle cx="24.5" cy="38.4" r="0.9"/>
    <circle cx="38.5" cy="38.4" r="0.9"/>
    <circle cx="31.5" cy="47" r="0.8"/>
  </g>
  <!-- dripping juice -->
  <path d="M31.5 57.4 Q33 60 31.5 61 Q30 60 31.5 57.4 Z" fill="#c43a3a" stroke="#14101a" stroke-width="0.6"/>
</svg>
