<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="vine_fruit-berry" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#ffb08a"/>
      <stop offset="0.3" stop-color="#e0524a"/>
      <stop offset="0.7" stop-color="#8e1b2b"/>
      <stop offset="1" stop-color="#3a0814"/>
    </radialGradient>
    <linearGradient id="vine_fruit-vine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4a"/>
      <stop offset="0.5" stop-color="#1f1626"/>
      <stop offset="1" stop-color="#14101a"/>
    </linearGradient>
    <radialGradient id="vine_fruit-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0524a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8e1b2b" stop-opacity="0"/>
    </radialGradient>
    <filter id="vine_fruit-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>
  <circle cx="32" cy="38" r="25" fill="url(#vine_fruit-halo)"/>
  <!-- shadow -->
  <ellipse cx="32" cy="59" rx="16" ry="3" fill="#14101a" opacity="0.5"/>
  <!-- barbed black vine -->
  <path d="M3.5 14 Q16 4 31 9 Q46 14 60 7" fill="none" stroke="#14101a" stroke-width="5.4" stroke-linecap="round"/>
  <path d="M3.5 14 Q16 4 31 9 Q46 14 60 7" fill="none" stroke="url(#vine_fruit-vine)" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M6 12 Q16 5.5 28 8.5" fill="none" stroke="#5c6370" stroke-width="0.9" stroke-linecap="round"/>
  <g fill="#14101a">
    <path d="M10 9.6 L8 4.5 L12.8 8.2 Z"/>
    <path d="M20 7 L21 2 L23 7.4 Z"/>
    <path d="M38 11.7 L40.5 16.5 L35.5 12.2 Z"/>
