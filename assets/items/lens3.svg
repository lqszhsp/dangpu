<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="lens3-iron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c6370"/>
      <stop offset="0.45" stop-color="#3a3f4a"/>
      <stop offset="1" stop-color="#14101a"/>
    </linearGradient>
    <linearGradient id="lens3-bone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe2c4"/>
      <stop offset="0.55" stop-color="#d8c49a"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
    <radialGradient id="lens3-face" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#cfefff"/>
      <stop offset="0.3" stop-color="#4a8fb8"/>
      <stop offset="0.75" stop-color="#2a1838"/>
      <stop offset="1" stop-color="#14101a"/>
    </radialGradient>
    <radialGradient id="lens3-ruby" cx="0.38" cy="0.34" r="0.7">
      <stop offset="0" stop-color="#ffd0c8"/>
      <stop offset="0.3" stop-color="#e0524a"/>
      <stop offset="0.7" stop-color="#8e1b2b"/>
      <stop offset="1" stop-color="#5e0f1c"/>
    </radialGradient>
    <filter id="lens3-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>
  <g transform="rotate(-22 32 32)">
    <!-- aura -->
    <circle cx="32" cy="24" r="19" fill="#4a8fb8" opacity="0.4" filter="url(#lens3-glow)"/>
    <!-- shadow -->
    <circle cx="34.5" cy="25.5" r="18" fill="#14101a" opacity="0.45"/>
    <!-- bone handle -->
    <g stroke="#14101a" stroke-width="1.7" stroke-linejoin="round">
      <path d="M29.6 42 L34.4 42 L34 55 Q37.4 56 36.4 59 Q35 61.4 32 59.8 Q29 61.4 27.6 59 Q26.6 56 30 55 Z" fill="url(#lens3-bone)"/>
      <path d="M28.4 46 L35.6 46 L35.6 49 L28.4 49 Z" fill="url(#lens3-iron)"/>
    </g>
    <path d="M31 50.5 L31 55" stroke="#fff8e6" stroke-width="0.9" stroke-linecap="round" opacity="0.8"/>
    <!-- collar: iron claw -->
    <path d="M25.5 38 L38.5 38 L36 44 L28 44 Z" fill="url(#lens3-iron)" stroke="#14101a" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- iron spikes -->
    <g fill="url(#lens3-iron)" stroke="#14101a" stroke-width="1.4" stroke-linejoin="round">
      <path d="M13.6 17 L8.5 14 L14.6 13 Z"/>
      <path d="M50.4 17 L55.5 14 L49.4 13 Z"/>
      <path d="M14.8 33.4 L10.6 37.6 L17 36 Z"/>
      <path d="M49.2 33.4 L53.4 37.6 L47 36 Z"/>
    </g>
    <!-- iron rim -->
    <circle cx="32" cy="24" r="18" fill="url(#lens3-iron)" stroke="#14101a" stroke-width="2.2"/>
    <!-- bone segments (vertebrae) around rim -->
    <g fill="url(#lens3-bone)" stroke="#14101a" stroke-width="1">
      <g id="lens3-vert">
        <path d="M30 6.4 Q32 5.6 34 6.4 L34.6 9.6 Q32 10.4 29.4 9.6 Z"/>
      </g>
      <use href="#lens3-vert" transform="rotate(36 32 24)"/>
      <use href="#lens3-vert" transform="rotate(72 32 24)"/>
      <use href="#lens3-vert" transform="rotate(108 32 24)"/>
      <use href="#lens3-vert" transform="rotate(144 32 24)"/>
      <use href="#lens3-vert" transform="rotate(216 32 24)"/>
      <use href="#lens3-vert" transform="rotate(252 32 24)"/>
      <use href="#lens3-vert" transform="rotate(288 32 24)"/>
      <use href="#lens3-vert" transform="rotate(324 32 24)"/>
    </g>
    <!-- face -->
    <circle cx="32" cy="24" r="13.4" fill="url(#lens3-face)" stroke="#14101a" stroke-width="1.4"/>
    <!-- bone ghost image in mirror -->
    <g fill="none" stroke="#8fd3ff" stroke-linecap="round" opacity="0.85">
      <path d="M27.4 21.5 Q27.4 16 32 16 Q36.6 16 36.6 21.5 Q36.6 24.4 34.6 25.4 L34.6 27 L29.4 27 L29.4 25.4 Q27.4 24.4 27.4 21.5 Z" stroke-width="1.1"/>
      <path d="M32 27.6 L32 35.6" stroke-width="1.1"/>
      <path d="M32 30 Q27.5 29.6 25.5 32 M32 30 Q36.5 29.6 38.5 32 M32 32.8 Q28 32.6 26.4 34.6 M32 32.8 Q36 32.6 37.6 34.6" stroke-width="0.9"/>
    </g>
    <g fill="#8fd3ff" opacity="0.9">
      <ellipse cx="30.1" cy="21.8" rx="1.4" ry="1.6"/>
      <ellipse cx="33.9" cy="21.8" rx="1.4" ry="1.6"/>
    </g>
    <circle cx="32" cy="24" r="8" fill="#8fd3ff" opacity="0.25" filter="url(#lens3-glow)"/>
    <!-- face highlight -->
    <path d="M22.4 20 Q24 14.4 29.4 12.6" fill="none" stroke="#cfefff" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
    <!-- ruby crown -->
    <path d="M26.6 6.6 L28.4 1.6 L32 4 L35.6 1.6 L37.4 6.6 Z" fill="url(#lens3-iron)" stroke="#14101a" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="32" cy="6.4" r="4" fill="url(#lens3-ruby)" stroke="#14101a" stroke-width="1.4"/>
    <ellipse cx="30.8" cy="5.2" rx="1.3" ry="0.8" fill="#fff3c8" opacity="0.9" transform="rotate(-30 30.8 5.2)"/>
    <!-- rim highlight -->
    <path d="M16.4 18 Q18.4 12 23 9" fill="none" stroke="#9aa88a" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- ghost wisps -->
  <g fill="#8fd3ff" opacity="0.85">
    <circle cx="54" cy="44" r="1.2"/><circle cx="9" cy="40" r="0.9"/><circle cx="50" cy="51" r="0.7"/>
  </g>
</svg>
