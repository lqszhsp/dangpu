  <path d="M60 10 Q52 6 47 12 Q42 18 46 24 Q49 30 40 32.6 Q36 34 33.4 34.4" fill="none" stroke="#cfefff" stroke-width="3.6" stroke-linecap="round" opacity="0.7" filter="url(#fu_shehun-glow)"/>
  <path d="M60 10 Q52 6 47 12 Q42 18 46 24 Q49 30 40 32.6 Q36 34 33.4 34.4" fill="none" stroke="#cfefff" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M60 10 Q52 6 47 12 Q42 18 46 24 Q49 30 40 32.6" fill="none" stroke="#f4fbff" stroke-width="0.7" stroke-linecap="round"/>
  <path d="M58 14 Q53 13 51 17" fill="none" stroke="#8fd3ff" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
