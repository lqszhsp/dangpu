<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fu_shehun-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b3474"/>
      <stop offset="0.5" stop-color="#3d2350"/>
      <stop offset="1" stop-color="#1f1626"/>
    </linearGradient>
    <radialGradient id="fu_shehun-vortex" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14101a"/>
      <stop offset="0.5" stop-color="#5e0f1c"/>
      <stop offset="1" stop-color="#8e1b2b" stop-opacity="0"/>
    </radialGradient>
    <filter id="fu_shehun-glow" x="-40%" y="-40%" width="180%" height="180%">
