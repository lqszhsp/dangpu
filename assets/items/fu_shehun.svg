    <path d="M32 34 Q35 32 34.4 36 Q32.6 40 28 37.6 Q24.4 34 28 29.4 Q32.6 25 38.6 28.6 Q43 33 40 39.6 Q36 45 29 43.6 Q22 41.6 21.6 34" stroke="#e0524a" stroke-width="0.8"/>
  </g>
  <circle cx="32.4" cy="34.6" r="1.6" fill="#14101a"/>
  <!-- outer glyph strokes -->
  <g fill="none" stroke="#c43a3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 22 l4 3 M42 22 l-4 3 M22 47 l4 -3 M42 47 l-4 -3"/>
    <path d="M27 50 Q32 53 37 50 M32 48 v5"/>
