<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="book_corpse-cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b7d5a"/>
      <stop offset="0.5" stop-color="#1f5c4c"/>
      <stop offset="1" stop-color="#14101a"/>
    </linearGradient>
    <linearGradient id="book_corpse-pages" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe2c4"/>
      <stop offset="0.6" stop-color="#d8c49a"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
    <radialGradient id="book_corpse-medal" cx="0.42" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#14101a"/>
      <stop offset="1" stop-color="#1f1626"/>
    </radialGradient>
    <linearGradient id="book_corpse-em" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe2c4"/>
      <stop offset="0.45" stop-color="#d8c49a"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
  </defs>
  <g transform="translate(32 32) rotate(-12) translate(-32.3 -32.3)">
    <!-- shadow -->
    <rect x="16" y="11" width="38.6" height="48.6" rx="2" fill="#14101a" opacity="0.45"/>
    <!-- page block -->
    <path d="M14 9.6 L51.6 10.6 L51.6 56.6 L15.6 56.6 Z" fill="url(#book_corpse-pages)" stroke="#14101a" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M50 13 L50 55 M48.6 55.2 L17 55.2" fill="none" stroke="#8a5a1c" stroke-width="0.6" opacity="0.7"/>
    <path d="M51 16 L51 54" stroke="#fff8e6" stroke-width="0.5" opacity="0.6"/>
    <!-- cover -->
    <rect x="13" y="8" width="36" height="46" rx="1.4" fill="url(#book_corpse-cover)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- spine strip -->
    <path d="M13 8 L19.8 8 L19.8 54 L13 54 Z" fill="#14101a" opacity="0.28"/>
    <path d="M19.8 8.6 L19.8 53.4" stroke="#14101a" stroke-width="0.8" opacity="0.6"/>
    <!-- inner border -->
    <rect x="22" y="10.6" width="24.6" height="40.8" rx="0.6" fill="none" stroke="#9aa88a" stroke-width="0.6" opacity="0.55"/>
    <!-- binding thread -->
    <g stroke="#efe2c4" stroke-width="1" stroke-linecap="round" fill="none">
      <path d="M16.8 12.4 L16.8 49.6"/>
      <path d="M12.6 12.4 L16.8 12.4 M12.6 24.8 L16.8 24.8 M12.6 37.2 L16.8 37.2 M12.6 49.6 L16.8 49.6"/>
    </g>
    <g fill="#14101a"><circle cx="16.8" cy="12.4" r="0.8"/><circle cx="16.8" cy="24.8" r="0.8"/><circle cx="16.8" cy="37.2" r="0.8"/><circle cx="16.8" cy="49.6" r="0.8"/></g>
    <!-- corner wraps -->
    <g fill="#c43a3a" stroke="#14101a" stroke-width="0.8" stroke-linejoin="round">
      <path d="M12.4 7.6 L17 7.6 L17 10.2 L12.4 10.2 Z"/><path d="M12.4 51.8 L17 51.8 L17 54.4 L12.4 54.4 Z"/>
    </g>
    <!-- cover highlight -->
    <path d="M15 9.6 L47 9.6" stroke="#fff8e6" stroke-width="0.9" stroke-linecap="round" opacity="0.45"/>
    <path d="M47.6 11 L47.6 40" stroke="#fff8e6" stroke-width="0.7" stroke-linecap="round" opacity="0.25"/>
    <!-- medallion -->
    <circle cx="34.3" cy="31" r="12.4" fill="#14101a" opacity="0.35"/>
    <circle cx="34.3" cy="31" r="11.6" fill="url(#book_corpse-medal)" stroke="#d9a441" stroke-width="1.4"/>
    <circle cx="34.3" cy="31" r="12.5" fill="none" stroke="#14101a" stroke-width="0.8"/>
    <circle cx="34.3" cy="31" r="10.2" fill="none" stroke="#8a5a1c" stroke-width="0.5"/>
    <g transform="translate(34.3 31)">
    <g stroke="#14101a" stroke-linejoin="round">
      <path d="M-7.6 -1.4 Q-7.6 -9.6 0 -9.6 Q7.6 -9.6 7.6 -1.4 Q7.6 3 4.4 4.4 L4.4 7.6 L-4.4 7.6 L-4.4 4.4 Q-7.6 3 -7.6 -1.4 Z" fill="url(#book_corpse-em)" stroke-width="1.1"/>
      <path d="M-2.4 7.6 L-2.4 5.4 M0 7.6 L0 5.4 M2.4 7.6 L2.4 5.4" stroke-width="0.8"/>
      <ellipse cx="-3.4" cy="0" rx="2.2" ry="2.4" fill="#14101a" stroke="none"/>
      <ellipse cx="3.4" cy="0" rx="2.2" ry="2.4" fill="#14101a" stroke="none"/>
      <circle cx="-3.4" cy="0.2" r="0.8" fill="#7fd6b5" stroke="none"/>
      <circle cx="3.4" cy="0.2" r="0.8" fill="#7fd6b5" stroke="none"/>
      <path d="M0 2.4 L-1 4 L1 4 Z" fill="#14101a" stroke="none"/>
      <path d="M-2 -12 L2 -12 L2.2 -3.4 L-1.8 -3 Z" fill="#f2d27a" stroke-width="0.9" transform="rotate(8)"/>
      <path d="M-0.8 -10.4 L1 -10.4 M0.1 -10.4 L0.1 -7.8 L-0.8 -7 M-0.6 -5.6 L1 -5.4" fill="none" stroke="#c43a3a" stroke-width="0.8" stroke-linecap="round" transform="rotate(8)"/>
    </g>
    <path d="M-6 -3 Q-5.6 -7.4 -2.4 -8.4" fill="none" stroke="#fff8e6" stroke-width="0.9" stroke-linecap="round" opacity="0.8"/>
    </g>
    <path d="M25.4 25 Q27.6 20.6 32 19.6" fill="none" stroke="#f2d27a" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
