  <g filter="url(#bronze_mirror-soft)">
    <path d="M14 52 Q18 36 34 38 Q44 44 40 56 Q34 66 22 64 Q14 62 14 52 Z" fill="#4f8a72" opacity="0.85"/>
    <path d="M74 94 Q86 82 102 90 Q108 102 96 110 Q82 114 76 106 Z" fill="#5a9a80" opacity="0.85"/>
    <path d="M82 16 Q96 14 104 26 Q100 36 90 34 Q82 28 82 16 Z" fill="#4f8a72" opacity="0.8"/>
    <path d="M24 88 Q34 84 38 94 Q34 102 26 100 Z" fill="#6b9a7a" opacity="0.8"/>
    <path d="M56 70 Q62 68 64 74 Q60 78 56 75 Z" fill="#6b9a7a" opacity="0.7"/>
  </g>
  <g fill="#3fae8f" opacity="0.85">
    <circle cx="22" cy="50" r="3"/>
    <circle cx="30" cy="56" r="2"/>
    <circle cx="35" cy="45" r="1.4"/>
    <circle cx="88" cy="98" r="3.2"/>
    <circle cx="96" cy="103" r="1.8"/>
    <circle cx="80" cy="102" r="1.4"/>
    <circle cx="92" cy="24" r="2.4"/>
    <circle cx="98" cy="29" r="1.3"/>
    <circle cx="104" cy="70" r="1.8"/>
    <circle cx="30" cy="93" r="1.8"/>
    <circle cx="50" cy="104" r="1.4"/>
  </g>
  <g fill="#9ad6bd" opacity="0.75">
    <circle cx="20" cy="47" r="1.2"/>
    <circle cx="86" cy="95" r="1.3"/>
    <circle cx="90" cy="21" r="1"/>
  </g>
  <!-- rim highlight -->
  <path d="M18 44 Q28 18 58 9" fill="none" stroke="#fff3c8" stroke-width="2.6" stroke-linecap="round" opacity="0.85"/>
  <path d="M110 84 Q102 104 82 115" fill="none" stroke="#d9a441" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  <path d="M12 64 Q12 50 16 40" fill="none" stroke="#fff3c8" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
</svg>
