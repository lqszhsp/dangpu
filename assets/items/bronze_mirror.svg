<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bronze_mirror-face" cx="0.4" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#a89668"/>
      <stop offset="0.45" stop-color="#7a6a42"/>
      <stop offset="0.85" stop-color="#4e4a30"/>
      <stop offset="1" stop-color="#3a2e1c"/>
    </radialGradient>
    <linearGradient id="bronze_mirror-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d27a"/>
      <stop offset="0.3" stop-color="#b08a4a"/>
      <stop offset="0.7" stop-color="#6b5530"/>
      <stop offset="1" stop-color="#3a2e1c"/>
    </linearGradient>
    <radialGradient id="bronze_mirror-knob" cx="0.38" cy="0.34" r="0.7">
      <stop offset="0" stop-color="#f2d27a"/>
      <stop offset="0.5" stop-color="#a8823e"/>
      <stop offset="1" stop-color="#4a3a20"/>
    </radialGradient>
    <filter id="bronze_mirror-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <!-- shadow -->
  <circle cx="66.5" cy="67.5" r="57" fill="#14101a" opacity="0.4"/>
  <!-- rim -->
  <circle cx="64" cy="64" r="57" fill="url(#bronze_mirror-rim)" stroke="#14101a" stroke-width="2.6"/>
  <circle cx="64" cy="64" r="50.5" fill="url(#bronze_mirror-face)" stroke="#2a2014" stroke-width="1.6"/>
  <!-- pearl band (连珠) -->
  <circle cx="64" cy="64" r="46.5" fill="none" stroke="#3a2e1c" stroke-width="1"/>
  <circle cx="64" cy="64" r="42.5" fill="none" stroke="#d2b77a" stroke-width="3.4" stroke-dasharray="0.01 5.56" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="42.5" fill="none" stroke="#3a2e1c" stroke-width="1" stroke-dasharray="0.01 5.56" stroke-linecap="round" transform="translate(0.6 0.6)" opacity="0.5"/>
  <circle cx="64" cy="64" r="38.5" fill="none" stroke="#3a2e1c" stroke-width="1"/>
  <!-- eight petals -->
  <g stroke="#2a2014" stroke-width="1.3" stroke-linejoin="round">
    <g id="bronze_mirror-petal">
      <path d="M64 31 Q73 39 70.5 50 Q67 55 64 56 Q61 55 57.5 50 Q55 39 64 31 Z" fill="#9a8652"/>
      <path d="M64 36 Q68.5 42 67 49 Q65.5 52 64 52.5" fill="none" stroke="#e2cb8e" stroke-width="1"/>
      <path d="M64 38 L64 52" stroke="#5a4a2c" stroke-width="0.8"/>
    </g>
    <use href="#bronze_mirror-petal" transform="rotate(45 64 64)"/>
    <use href="#bronze_mirror-petal" transform="rotate(90 64 64)"/>
    <use href="#bronze_mirror-petal" transform="rotate(135 64 64)"/>
    <use href="#bronze_mirror-petal" transform="rotate(180 64 64)"/>
    <use href="#bronze_mirror-petal" transform="rotate(225 64 64)"/>
    <use href="#bronze_mirror-petal" transform="rotate(270 64 64)"/>
    <use href="#bronze_mirror-petal" transform="rotate(315 64 64)"/>
  </g>
  <!-- knob seat -->
  <circle cx="64" cy="64" r="12.5" fill="#6b5530" stroke="#2a2014" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="12.5" fill="none" stroke="#d2b77a" stroke-width="1" stroke-dasharray="2 2"/>
  <!-- knob -->
  <circle cx="64" cy="64" r="8.5" fill="url(#bronze_mirror-knob)" stroke="#14101a" stroke-width="1.6"/>
  <path d="M57.5 63.5 Q64 61 70.5 63.5" fill="none" stroke="#2a2014" stroke-width="2.2"/>
  <ellipse cx="61" cy="60.5" rx="2.6" ry="1.6" fill="#fff3c8" opacity="0.8" transform="rotate(-30 61 60.5)"/>
