<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="corpse_poison-clay" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#5c6370"/>
      <stop offset="0.35" stop-color="#2a2f36"/>
      <stop offset="0.8" stop-color="#1f1626"/>
      <stop offset="1" stop-color="#14101a"/>
    </radialGradient>
    <radialGradient id="corpse_poison-mist" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#3fae8f" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#1f5c4c" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#1f5c4c" stop-opacity="0"/>
    </radialGradient>
    <filter id="corpse_poison-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>
  <!-- rising mist (back) -->
  <g filter="url(#corpse_poison-blur)">
    <ellipse cx="31" cy="12" rx="17" ry="10" fill="url(#corpse_poison-mist)"/>
    <path d="M24 14 Q16 10 18 4 M38 12 Q47 9 45 3 M30 10 Q28 5 32 2" fill="none" stroke="#3fae8f" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
  </g>
  <!-- shadow -->
  <ellipse cx="32" cy="58.5" rx="19" ry="3.4" fill="#14101a" opacity="0.5"/>
  <!-- jar body -->
  <path d="M26 17 L38 17 L37.5 23 Q50 27 50 41 Q50 53 42 56.5 Q32 59.5 22 56.5 Q14 53 14 41 Q14 27 26.5 23 Z" fill="url(#corpse_poison-clay)" stroke="#14101a" stroke-width="2" stroke-linejoin="round"/>
  <!-- glaze band -->
  <path d="M16.5 33 Q32 38 47.5 33" fill="none" stroke="#3a3f4a" stroke-width="1.2"/>
  <path d="M15 47 Q32 53 49 47" fill="none" stroke="#3a3f4a" stroke-width="1.2"/>
  <!-- skull motif -->
  <g fill="none" stroke="#d8c49a" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" opacity="0.9">
    <path d="M26.5 41 Q26 34.5 32 34.5 Q38 34.5 37.5 41 Q37.5 43.5 35.5 44.2 L35.3 47 L28.7 47 L28.5 44.2 Q26.5 43.5 26.5 41 Z"/>
    <path d="M30.5 44.6 V47 M33.5 44.6 V47"/>
  </g>
  <ellipse cx="29.6" cy="40.2" rx="1.7" ry="1.9" fill="#d8c49a" opacity="0.9"/>
  <ellipse cx="34.4" cy="40.2" rx="1.7" ry="1.9" fill="#d8c49a" opacity="0.9"/>
  <circle cx="29.6" cy="40.4" r="0.8" fill="#3fae8f"/>
  <circle cx="34.4" cy="40.4" r="0.8" fill="#3fae8f"/>
  <!-- glaze highlight -->
  <path d="M19 37 Q19.5 30 25.5 26.5" fill="none" stroke="#9aa88a" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <circle cx="20" cy="41.5" r="0.9" fill="#9aa88a" opacity="0.6"/>
  <path d="M45.5 44 Q44 51 38 54.5" fill="none" stroke="#3fae8f" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
  <!-- lip -->
  <ellipse cx="32" cy="16.5" rx="8" ry="2.8" fill="#3a3f4a" stroke="#14101a" stroke-width="1.6"/>
  <ellipse cx="32" cy="16.6" rx="5.2" ry="1.5" fill="#14101a"/>
  <!-- overflowing ooze -->
  <path d="M25 17 Q24 21 25 24 Q26 26 25.6 29 Q27.5 27 27.4 24 Q28 20 29 18 Z" fill="#1f5c4c" stroke="#14101a" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M37.5 17.5 Q39 20 38.6 23.5 Q40 22 40 19 Z" fill="#1f5c4c" stroke="#14101a" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M25.9 20 Q25.7 23 26.4 25" fill="none" stroke="#7fd6b5" stroke-width="0.7" stroke-linecap="round"/>
  <circle cx="25.6" cy="31" r="0.9" fill="#3fae8f"/>
