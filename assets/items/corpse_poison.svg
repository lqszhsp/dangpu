  <g fill="none" stroke-linecap="round">
    <path d="M29 15 Q24 11 27 7.5 Q30 5 28 2.5" stroke="#3fae8f" stroke-width="1.6"/>
    <path d="M35 15 Q40 11.5 37.5 8 Q36 6 39 4" stroke="#1f5c4c" stroke-width="1.8"/>
    <path d="M33 14 Q34.5 11 32.5 9" stroke="#7fd6b5" stroke-width="0.9"/>
