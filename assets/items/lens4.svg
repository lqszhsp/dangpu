<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="lens4-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2d27a" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#d9a441" stop-opacity="0.45"/>
      <stop offset="0.75" stop-color="#5b3474" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3d2350" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lens4-orb" cx="0.4" cy="0.36" r="0.68">
      <stop offset="0" stop-color="#fff3c8"/>
      <stop offset="0.3" stop-color="#f2d27a"/>
      <stop offset="0.65" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </radialGradient>
    <radialGradient id="lens4-iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8902f"/>
      <stop offset="0.55" stop-color="#d9a441"/>
      <stop offset="0.85" stop-color="#f2d27a"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </radialGradient>
    <linearGradient id="lens4-pupil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14101a"/>
      <stop offset="0.5" stop-color="#3d2350"/>
      <stop offset="1" stop-color="#14101a"/>
    </linearGradient>
    <filter id="lens4-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>
  <!-- halo -->
  <circle cx="32" cy="29" r="28" fill="url(#lens4-halo)"/>
  <!-- rays -->
  <g stroke="#f2d27a" stroke-linecap="round" opacity="0.85">
    <path d="M32 2.5 L32 6.5 M32 51.5 L32 55.5 M5.5 29 L9.5 29 M54.5 29 L58.5 29" stroke-width="1.8"/>
    <path d="M13.3 10.3 L16 13 M50.7 10.3 L48 13 M13.3 47.7 L16 45 M50.7 47.7 L48 45" stroke-width="1.2"/>
  </g>
  <!-- ground shadow (floating) -->
  <ellipse cx="32" cy="60" rx="12" ry="2" fill="#14101a" opacity="0.5"/>
  <ellipse cx="32" cy="59.6" rx="7" ry="1.2" fill="#d9a441" opacity="0.4"/>
  <!-- back half of tilted rune ring -->
  <g fill="none" stroke-linecap="round">
    <path d="M7.5 33 Q8 21 32 19.6 Q56 21 56.5 33" stroke="#14101a" stroke-width="3.8"/>
    <path d="M7.5 33 Q8 21 32 19.6 Q56 21 56.5 33" stroke="#8a5a1c" stroke-width="2"/>
  </g>
  <!-- vertical ring (back) -->
  <ellipse cx="32" cy="29" rx="7" ry="23" fill="none" stroke="#d9a441" stroke-width="1" opacity="0.55"/>
  <!-- orb -->
  <circle cx="32" cy="29" r="15.5" fill="#f2d27a" opacity="0.8" filter="url(#lens4-glow)"/>
  <circle cx="32" cy="29" r="15" fill="url(#lens4-orb)" stroke="#14101a" stroke-width="2"/>
  <!-- eye white / sclera area -->
  <path d="M19.5 29 Q32 15.5 44.5 29 Q32 42.5 19.5 29 Z" fill="#fff3c8" stroke="#14101a" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- iris -->
  <circle cx="32" cy="29" r="8.4" fill="url(#lens4-iris)" stroke="#8a5a1c" stroke-width="1"/>
  <g stroke="#9a4d12" stroke-width="0.7" opacity="0.7">
    <path d="M32 21.4 L32 23.6 M32 34.4 L32 36.6 M25.4 25.2 L27.2 26.4 M38.6 25.2 L36.8 26.4 M25.4 32.8 L27.2 31.6 M38.6 32.8 L36.8 31.6"/>
  </g>
  <!-- slit pupil -->
  <path d="M32 20.8 Q35.4 29 32 37.2 Q28.6 29 32 20.8 Z" fill="url(#lens4-pupil)" stroke="#14101a" stroke-width="0.9"/>
  <path d="M32 24 Q33.2 29 32 34" stroke="#5b3474" stroke-width="0.9" fill="none" opacity="0.9"/>
  <!-- eye clip shading -->
  <path d="M19.5 29 Q32 15.5 44.5 29" fill="none" stroke="#8a5a1c" stroke-width="1.4" opacity="0.6"/>
  <!-- highlights -->
  <ellipse cx="29.2" cy="25.6" rx="1.8" ry="1.2" fill="#f4fbff"/>
  <path d="M21.4 20.6 Q25 15.8 30.4 15" fill="none" stroke="#fff8e6" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
  <!-- front half of tilted rune ring -->
  <g fill="none" stroke-linecap="round">
    <path d="M7.5 33 Q8 45 32 46.4 Q56 45 56.5 33" stroke="#14101a" stroke-width="4.4"/>
    <path d="M7.5 33 Q8 45 32 46.4 Q56 45 56.5 33" stroke="#d9a441" stroke-width="2.6"/>
    <path d="M10 37 Q16 44 32 45" stroke="#fff3c8" stroke-width="0.9" opacity="0.8"/>
  </g>
  <!-- rune marks on ring -->
  <g fill="none" stroke="#5e0f1c" stroke-width="0.9" stroke-linecap="round">
    <path d="M15.6 41.4 l1.6 1 M17.4 40.6 l0 2.4"/>
    <path d="M25 44.2 l2 0.4 M26 43.2 l0 2.2"/>
    <path d="M37 44.6 l2 -0.4 M38 43.4 l0.2 2.2"/>
    <path d="M46.4 42.4 l1.6 -1 M47.4 40.4 l0 2.4"/>
  </g>
  <!-- rune nodes -->
  <g fill="#c43a3a" stroke="#14101a" stroke-width="0.9">
    <circle cx="7.6" cy="33" r="2.2"/>
    <circle cx="56.4" cy="33" r="2.2"/>
    <circle cx="32" cy="46.4" r="2.2"/>
  </g>
  <!-- sparkles -->
  <g fill="#fff3c8">
    <path d="M52 8 L53 11 L56 12 L53 13 L52 16 L51 13 L48 12 L51 11 Z"/>
    <path d="M10 46 L10.7 48 L12.7 48.7 L10.7 49.4 L10 51.4 L9.3 49.4 L7.3 48.7 L9.3 48 Z"/>
    <circle cx="9" cy="14" r="1"/>
    <circle cx="55" cy="49" r="0.9"/>
  </g>
</svg>
