<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 192">
  <defs>
    <linearGradient id="puppet_doll-wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a2f10"/>
      <stop offset="0.35" stop-color="#d9a441"/>
      <stop offset="0.65" stop-color="#9a4d12"/>
      <stop offset="1" stop-color="#4a250c"/>
    </linearGradient>
    <linearGradient id="puppet_doll-mask" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe2c4"/>
      <stop offset="0.5" stop-color="#d8c49a"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
    <radialGradient id="puppet_doll-bronze" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#f2d27a"/>
      <stop offset="0.45" stop-color="#d9a441"/>
      <stop offset="0.8" stop-color="#6b7d5a"/>
      <stop offset="1" stop-color="#3a3f4a"/>
    </radialGradient>
    <radialGradient id="puppet_doll-pearl" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="0.3" stop-color="#cfa8ff"/>
      <stop offset="0.7" stop-color="#5b3474"/>
      <stop offset="1" stop-color="#2a1838"/>
    </radialGradient>
    <filter id="puppet_doll-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <!-- shadow -->
  <ellipse cx="32" cy="185" rx="22" ry="4" fill="#14101a" opacity="0.5"/>
