  <rect x="29.5" y="38" width="5" height="10" fill="#6b7d5a" stroke="#14101a" stroke-width="1.3"/>
  <circle cx="32" cy="44" r="3.6" fill="url(#puppet_doll-bronze)" stroke="#14101a" stroke-width="1.3"/>
