    <circle cx="32" cy="59.4" r="0.8"/>
    <circle cx="32" cy="73.6" r="0.8"/>
    <circle cx="24.9" cy="66.5" r="0.8"/>
    <circle cx="39.1" cy="66.5" r="0.8"/>
  </g>
  <!-- shoulder joints -->
  <path d="M13 51.5 H51" stroke="#14101a" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M13 51.5 H51" stroke="#9aa88a" stroke-width="1.8" stroke-linecap="round"/>
  <g fill="url(#puppet_doll-bronze)" stroke="#14101a" stroke-width="1.5">
