  <path d="M22 70 Q23 76 22 81 M42 66 Q41 72 42.5 78" fill="none" stroke="#5a2f10" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M18.5 52 Q19 70 21.5 90" fill="none" stroke="#f2d27a" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
