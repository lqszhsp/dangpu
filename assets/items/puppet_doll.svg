  <path d="M22.5 18 Q22.5 10.5 32 10.5 Q41.5 10.5 41.5 18 L41 28 Q40 37.5 32 38.5 Q24 37.5 23 28 Z" fill="url(#puppet_doll-mask)" stroke="#14101a" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M21 16 Q32 12 43 16" fill="none" stroke="#14101a" stroke-width="3" stroke-linecap="round"/>
  <path d="M21 16 Q32 12 43 16" fill="none" stroke="#d9a441" stroke-width="1.5" stroke-linecap="round"/>
  <!-- glowing blue eyes -->
  <g fill="#8fd3ff" filter="url(#puppet_doll-glow)">
    <ellipse cx="27.3" cy="22.5" rx="3.4" ry="1.8"/>
    <ellipse cx="36.7" cy="22.5" rx="3.4" ry="1.8"/>
