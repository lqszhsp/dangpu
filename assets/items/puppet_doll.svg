    <path d="M49 114.5 L55.5 114 L55.8 120 L54.8 124.5 L53.4 121.5 L52.2 126 L51 121.5 L50 125 L48.5 121 Z"/>
  </g>
  <g fill="url(#puppet_doll-bronze)" stroke="#14101a" stroke-width="1.3">
