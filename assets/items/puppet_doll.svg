  <path d="M19 175.5 L28.5 175.5 L29.5 182 L15.5 182 Q15.5 177.5 19 175.5 Z" fill="url(#puppet_doll-wood)" stroke="#14101a" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M35.5 175.5 L45 175.5 Q48.5 177.5 48.5 182 L34.5 182 Z" fill="url(#puppet_doll-wood)" stroke="#14101a" stroke-width="1.5" stroke-linejoin="round"/>
