  <path d="M24.5 22.5 Q27.3 20.6 30.1 22.5 Q27.3 24 24.5 22.5 Z M33.9 22.5 Q36.7 20.6 39.5 22.5 Q36.7 24 33.9 22.5 Z" fill="#cfefff" stroke="#14101a" stroke-width="0.9" stroke-linejoin="round"/>
  <!-- flat nose & mouth -->
  <path d="M32 24.5 V29.5 M29 33.5 H35" fill="none" stroke="#8a5a1c" stroke-width="1" stroke-linecap="round"/>
  <path d="M25 19.5 Q24.5 28 27 33" fill="none" stroke="#efe2c4" stroke-width="1.1" stroke-linecap="round" opacity="0.8"/>
  <!-- mask pegs -->
  <circle cx="23.2" cy="27" r="1.1" fill="#d9a441" stroke="#14101a" stroke-width="0.6"/>
  <circle cx="40.8" cy="27" r="1.1" fill="#d9a441" stroke="#14101a" stroke-width="0.6"/>
