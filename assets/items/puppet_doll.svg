  <circle cx="32" cy="66.5" r="12.5" fill="#cfa8ff" opacity="0.75" filter="url(#puppet_doll-glow)"/>
  <circle cx="32" cy="66.5" r="8" fill="url(#puppet_doll-bronze)" stroke="#14101a" stroke-width="1.5"/>
  <circle cx="32" cy="66.5" r="6" fill="url(#puppet_doll-pearl)" stroke="#14101a" stroke-width="1.2"/>
  <path d="M29 64 Q31 62 33.5 63.5" fill="none" stroke="#f4fbff" stroke-width="0.9" stroke-linecap="round"/>
