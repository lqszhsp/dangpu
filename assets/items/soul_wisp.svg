<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="soul_wisp-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fd3ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8fd3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="soul_wisp-glass" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#cfefff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#4a8fb8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#1f1626" stop-opacity="0.75"/>
    </radialGradient>
    <radialGradient id="soul_wisp-ghost" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="0.45" stop-color="#cfefff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4a8fb8" stop-opacity="0.2"/>
    </radialGradient>
    <linearGradient id="soul_wisp-paper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a441"/>
      <stop offset="0.5" stop-color="#f2d27a"/>
      <stop offset="1" stop-color="#b98a3a"/>
    </linearGradient>
    <filter id="soul_wisp-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <circle cx="32" cy="38" r="27" fill="url(#soul_wisp-halo)"/>
  <!-- shadow -->
  <ellipse cx="32" cy="58.5" rx="17" ry="3.2" fill="#14101a" opacity="0.45"/>
  <!-- bottle back -->
  <path d="M26.5 13 L37.5 13 L37.5 20 Q51 24 51 39.5 Q51 58 32 58 Q13 58 13 39.5 Q13 24 26.5 20 Z" fill="url(#soul_wisp-glass)"/>
  <!-- ghost glow -->
  <g filter="url(#soul_wisp-blur)" opacity="0.9">
    <path d="M32 26 Q42 28 42 38 Q42 46 35 49 Q30 52 26 50 Q20 47 22 40 Q22 30 32 26 Z" fill="#8fd3ff"/>
  </g>
  <!-- ghost body with tail -->
  <path d="M32 27.5 Q40.5 28.5 40.5 37.5 Q40.5 44 35 46.5 Q31 48.5 29 51 Q27.5 53.5 24 53 Q27 51 25.5 48.5 Q21.5 45 22.5 38.5 Q23.5 28.5 32 27.5 Z" fill="url(#soul_wisp-ghost)" opacity="0.92"/>
  <path d="M38 45 Q42 48 41 52 Q40 49 36.5 48" fill="#cfefff" opacity="0.55"/>
  <path d="M24 31 Q22 26 25 22 Q25.5 26 27.5 28.5" fill="#cfefff" opacity="0.6"/>
  <!-- blurred face -->
  <g fill="#4a8fb8" opacity="0.75">
    <ellipse cx="28.5" cy="36" rx="2.3" ry="3"/>
    <ellipse cx="35.5" cy="36" rx="2.3" ry="3"/>
    <ellipse cx="32" cy="42.5" rx="1.8" ry="2.4"/>
  </g>
  <g fill="#1f1626" opacity="0.5">
    <ellipse cx="28.5" cy="36.4" rx="1.2" ry="1.8"/>
    <ellipse cx="35.5" cy="36.4" rx="1.2" ry="1.8"/>
  </g>
  <!-- bottle outline -->
  <path d="M26.5 13 L37.5 13 L37.5 20 Q51 24 51 39.5 Q51 58 32 58 Q13 58 13 39.5 Q13 24 26.5 20 Z" fill="none" stroke="#14101a" stroke-width="2" stroke-linejoin="round"/>
  <!-- glass highlights -->
  <path d="M18 34 Q19.5 26.5 26 24" fill="none" stroke="#f4fbff" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M17 41 Q17 43 17.6 45" fill="none" stroke="#f4fbff" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  <path d="M46 46 Q43 53 36 55.5" fill="none" stroke="#8fd3ff" stroke-width="1.1" stroke-linecap="round" opacity="0.6"/>
  <path d="M29 14.5 L29 20" stroke="#f4fbff" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- neck rim -->
  <rect x="24.5" y="11" width="15" height="4" rx="1.8" fill="#4a8fb8" stroke="#14101a" stroke-width="1.6"/>
  <!-- talisman paper seal over stopper -->
  <path d="M24 11.5 Q24 3.5 32 3 Q40 3.5 40 11.5 Z" fill="url(#soul_wisp-paper)" stroke="#14101a" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M38.5 11 L44 13 L45.5 27 L41 25.5 Z" fill="url(#soul_wisp-paper)" stroke="#14101a" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M42 15 L42.6 18 M41.5 19.5 L43.5 20.5 M42.8 21.5 L43.2 24" stroke="#c43a3a" stroke-width="1" stroke-linecap="round"/>
  <path d="M28.5 6.5 L35.5 6.5 M32 4.5 L32 10 M29.5 8.5 Q32 10.5 34.5 8.5" fill="none" stroke="#c43a3a" stroke-width="1.1" stroke-linecap="round"/>
  <!-- red string -->
  <path d="M23.8 11.6 Q32 13.8 40.2 11.6" fill="none" stroke="#8e1b2b" stroke-width="2" stroke-linecap="round"/>
  <path d="M23.8 11.6 Q32 13.2 40.2 11.6" fill="none" stroke="#e0524a" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M24.5 12 Q20 15 21 20 M24.5 12 Q19 13 17.5 17" fill="none" stroke="#c43a3a" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="24.4" cy="12" r="1.4" fill="#c43a3a" stroke="#14101a" stroke-width="0.7"/>
</svg>
