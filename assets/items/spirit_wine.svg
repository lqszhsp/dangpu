  <path d="M17 28 C14.6 22 15.4 15 21 11 C26 7.6 38 7.6 43 11 C48.6 15 49.4 22 47 28 C44.4 25.4 42 30.4 38.6 27.6 C35.6 31 32.6 26.4 29.4 29.4 C26.4 26.4 24 30.6 21.4 27.6 C19.8 29 18.4 29.4 17 28 Z" fill="url(#spirit_wine-cloth)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M22.6 13 C26 10.6 30 10 34 10.2" fill="none" stroke="#ffb3a8" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <path d="M22 26 C22.6 21 23.6 16.4 25.6 13.6 M30 27.6 L31 15 M38.6 26.6 C39 21 39 17 38 13.6 M44.6 25 C44.6 21 44 17.6 42.4 14.6" fill="none" stroke="#5e0f1c" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
