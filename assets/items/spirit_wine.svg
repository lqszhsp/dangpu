<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 128">
  <defs>
    <linearGradient id="spirit_wine-glaze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14101a"/>
      <stop offset="0.25" stop-color="#5e0f1c"/>
      <stop offset="0.42" stop-color="#9a4d12"/>
      <stop offset="0.6" stop-color="#5e0f1c"/>
      <stop offset="1" stop-color="#14101a"/>
    </linearGradient>
    <linearGradient id="spirit_wine-clay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e0f1c"/>
      <stop offset="0.4" stop-color="#d8c49a"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
    <linearGradient id="spirit_wine-cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0524a"/>
      <stop offset="0.5" stop-color="#c43a3a"/>
      <stop offset="1" stop-color="#5e0f1c"/>
    </linearGradient>
    <linearGradient id="spirit_wine-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0524a"/>
      <stop offset="0.6" stop-color="#c43a3a"/>
      <stop offset="1" stop-color="#8e1b2b"/>
    </linearGradient>
  </defs>
  <ellipse cx="32" cy="121" rx="22" ry="4" fill="#14101a" opacity="0.45"/>
  <!-- foot ring -->
  <path d="M17 112 L47 112 L45.5 120 C40 122 24 122 18.5 120 Z" fill="url(#spirit_wine-clay)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
