  <path d="M21.5 22 C27 24.8 37 24.8 42.5 22" fill="none" stroke="#14101a" stroke-width="3" stroke-linecap="round"/>
  <path d="M21.5 22 C27 24.8 37 24.8 42.5 22" fill="none" stroke="#d9a441" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M41 23.2 C44 26 45 30 44 34 M41 23.2 C42 27 41.6 31 40 34.4" fill="none" stroke="#14101a" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M41 23.2 C44 26 45 30 44 34 M41 23.2 C42 27 41.6 31 40 34.4" fill="none" stroke="#d9a441" stroke-width="1" stroke-linecap="round"/>
</svg>
