  <path d="M26 11 C26 6.6 29 5 32 5 C35 5 38 6.6 38 11 C35 12.2 29 12.2 26 11 Z" fill="url(#spirit_wine-cloth)" stroke="#14101a" stroke-width="1.5" stroke-linejoin="round"/>
