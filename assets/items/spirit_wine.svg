  <path d="M20 39 C17.4 41 15.6 43 14.6 45" fill="none" stroke="#fff1c8" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <path d="M51 60 C51.6 72 50 90 46 106" fill="none" stroke="#e8902f" stroke-width="0.9" stroke-linecap="round" opacity="0.3"/>
  <!-- seal paper (blank, diamond) -->
  <path d="M32 54 L48 72 L32 90 L16 72 Z" fill="#14101a" opacity="0.4" transform="translate(1.2 1.6)"/>
  <path d="M32 54 L48 72 L32 90 L16 72 Z" fill="url(#spirit_wine-paper)" stroke="#14101a" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M32 58.4 L44 72 L32 85.6 L20 72 Z" fill="none" stroke="#8e1b2b" stroke-width="1" stroke-linejoin="round" opacity="0.8"/>
