<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="live_soul-body" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="0.4" stop-color="#cfefff"/>
      <stop offset="0.75" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#4a8fb8" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="live_soul-head" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="0.6" stop-color="#cfefff"/>
      <stop offset="1" stop-color="#8fd3ff"/>
    </radialGradient>
    <radialGradient id="live_soul-halo" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#8fd3ff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#4a8fb8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#4a8fb8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="live_soul-paper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a441"/>
      <stop offset="0.5" stop-color="#f2d27a"/>
      <stop offset="1" stop-color="#d9a441"/>
    </linearGradient>
    <filter id="live_soul-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>
  <circle cx="32" cy="28" r="30" fill="url(#live_soul-halo)"/>
  <!-- glow body behind -->
  <path d="M32 6 Q45 6 44 20 Q50 26 49 36 Q47 46 38 52 Q30 58 22 60" fill="none" stroke="#8fd3ff" stroke-width="7" stroke-linecap="round" opacity="0.6" filter="url(#live_soul-blur)"/>
  <!-- wisp body with flailing arms -->
  <path d="M24 26 Q15 24 9 15 Q8 12 10.5 13 Q15 19 22 20 Q21 8 32 7 Q43 8 42 20 Q49 19 53.5 13 Q56 12 55 15 Q49 25 40.5 27 Q44 34 41 42 Q38 49 32 53 Q26 58 18 59.5 Q22 55 24.5 50 Q19 54 13 54 Q19 49 21 42 Q20 34 24 26 Z" fill="url(#live_soul-body)" stroke="#14101a" stroke-width="2" stroke-linejoin="round"/>
  <!-- inner glow strokes -->
  <path d="M27 30 Q25 38 27 46 M37 31 Q38 38 35 45" fill="none" stroke="#f4fbff" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  <path d="M38.5 44 Q34 51 26 55" fill="none" stroke="#4a8fb8" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <!-- clawing fingers -->
  <path d="M9.5 13 L8 10 M11.5 12.5 L11 9.5 M54.5 13 L56 10 M52.5 12.5 L53 9.5" stroke="#14101a" stroke-width="1.4" stroke-linecap="round"/>
  <!-- head -->
  <path d="M22.5 19 Q22 8 32 7.5 Q42 8 41.5 19 Q41 27 32 29 Q23 27 22.5 19 Z" fill="url(#live_soul-head)" stroke="#14101a" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- anguished face -->
  <path d="M25.2 18.2 Q27 15.6 30.6 14.8 Q31 19.2 28.4 20.2 Q25.6 20.6 25.2 18.2 Z" fill="#1f1626"/>
  <path d="M38.8 18.2 Q37 15.6 33.4 14.8 Q33 19.2 35.6 20.2 Q38.4 20.6 38.8 18.2 Z" fill="#1f1626"/>
  <path d="M24.6 15.4 Q27.5 14.4 30.4 12.2 M39.4 15.4 Q36.5 14.4 33.6 12.2" fill="none" stroke="#14101a" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M31.2 12.6 Q32 14 32.8 12.6" fill="none" stroke="#4a8fb8" stroke-width="0.7" stroke-linecap="round"/>
  <circle cx="29" cy="17.4" r="0.8" fill="#8fd3ff"/>
  <circle cx="35" cy="17.4" r="0.8" fill="#8fd3ff"/>
  <path d="M29.4 25.8 Q29.6 21.2 32 21 Q34.4 21.2 34.6 25.8 Q32 27.2 29.4 25.8 Z" fill="#1f1626"/>
  <path d="M27.5 20.5 Q27 23.5 28 26 M36.5 20.5 Q37 23.5 36 26" fill="none" stroke="#4a8fb8" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>
  <!-- highlight -->
  <path d="M25 11.5 Q27.5 9 31 8.8" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="0.9"/>
  <!-- red binding thread (back segments) -->
  <path d="M41 33 Q32 30 22 35 M41.5 41 Q32 38 21 43" fill="none" stroke="#5e0f1c" stroke-width="1.4" opacity="0.6"/>
  <!-- red binding thread (front segments) -->
  <g fill="none" stroke-linecap="round">
    <path d="M22 35 Q32 39.5 41.5 33 M21 43 Q31 47 40 41 M40.5 27 Q31 31 23.5 26.5" stroke="#14101a" stroke-width="2.6"/>
    <path d="M22 35 Q32 39.5 41.5 33 M21 43 Q31 47 40 41 M40.5 27 Q31 31 23.5 26.5" stroke="#c43a3a" stroke-width="1.3"/>
    <path d="M41.5 33 Q48 36 50 44 Q51 50 56 52" stroke="#14101a" stroke-width="2.4"/>
    <path d="M41.5 33 Q48 36 50 44 Q51 50 56 52" stroke="#e0524a" stroke-width="1.1"/>
  </g>
  <!-- knot -->
  <circle cx="41.5" cy="33" r="2" fill="#8e1b2b" stroke="#14101a" stroke-width="1"/>
  <!-- talisman tags -->
  <g stroke="#14101a" stroke-width="1.1" stroke-linejoin="round">
    <path d="M49 44 L54.5 42.5 L57.5 54 L52 55.5 Z" fill="url(#live_soul-paper)"/>
    <path d="M28.5 37.5 L33 38 L32.5 47 L28 46.5 Z" fill="url(#live_soul-paper)"/>
  </g>
  <g fill="none" stroke="#c43a3a" stroke-width="0.9" stroke-linecap="round">
    <path d="M51.5 45.5 L54.2 44.8 M52.8 45 L54.5 53 M52 49 L55 48.2 M53 51.5 Q54.5 50.5 55.8 52"/>
    <path d="M29.6 39.6 L32 39.8 M30.8 39 L30.5 46 M29.5 42.5 L32 42.8"/>
  </g>
  <!-- loose motes -->
  <g fill="#cfefff">
    <circle cx="12" cy="30" r="1"/><circle cx="52" cy="26" r="0.9"/><circle cx="8" cy="44" r="0.8"/>
  </g>
</svg>
