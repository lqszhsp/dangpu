<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="vine_seed-body" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#e0524a"/>
      <stop offset="0.4" stop-color="#8e1b2b"/>
      <stop offset="0.85" stop-color="#5e0f1c"/>
      <stop offset="1" stop-color="#2a0a12"/>
    </radialGradient>
    <radialGradient id="vine_seed-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c43a3a" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#5e0f1c" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#5e0f1c" stop-opacity="0"/>
    </radialGradient>
    <filter id="vine_seed-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="28" fill="url(#vine_seed-halo)"/>
  <!-- pulse rings -->
  <g fill="none" stroke="#c43a3a" stroke-linecap="round">
    <path d="M9 22 Q5.5 32 9.5 42" stroke-width="1.6" opacity="0.7"/>
    <path d="M55 22 Q58.5 32 54.5 42" stroke-width="1.6" opacity="0.7"/>
    <path d="M5 18 Q0.5 32 5.5 46" stroke-width="1" opacity="0.4"/>
    <path d="M59 18 Q63.5 32 58.5 46" stroke-width="1" opacity="0.4"/>
  </g>
  <!-- shadow -->
  <ellipse cx="32" cy="57" rx="17" ry="3.4" fill="#14101a" opacity="0.5"/>
  <!-- root tendrils -->
  <path d="M30 51 Q27 55 22 55.5 Q19 56 18 59 M33 52 Q36 56 41 56 Q44 56.5 45.5 59" fill="none" stroke="#14101a" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M30 51 Q27 55 22 55.5 M33 52 Q36 56 41 56" fill="none" stroke="#5e0f1c" stroke-width="1" stroke-linecap="round"/>
  <!-- heart-shaped seed -->
  <path d="M32 18 Q37 9.5 45.5 10.5 Q54 12.5 53.5 22.5 Q52.5 33 42 42.5 Q36.5 47.5 32 53 Q27.5 47.5 22 42.5 Q11.5 33 10.5 22.5 Q10 12.5 18.5 10.5 Q27 9.5 32 18 Z" fill="url(#vine_seed-body)" stroke="#14101a" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- sprout tip -->
  <path d="M32 18 Q31 12 34 8 Q36 5 39.5 5.5 Q37 8.5 36.5 11 Q35.5 14.5 32 18 Z" fill="#5e0f1c" stroke="#14101a" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- vein network -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 50 Q31 40 32 30 Q32.5 24 32 19 M31.6 40 Q25 36 19 37 M31.8 33 Q24 28 16 26 M24 28.5 Q21 23 22 17 M32 30 Q39 26 45 18 M39.5 25.5 Q45 25 49.5 27 M32.2 41 Q38.5 38 43 33" stroke="#14101a" stroke-width="2"/>
    <path d="M32 50 Q31 40 32 30 Q32.5 24 32 19 M31.6 40 Q25 36 19 37 M31.8 33 Q24 28 16 26 M24 28.5 Q21 23 22 17 M32 30 Q39 26 45 18 M39.5 25.5 Q45 25 49.5 27 M32.2 41 Q38.5 38 43 33" stroke="#c43a3a" stroke-width="0.9"/>
  </g>
  <!-- pulsing glow in veins -->
  <g filter="url(#vine_seed-blur)" fill="none" stroke="#e0524a" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M32 46 Q31 38 32 30 M31.8 33 Q24 28 18 26.5 M32 30 Q39 26 44 19.5"/>
  </g>
  <circle cx="32" cy="31" r="2.2" fill="#f2d27a" opacity="0.85" filter="url(#vine_seed-blur)"/>
  <circle cx="32" cy="31" r="1" fill="#f2d27a"/>
  <!-- glossy highlights -->
  <path d="M15.5 18.5 Q17 13.5 22.5 13" fill="none" stroke="#f4d0d0" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>
  <ellipse cx="45" cy="15.5" rx="2.6" ry="1.4" fill="#f4d0d0" opacity="0.5" transform="rotate(20 45 15.5)"/>
  <path d="M48 32 Q43 40 36 45.5" fill="none" stroke="#2a0a12" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <!-- blood droplet -->
  <path d="M46.5 44 Q48.5 47.5 46.5 49 Q44.5 47.5 46.5 44 Z" fill="#c43a3a" stroke="#14101a" stroke-width="0.8"/>
</svg>
