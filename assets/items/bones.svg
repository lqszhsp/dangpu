<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bones-bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe2c4"/>
      <stop offset="0.45" stop-color="#d8c49a"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
    <linearGradient id="bones-bone2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c49a"/>
      <stop offset="0.7" stop-color="#8a5a1c"/>
      <stop offset="1" stop-color="#3a3f4a"/>
    </linearGradient>
    <linearGradient id="bones-rope" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a1c"/>
      <stop offset="0.5" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
    <path id="bones-shape" d="M-19 -2.6 L19 -2.6 C20 -6.4 25.4 -6.4 25.4 -2.6 C27.4 -1.6 27.4 1.6 25.4 2.6 C25.4 6.4 20 6.4 19 2.6 L-19 2.6 C-20 6.4 -25.4 6.4 -25.4 2.6 C-27.4 1.6 -27.4 -1.6 -25.4 -2.6 C-25.4 -6.4 -20 -6.4 -19 -2.6 Z"/>
    <filter id="bones-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>
  <!-- miasma -->
  <g fill="#5b3474" filter="url(#bones-blur)">
    <ellipse cx="32" cy="34" rx="22" ry="15" opacity="0.6"/>
    <path d="M18 14 C14 8 20 4 22 8 C24 12 28 8 26 4" fill="none" stroke="#5b3474" stroke-width="3"/>
    <path d="M44 16 C48 10 42 6 41 10" fill="none" stroke="#3d2350" stroke-width="3"/>
  </g>
  <ellipse cx="32" cy="55" rx="24" ry="3.6" fill="#14101a" opacity="0.45"/>
  <!-- back bone -->
  <g transform="translate(27.4 28.6) rotate(-44) scale(0.9 1)">
    <use href="#bones-shape" fill="url(#bones-bone2)" stroke="#14101a" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <g transform="translate(37 39.6) rotate(-35) scale(0.86 1)">
    <use href="#bones-shape" fill="url(#bones-bone2)" stroke="#14101a" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <!-- front bones -->
  <g transform="translate(30.4 32.4) rotate(-40)">
    <use href="#bones-shape" fill="url(#bones-bone)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M-17 -1.4 L12 -1.4 M18 -1.4 L19.5 -1.4" stroke="#f4fbff" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
    <path d="M-8 1 L-3 0.4 M6 1.2 L9 0.8" stroke="#5e0f1c" stroke-width="0.6" stroke-linecap="round" opacity="0.6"/>
  </g>
  <g transform="translate(36 34.4) rotate(-46) scale(0.82 1.1)">
    <use href="#bones-shape" fill="url(#bones-bone)" stroke="#14101a" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M-17 -1.4 L17 -1.4" stroke="#f4fbff" stroke-width="0.7" stroke-linecap="round" opacity="0.55"/>
    <path d="M14 -2.6 L16 0.5 L13.6 2.6" fill="none" stroke="#14101a" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- straw rope -->
  <g transform="translate(32.4 34) rotate(-40)">
    <path d="M-3.6 -13.4 L3.6 -13.4 L3.8 12.6 L-3.8 12.6 Z" fill="url(#bones-rope)" stroke="#14101a" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M-3.4 -11 L3.6 -9 M-3.4 -6.4 L3.6 -4.4 M-3.6 -2 L3.7 0 M-3.7 2.4 L3.8 4.4 M-3.8 6.6 L3.8 8.4 M-3.8 10.4 L3.8 12" stroke="#8a5a1c" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M-3.4 -5.4 L3.4 -3.4 M-3.5 -1 L3.5 1 M-3.6 3.4 L3.6 5.4" stroke="#f2d27a" stroke-width="0.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M3.8 9 C8 10 10 13 9.6 17 M3.8 10.6 C6 13 6.4 16 5.2 18.6" fill="none" stroke="#d9a441" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M3.8 9 C8 10 10 13 9.6 17" fill="none" stroke="#14101a" stroke-width="0.4" stroke-linecap="round" opacity="0.6"/>
  </g>
  <g fill="#5b3474">
    <circle cx="10" cy="20" r="1.1"/>
    <circle cx="55" cy="22" r="0.9"/>
    <circle cx="50" cy="48" r="0.8"/>
  </g>
  <g fill="#cfefff" opacity="0.5">
    <circle cx="10" cy="20" r="0.4"/>
    <circle cx="55" cy="22" r="0.35"/>
  </g>
</svg>
