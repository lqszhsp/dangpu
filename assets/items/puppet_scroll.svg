<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="puppet_scroll-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe2c4"/>
      <stop offset="0.6" stop-color="#e9dfcc"/>
      <stop offset="1" stop-color="#b8975c"/>
    </linearGradient>
    <linearGradient id="puppet_scroll-roll" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a7a5c"/>
      <stop offset="0.35" stop-color="#efe2c4"/>
      <stop offset="0.7" stop-color="#d8c49a"/>
      <stop offset="1" stop-color="#6e5a3c"/>
    </linearGradient>
    <linearGradient id="puppet_scroll-bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d27a"/>
      <stop offset="0.45" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#6b4416"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="33" cy="57" rx="27" ry="4" fill="#14101a" opacity="0.45"/>
  <!-- unrolled sheet -->
  <path d="M8 13 L47 9.5 L50 50 L10.5 54 Z" fill="url(#puppet_scroll-paper)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M10.5 15 L45.5 12 L48 47.5 L12.5 51.5 Z" fill="none" stroke="#8a5a1c" stroke-width="0.8" opacity="0.7"/>
  <!-- stains & wear -->
  <ellipse cx="17" cy="44" rx="4" ry="2.6" fill="#b8975c" opacity="0.45"/>
  <path d="M8.5 22 L11 23 L9 25" fill="none" stroke="#8a5a1c" stroke-width="0.8"/>
  <!-- puppet blueprint drawing -->
  <g fill="none" stroke="#3d2350" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="27" cy="18.5" r="3.2"/>
    <path d="M27 21.7 V35 M20 25 L34 23.8 M20 25 L17 33 M34 23.8 L37.5 31.5 M27 35 L22.5 46 M27 35 L31.5 45.5"/>
    <path d="M23.5 27 L30.5 26.5 L30.8 33.5 L24 34 Z"/>
  </g>
  <g fill="#c43a3a">
    <circle cx="20" cy="25" r="1.3"/>
    <circle cx="34" cy="23.8" r="1.3"/>
    <circle cx="27" cy="35" r="1.4"/>
    <circle cx="24.6" cy="40.6" r="1.1"/>
    <circle cx="29.3" cy="40.3" r="1.1"/>
  </g>
  <circle cx="27.2" cy="30.3" r="1.6" fill="#5b3474"/>
  <!-- gear diagram -->
  <g fill="none" stroke="#3d2350" stroke-width="0.9">
    <circle cx="13.5" cy="20.5" r="2.6"/>
    <path d="M13.5 16.8 V18 M13.5 23 V24.2 M9.8 20.5 H11 M16 20.5 H17.2"/>
  </g>
  <!-- annotation strokes (script) -->
  <g fill="none" stroke="#14101a" stroke-width="0.8" stroke-linecap="round" opacity="0.75">
    <path d="M38 16 H42 M40 14.5 V18.5 M38.2 21 H42.4 M38.4 24 Q40.3 22.6 42.5 24.3 M38.6 27.5 H42.6 M40.6 26 V30"/>
    <path d="M38.8 34 H43 M39 37 H43.2 M41 35.5 V40"/>
    <path d="M14 30 L17 30.5 M14.5 47 L19.5 46.5"/>
  </g>
  <path d="M30.5 26.5 L37.5 22" stroke="#3d2350" stroke-width="0.6" stroke-dasharray="1.2 1" opacity="0.8"/>
  <!-- seal -->
  <rect x="40.5" y="42" width="4.6" height="4.6" fill="#c43a3a" stroke="#8e1b2b" stroke-width="0.6" transform="rotate(-5 42.8 44.3)"/>
  <path d="M41.6 43.6 H44 M42.8 43 V45.8" stroke="#efe2c4" stroke-width="0.6"/>
  <!-- right rolled part -->
  <path d="M45 8.5 Q52 7.5 53.5 9 L57 51 Q55.5 53 49 53.5 Z" fill="url(#puppet_scroll-roll)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M49 9 L52.4 51.5" stroke="#efe2c4" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <!-- bronze rod caps -->
  <path d="M46.5 3.5 L55.5 2.8 L56 8.5 L47 9.2 Z" fill="url(#puppet_scroll-bronze)" stroke="#14101a" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M48.8 52.6 L58 51.8 L58.5 57.6 L49.3 58.4 Z" fill="url(#puppet_scroll-bronze)" stroke="#14101a" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M48 5 L54.5 4.5 M50.3 54.4 L56.8 53.8" stroke="#f2d27a" stroke-width="0.9" stroke-linecap="round"/>
  <!-- left rod end -->
  <path d="M5.5 11 L10 10.6 L13 55.6 L8.5 56 Z" fill="url(#puppet_scroll-bronze)" stroke="#14101a" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M7.4 13 L10 53.5" stroke="#f2d27a" stroke-width="0.9" stroke-linecap="round"/>
  <!-- cord -->
  <path d="M57 30 Q61 34 59 40 Q58 44 60 47" fill="none" stroke="#14101a" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M57 30 Q61 34 59 40 Q58 44 60 47" fill="none" stroke="#c43a3a" stroke-width="1.1" stroke-linecap="round"/>
</svg>
