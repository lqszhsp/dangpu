<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="wangyou-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe2c4"/>
      <stop offset="0.55" stop-color="#e9dfcc"/>
      <stop offset="1" stop-color="#b8975c"/>
    </linearGradient>
    <linearGradient id="wangyou-flap" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d8c49a"/>
      <stop offset="1" stop-color="#efe2c4"/>
    </linearGradient>
    <radialGradient id="wangyou-powder" cx="0.45" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="0.35" stop-color="#f4d0ff"/>
      <stop offset="0.75" stop-color="#cfa8ff"/>
      <stop offset="1" stop-color="#5b3474"/>
    </radialGradient>
    <radialGradient id="wangyou-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4d0ff" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#cfa8ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#cfa8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="wangyou-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <!-- shadow -->
  <ellipse cx="33" cy="52" rx="27" ry="6" fill="#14101a" opacity="0.45"/>
  <!-- unfolded paper sheet -->
  <path d="M4 41 L29 29 L60 38.5 L35 55 Z" fill="url(#wangyou-paper)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- crease lines -->
  <g fill="none" stroke="#b8975c" stroke-width="0.8" opacity="0.8">
    <path d="M16.5 35 L47.5 46.8 M44.5 33.8 L19.5 48"/>
  </g>
  <!-- folded-in edges forming a tray -->
  <path d="M14 41 L29.5 34.5 L49.5 40 L35 49 Z" fill="#d8c49a" stroke="#8a5a1c" stroke-width="1" stroke-linejoin="round"/>
  <!-- lifted back flap (still half folded) -->
  <path d="M29 29 L44.5 33.8 L46 17.5 Q38 18 29 29 Z" fill="url(#wangyou-flap)" stroke="#14101a" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M31.5 28 Q38 21 44.6 19.5" fill="none" stroke="#f4fbff" stroke-width="0.9" stroke-linecap="round" opacity="0.8"/>
  <!-- left flap curling up -->
  <path d="M4 41 L16.5 35 Q10 31 6.5 33.5 Q4 36.5 4 41 Z" fill="url(#wangyou-flap)" stroke="#14101a" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- powder glow -->
  <ellipse cx="32" cy="40" rx="20" ry="11" fill="url(#wangyou-glow)"/>
  <!-- powder heap -->
  <path d="M17.5 42 Q22 34 30 32.5 Q38 32 46 39.5 Q40 46.5 33 47 Q24 47 17.5 42 Z" fill="url(#wangyou-powder)" stroke="#5b3474" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M23 38.5 Q27 35 31.5 34.8" fill="none" stroke="#f4fbff" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <g fill="#cfa8ff">
    <circle cx="14" cy="44.5" r="0.7"/>
    <circle cx="47.5" cy="43" r="0.8"/>
    <circle cx="42" cy="49" r="0.6"/>
    <circle cx="20" cy="47.5" r="0.6"/>
  </g>
  <!-- red seal stamp on paper -->
  <rect x="44" y="43.5" width="5" height="4" fill="#c43a3a" stroke="#8e1b2b" stroke-width="0.6" transform="rotate(-30 46.5 45.5)"/>
  <path d="M45 45.8 L48 44 M45.8 47 L47.4 43" stroke="#efe2c4" stroke-width="0.5"/>
  <!-- loosened red string -->
  <path d="M6 45 Q12 50 20 49.5 Q26 49 27 53.5 Q27.5 57 23 58" fill="none" stroke="#14101a" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M6 45 Q12 50 20 49.5 Q26 49 27 53.5 Q27.5 57 23 58" fill="none" stroke="#c43a3a" stroke-width="1.1" stroke-linecap="round"/>
  <!-- sweet, cloying smoke -->
  <g filter="url(#wangyou-blur)" fill="none" stroke-linecap="round">
    <path d="M31 34 Q24 27 29 20 Q34 14 28 8 Q24 4 28 2" stroke="#f4d0ff" stroke-width="3.2" opacity="0.85"/>
    <path d="M36 33 Q42 26 37 19" stroke="#cfa8ff" stroke-width="2.4" opacity="0.7"/>
  </g>
  <path d="M31 33 Q25.5 27 29.5 21 Q33.5 15 28.5 9.5 Q25.5 6 28 3.5" fill="none" stroke="#f4fbff" stroke-width="1" stroke-linecap="round" opacity="0.9"/>
  <path d="M28.6 13.5 Q24 12 23 15.5 Q22.5 18 25 18" fill="none" stroke="#f4d0ff" stroke-width="0.9" stroke-linecap="round" opacity="0.9"/>
  <!-- glittering motes -->
  <g fill="#f4fbff">
    <path d="M20 24 l0.8 1.8 l1.8 0.8 l-1.8 0.8 l-0.8 1.8 l-0.8 -1.8 l-1.8 -0.8 l1.8 -0.8 Z"/>
    <circle cx="40" cy="12" r="0.9"/>
    <circle cx="18" cy="12" r="0.7"/>
    <circle cx="38" cy="27" r="0.7"/>
  </g>
</svg>
