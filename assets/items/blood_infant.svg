<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="blood_infant-body" cx="0.4" cy="0.36" r="0.7">
      <stop offset="0" stop-color="#ff8a7a"/>
      <stop offset="0.3" stop-color="#e0524a"/>
      <stop offset="0.7" stop-color="#8e1b2b"/>
      <stop offset="1" stop-color="#3a0a12"/>
    </radialGradient>
    <radialGradient id="blood_infant-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0524a" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#8e1b2b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5e0f1c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blood_infant-petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e1b2b"/>
      <stop offset="0.35" stop-color="#5b3474"/>
      <stop offset="1" stop-color="#1f1626"/>
    </linearGradient>
    <linearGradient id="blood_infant-petal2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b3474"/>
      <stop offset="1" stop-color="#14101a"/>
    </linearGradient>
    <filter id="blood_infant-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
  </defs>
  <circle cx="32" cy="29" r="30" fill="url(#blood_infant-halo)"/>
  <!-- halo ring -->
  <circle cx="32" cy="28" r="23" fill="none" stroke="#c43a3a" stroke-width="2" opacity="0.6" filter="url(#blood_infant-blur)"/>
  <circle cx="32" cy="28" r="23" fill="none" stroke="#e0524a" stroke-width="0.7" stroke-dasharray="3 4" opacity="0.8"/>
  <!-- shadow -->
  <ellipse cx="32" cy="58.5" rx="18" ry="3" fill="#14101a" opacity="0.55"/>
  <!-- lotus back petals -->
  <g stroke="#14101a" stroke-width="1.6" stroke-linejoin="round" fill="url(#blood_infant-petal2)">
    <path d="M12 46 Q8 38 14 34 Q20 40 24 46 Z"/>
    <path d="M52 46 Q56 38 50 34 Q44 40 40 46 Z"/>
    <path d="M20 44 Q20 34 27 32 Q31 38 32 44 Z"/>
    <path d="M44 44 Q44 34 37 32 Q33 38 32 44 Z"/>
  </g>
  <!-- pill -->
  <circle cx="32" cy="27" r="17" fill="url(#blood_infant-body)" stroke="#14101a" stroke-width="2.2"/>
  <!-- inner glow -->
  <circle cx="32" cy="28" r="9" fill="#e0524a" opacity="0.6" filter="url(#blood_infant-blur)"/>
  <!-- curled infant silhouette (fetal pose) -->
  <g fill="#3a0a12" opacity="0.9">
    <circle cx="27.5" cy="21.5" r="5.8"/>
    <path d="M31 22 Q38.5 21 40.5 28.5 Q41.5 35.5 36 38.5 Q30.5 40.5 27 37.5 Q25 35 27.5 32.5 Q29.5 30.5 30.5 27 Z"/>
    <path d="M30 31 Q24.5 30 23.5 34 Q23.5 37.5 28 38 Q27 35.5 30.5 34 Z"/>
    <path d="M30.5 26.5 Q27 27 26.5 29.5 Q28.5 30.5 31 29 Z"/>
  </g>
  <!-- infant rim light -->
  <g fill="none" stroke="#ff8a7a" stroke-width="0.9" stroke-linecap="round" opacity="0.85">
    <path d="M22 19.5 Q23 15.5 27.5 15.4"/>
    <path d="M33 21.6 Q39.5 23 40.6 29.5"/>
    <path d="M23.6 34.5 Q25 38.6 30 38.6"/>
  </g>
  <!-- tiny hand, eye and umbilical thread -->
  <path d="M24.6 22.4 Q25.8 23.4 27 22.4" fill="none" stroke="#e0524a" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M33 37 Q36 41 40 39 Q43 37.5 45 39" fill="none" stroke="#c43a3a" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  <!-- pill highlight -->
  <ellipse cx="24.5" cy="17.5" rx="4.6" ry="2.6" fill="#ffd6cc" opacity="0.7" transform="rotate(-35 24.5 17.5)"/>
  <circle cx="22" cy="16" r="1.1" fill="#f4fbff"/>
  <path d="M45 33 Q42 40 35 43" fill="none" stroke="#e0524a" stroke-width="1.1" stroke-linecap="round" opacity="0.6"/>
  <!-- lotus front petals -->
  <g stroke="#14101a" stroke-width="1.6" stroke-linejoin="round" fill="url(#blood_infant-petal)" transform="translate(0 7.9) scale(1 0.85)">
    <path d="M7 50 Q8 43 16 42 Q22 46 25 52 Q15 54 7 50 Z"/>
    <path d="M57 50 Q56 43 48 42 Q42 46 39 52 Q49 54 57 50 Z"/>
    <path d="M17 52 Q18 42 26 39 Q31 45 32 53 Q24 55 17 52 Z"/>
    <path d="M47 52 Q46 42 38 39 Q33 45 32 53 Q40 55 47 52 Z"/>
    <path d="M26 53 Q27 43 32 39 Q37 43 38 53 Q32 55.5 26 53 Z"/>
  </g>
  <g fill="none" stroke="#c43a3a" stroke-width="0.8" stroke-linecap="round" opacity="0.8">
    <path d="M32 44.5 L32 51.5 M24 45.5 Q24 48.5 25 51.5 M40 45.5 Q40 48.5 39 51.5"/>
  </g>
  <!-- lotus base -->
  <path d="M14 53 Q32 59 50 53 L48 56 Q32 61 16 56 Z" fill="#1f1626" stroke="#14101a" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- blood motes rising -->
  <g fill="#e0524a">
    <circle cx="10" cy="22" r="1.1"/><circle cx="54" cy="18" r="1"/><circle cx="48" cy="6" r="0.8"/><circle cx="15" cy="8" r="0.8"/>
  </g>
</svg>
