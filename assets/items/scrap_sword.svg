  <ellipse cx="36" cy="55" rx="3.6" ry="7" fill="url(#scrap_sword-rust)"/>
  <ellipse cx="29" cy="40" rx="4" ry="5" fill="url(#scrap_sword-rust)"/>
  <ellipse cx="34" cy="24" rx="4.5" ry="6" fill="url(#scrap_sword-rust)"/>
  <ellipse cx="35" cy="76" rx="2.5" ry="3" fill="url(#scrap_sword-rust)"/>
  <g fill="#5e0f1c">
    <circle cx="27.5" cy="71" r="0.8"/>
    <circle cx="29.2" cy="74.5" r="0.6"/>
    <circle cx="36.4" cy="53" r="0.9"/>
