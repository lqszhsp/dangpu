  <circle cx="32" cy="116.3" r="1.7" fill="#14101a"/>
  <path d="M26.2 114.4 C27.6 113.4 30 113.2 31 113.3" fill="none" stroke="#e9dfcc" stroke-width="0.6" opacity="0.5" stroke-linecap="round"/>
