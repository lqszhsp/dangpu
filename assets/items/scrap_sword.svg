<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 128">
  <defs>
    <linearGradient id="scrap_sword-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3f4a"/>
      <stop offset="0.4" stop-color="#5c6370"/>
      <stop offset="0.5" stop-color="#9aa88a"/>
      <stop offset="0.54" stop-color="#3a3f4a"/>
      <stop offset="1" stop-color="#1f1626"/>
    </linearGradient>
    <linearGradient id="scrap_sword-bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa88a"/>
      <stop offset="0.4" stop-color="#8a5a1c"/>
      <stop offset="1" stop-color="#3a3f4a"/>
    </linearGradient>
    <linearGradient id="scrap_sword-grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d2350"/>
      <stop offset="0.35" stop-color="#5b3474"/>
      <stop offset="1" stop-color="#14101a"/>
    </linearGradient>
    <radialGradient id="scrap_sword-rust">
      <stop offset="0" stop-color="#9a4d12"/>
      <stop offset="0.55" stop-color="#8a5a1c" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#5e0f1c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- shadow -->
  <g fill="#14101a" opacity="0.35" transform="translate(2 2)">
