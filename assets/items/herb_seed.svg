<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="herb_seed-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe2c4"/>
      <stop offset="0.55" stop-color="#d8c49a"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
    <linearGradient id="herb_seed-flap" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8a5a1c"/>
      <stop offset="0.6" stop-color="#d8c49a"/>
      <stop offset="1" stop-color="#efe2c4"/>
    </linearGradient>
    <radialGradient id="herb_seed-seed" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#e8fff6"/>
      <stop offset="0.35" stop-color="#7fd6b5"/>
      <stop offset="1" stop-color="#1f5c4c"/>
    </radialGradient>
    <filter id="herb_seed-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <path d="M6 44 L34 59 L60 45 Z" fill="#14101a" opacity="0.35"/>
  <!-- flap folded back -->
  <path d="M15 32 L46 32.5 L44 11 Z" fill="url(#herb_seed-flap)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M44 11 L33 31.5 M36 20 L39 23" fill="none" stroke="#8a5a1c" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  <ellipse cx="40" cy="24" rx="2.6" ry="1.8" fill="#9a4d12" opacity="0.35"/>
  <!-- pocket inside -->
  <path d="M15 32 C22 27.5 38 27.5 46 32.5 L40 36 L20 36 Z" fill="#5e0f1c" opacity="0.8"/>
  <!-- glow -->
  <ellipse cx="31" cy="31" rx="13" ry="6" fill="#3fae8f" opacity="0.7" filter="url(#herb_seed-blur)"/>
  <!-- seeds in pocket -->
  <g stroke="#14101a" stroke-width="0.9">
    <ellipse cx="22.5" cy="30.5" rx="3" ry="2.2" fill="url(#herb_seed-seed)" transform="rotate(-20 22.5 30.5)"/>
    <ellipse cx="28.5" cy="28.6" rx="3.2" ry="2.3" fill="url(#herb_seed-seed)" transform="rotate(15 28.5 28.6)"/>
    <ellipse cx="34.8" cy="29.4" rx="3" ry="2.2" fill="url(#herb_seed-seed)" transform="rotate(-10 34.8 29.4)"/>
    <ellipse cx="40.2" cy="31" rx="2.8" ry="2" fill="url(#herb_seed-seed)" transform="rotate(25 40.2 31)"/>
    <ellipse cx="31.5" cy="32" rx="3" ry="2.2" fill="url(#herb_seed-seed)" transform="rotate(5 31.5 32)"/>
  </g>
  <!-- packet body -->
  <path d="M15 32 L46 32.5 L58.5 42.5 L34 57 L5.5 42 Z" fill="url(#herb_seed-paper)" stroke="#14101a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M15 32 L34 57 M46 32.5 L34 57" fill="none" stroke="#8a5a1c" stroke-width="0.9" stroke-linecap="round" opacity="0.7"/>
  <path d="M8.5 41.8 L15.6 33.6 L44.6 34" fill="none" stroke="#f4fbff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <!-- oil stains -->
  <ellipse cx="20" cy="44" rx="4" ry="2.6" fill="#d9a441" opacity="0.35"/>
  <ellipse cx="44" cy="45" rx="3" ry="2" fill="#9a4d12" opacity="0.3"/>
  <ellipse cx="33" cy="38.5" rx="2.4" ry="1.5" fill="#d9a441" opacity="0.4"/>
  <!-- twine -->
  <path d="M10 37.5 C20 43 36 48 52 38.5" fill="none" stroke="#14101a" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M10 37.5 C20 43 36 48 52 38.5" fill="none" stroke="#8e1b2b" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M10.6 37.4 C20 42.4 36 47 51.4 38.2" fill="none" stroke="#e0524a" stroke-width="0.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M33 45.6 C30 49 28 51 25.5 52 M33 45.6 C35 49.5 36 51.5 38.5 52.5" fill="none" stroke="#8e1b2b" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="33" cy="45.6" r="1.6" fill="#c43a3a" stroke="#14101a" stroke-width="0.8"/>
  <!-- spilled seeds -->
  <g stroke="#14101a" stroke-width="0.9">
    <ellipse cx="9.5" cy="52" rx="2.6" ry="1.9" fill="url(#herb_seed-seed)" transform="rotate(-25 9.5 52)"/>
    <ellipse cx="54" cy="52.5" rx="2.4" ry="1.8" fill="url(#herb_seed-seed)" transform="rotate(20 54 52.5)"/>
  </g>
  <g fill="#f4fbff">
    <circle cx="27.4" cy="27.6" r="0.7"/>
    <circle cx="33.8" cy="28.4" r="0.6"/>
    <circle cx="21.6" cy="29.6" r="0.6"/>
    <path d="M24 14 L24.7 16 L26.6 16.6 L24.7 17.2 L24 19.2 L23.3 17.2 L21.4 16.6 L23.3 16 Z" fill="#7fd6b5"/>
    <circle cx="15" cy="23" r="0.8" fill="#7fd6b5"/>
    <circle cx="53" cy="24" r="0.8" fill="#7fd6b5"/>
  </g>
</svg>
