<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="zhen_fu-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0524a"/>
      <stop offset="0.5" stop-color="#c43a3a"/>
      <stop offset="1" stop-color="#8e1b2b"/>
    </linearGradient>
    <radialGradient id="zhen_fu-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c8"/>
      <stop offset="0.4" stop-color="#ffc56b"/>
      <stop offset="1" stop-color="#e8902f" stop-opacity="0"/>
    </radialGradient>
    <filter id="zhen_fu-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>
  <!-- heat glow -->
  <path d="M17 4.5 L47 4.5 L48 59.5 L16 59.5 Z" fill="#e8902f" opacity="0.7" filter="url(#zhen_fu-glow)"/>
  <!-- paper -->
  <path d="M18 4.5 L46 4 Q47 32 46.5 59.5 L17.5 59.5 Q16.5 32 18 4.5 Z" fill="url(#zhen_fu-paper)" stroke="#5e0f1c" stroke-width="1.7" stroke-linejoin="round"/>
  <path d="M19.5 6.5 L44.5 6.2" stroke="#ffc56b" stroke-width="1" opacity="0.8"/>
  <path d="M20 8.6 h24 M20 55.6 h24" stroke="#f2d27a" stroke-width="1" opacity="0.85"/>
  <!-- header glyph -->
  <path d="M26.4 12.4 h11.2 M32 10.4 v6.4 M27.6 16.8 l-1.4 1.4 M36.4 16.8 l1.4 1.4" fill="none" stroke="#f2d27a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- array circle -->
  <circle cx="32" cy="35" r="11" fill="url(#zhen_fu-core)" opacity="0.7"/>
  <circle cx="32" cy="35" r="11.2" fill="none" stroke="#ffc56b" stroke-width="2.4" opacity="0.8" filter="url(#zhen_fu-glow)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="35" r="11.2" stroke="#f2d27a" stroke-width="1.4"/>
    <circle cx="32" cy="35" r="8" stroke="#f2d27a" stroke-width="0.8" stroke-dasharray="2 1.4"/>
    <!-- triangles (fire trigram star) -->
    <path d="M32 26 L39.8 39.4 L24.2 39.4 Z" stroke="#ffc56b" stroke-width="1"/>
    <path d="M32 44 L24.2 30.6 L39.8 30.6 Z" stroke="#ffc56b" stroke-width="1"/>
  </g>
  <!-- flame at center -->
  <path d="M32 29.4 Q36 33.4 35.4 37 Q34.6 40 32 40 Q29.4 40 28.6 37 Q28.4 34.6 30 33 Q30.2 35 31.4 35.6 Q30.6 32.4 32 29.4 Z" fill="#ffc56b" stroke="#5e0f1c" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M32 35 Q33.4 36.8 32.8 38.4 Q32 39 31.2 38.4 Q30.8 36.8 32 35 Z" fill="#fff3c8"/>
  <!-- flame ticks on ring -->
  <g fill="#ffc56b" stroke="#5e0f1c" stroke-width="0.5">
    <path d="M32 21.4 Q33.4 23 32 24.4 Q30.6 23 32 21.4 Z"/>
    <path d="M45.6 35 Q44 36.4 42.6 35 Q44 33.6 45.6 35 Z"/>
    <path d="M18.4 35 Q20 33.6 21.4 35 Q20 36.4 18.4 35 Z"/>
    <path d="M32 48.6 Q30.6 47 32 45.6 Q33.4 47 32 48.6 Z"/>
  </g>
  <path d="M25 51.6 Q32 49 39 51.6" fill="none" stroke="#f2d27a" stroke-width="1.3" stroke-linecap="round"/>
  <!-- edge char -->
  <path d="M17.6 24 Q19.6 25 18.6 27.6 M46.4 44 Q44.4 45 45.2 47.6" fill="none" stroke="#5e0f1c" stroke-width="0.9" opacity="0.8"/>
  <!-- sparks -->
  <g fill="#ffc56b">
    <circle cx="11" cy="18" r="1.3"/><circle cx="53" cy="13" r="1.5"/><circle cx="53.6" cy="42" r="1.1"/>
    <circle cx="9.6" cy="46" r="1"/><circle cx="13" cy="58" r="1.1"/><circle cx="51" cy="58.6" r="1"/>
  </g>
  <g fill="#e0524a"><circle cx="56" cy="27" r="1"/><circle cx="8" cy="32" r="0.9"/></g>
  <path d="M53 5 L53.6 7.8 L56.4 8.4 L53.6 9 L53 11.8 L52.4 9 L49.6 8.4 L52.4 7.8 Z" fill="#fff3c8"/>
  <path d="M10.6 9 L11 11 L13 11.4 L11 11.8 L10.6 13.8 L10.2 11.8 L8.2 11.4 L10.2 11 Z" fill="#fff3c8"/>
</svg>
