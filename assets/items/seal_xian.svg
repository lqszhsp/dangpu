<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="seal_xian-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f4fbff"/>
      <stop offset="1" stop-color="#cfefff"/>
    </linearGradient>
    <radialGradient id="seal_xian-stamp" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="0.6" stop-color="#4a8fb8"/>
      <stop offset="1" stop-color="#2a5f86"/>
    </radialGradient>
    <radialGradient id="seal_xian-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4fbff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#8fd3ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8fd3ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="seal_xian-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <ellipse cx="32" cy="32" rx="31" ry="31" fill="url(#seal_xian-halo)"/>
  <g stroke="#cfefff" stroke-width="1.2" stroke-linecap="round" opacity="0.8">
    <path d="M32 0.6 v3.6 M6 10 l3 3 M58 10 l-3 3 M2.6 32 h4 M61.4 32 h-4 M6 55 l3 -3 M58 55 l-3 -3"/>
  </g>
  <path d="M17 4.5 L47 4.5 L48 59.5 L16 59.5 Z" fill="#8fd3ff" opacity="0.85" filter="url(#seal_xian-glow)"/>
  <!-- paper -->
  <path d="M18 4.5 L46 4 Q47 32 46.5 59.5 L17.5 59.5 Q16.5 32 18 4.5 Z" fill="url(#seal_xian-paper)" stroke="#4a8fb8" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- cyan border -->
  <path d="M20.4 7 L43.6 6.8 L44 57 L20.2 57 Z" fill="none" stroke="#4a8fb8" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M22 8.6 L42 8.4 L42.4 55.4 L21.8 55.4 Z" fill="none" stroke="#8fd3ff" stroke-width="0.7"/>
  <!-- corner clouds -->
  <g fill="none" stroke="#4a8fb8" stroke-width="0.9" stroke-linecap="round">
    <path d="M23 12 q2 -2 4 0 q-2 2 -0.4 3 M41 12 q-2 -2 -4 0 q2 2 0.4 3 M23 51.6 q2 2 4 0 q-2 -2 -0.4 -3 M41 51.6 q-2 2 -4 0 q2 -2 0.4 -3"/>
  </g>
  <!-- script columns -->
  <g fill="none" stroke="#4a8fb8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 14 h8 M32 12.4 v5 M29 19 h6"/>
    <path d="M28.6 46.6 h6.8 M32 45 v5.6 M29 50.6 Q32 52.6 35 50.6"/>
  </g>
  <!-- seal stamp -->
  <circle cx="32" cy="32.4" r="10.6" fill="#8fd3ff" opacity="0.8" filter="url(#seal_xian-glow)"/>
  <rect x="23" y="23.4" width="18" height="18" rx="2.4" fill="url(#seal_xian-stamp)" stroke="#1f3c58" stroke-width="1.3"/>
  <rect x="24.8" y="25.2" width="14.4" height="14.4" rx="1.4" fill="none" stroke="#f4fbff" stroke-width="0.8"/>
  <!-- sword emblem -->
  <path d="M32 26.4 L33.4 29 L33.2 36 L30.8 36 L30.6 29 Z" fill="#f4fbff" stroke="#1f3c58" stroke-width="0.6" stroke-linejoin="round"/>
  <path d="M28.6 36 L35.4 36" stroke="#f4fbff" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M32 36.6 L32 38.6" stroke="#f4fbff" stroke-width="1.2" stroke-linecap="round"/>
  <!-- auspicious cloud under sword -->
  <path d="M26.4 37.6 q1.6 -2.2 3.4 -0.6 q2.2 -1.8 4.4 0 q1.8 -1.6 3.4 0.6 q-0.6 1.4 -2 1 h-7.4 q-1.4 0.4 -1.8 -1 Z" fill="#cfefff" stroke="#1f3c58" stroke-width="0.6" stroke-linejoin="round"/>
  <path d="M26.6 29 q-1.4 -1.6 0.2 -2.8 q1.6 -0.6 2 1 M37.4 29 q1.4 -1.6 -0.2 -2.8 q-1.6 -0.6 -2 1" fill="none" stroke="#cfefff" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M24.4 26 L24.4 31" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>
  <!-- tassel strip hanging -->
  <path d="M19 4.6 L45 4.4" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
  <!-- sparkles -->
  <g fill="#ffffff">
    <path d="M52 19 L52.8 22.2 L56 23 L52.8 23.8 L52 27 L51.2 23.8 L48 23 L51.2 22.2 Z"/>
    <path d="M11 38 L11.5 40.5 L14 41 L11.5 41.5 L11 44 L10.5 41.5 L8 41 L10.5 40.5 Z"/>
  </g>
  <g fill="#cfefff"><circle cx="9" cy="22" r="0.9"/><circle cx="55" cy="45" r="0.9"/><circle cx="51" cy="58" r="0.7"/></g>
</svg>
