<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="lens1-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9aa88a"/>
      <stop offset="0.35" stop-color="#6b7d5a"/>
      <stop offset="0.75" stop-color="#8a5a1c"/>
      <stop offset="1" stop-color="#3a3f4a"/>
    </linearGradient>
    <radialGradient id="lens1-face" cx="0.4" cy="0.36" r="0.7">
      <stop offset="0" stop-color="#fff3c8"/>
      <stop offset="0.35" stop-color="#f2d27a"/>
      <stop offset="0.8" stop-color="#d8c49a"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </radialGradient>
    <linearGradient id="lens1-wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e0f1c"/>
      <stop offset="0.4" stop-color="#9a4d12"/>
      <stop offset="1" stop-color="#3a2e1c"/>
    </linearGradient>
    <filter id="lens1-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <g transform="rotate(-24 32 32)">
    <!-- shadow -->
    <circle cx="34.5" cy="23.5" r="19.5" fill="#14101a" opacity="0.4"/>
    <rect x="31" y="42" width="7" height="19" rx="3" fill="#14101a" opacity="0.4"/>
    <!-- handle -->
    <path d="M29.6 42 L34.4 42 L35.2 57.5 Q32 60.5 28.8 57.5 Z" fill="url(#lens1-wood)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M31 45 L31.3 56" stroke="#e8902f" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
    <path d="M29.3 50 L34.7 50 M29.1 54 L34.9 54" stroke="#3a2e1c" stroke-width="0.9"/>
    <!-- collar -->
    <path d="M27.6 39 L36.4 39 L35.6 44 L28.4 44 Z" fill="url(#lens1-rim)" stroke="#14101a" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- rim -->
    <circle cx="32" cy="22" r="18.5" fill="url(#lens1-rim)" stroke="#14101a" stroke-width="2.2"/>
    <circle cx="32" cy="22" r="14.5" fill="#3a2e1c" stroke="#14101a" stroke-width="1.2"/>
    <!-- glow -->
    <circle cx="32" cy="22" r="13" fill="#f2d27a" opacity="0.7" filter="url(#lens1-glow)"/>
    <!-- face -->
    <circle cx="32" cy="22" r="13.6" fill="url(#lens1-face)" stroke="#5c6370" stroke-width="0.9"/>
    <!-- rim rivets / dots -->
    <g fill="#3a3f4a">
      <circle cx="32" cy="5.5" r="1"/><circle cx="48.5" cy="22" r="1"/><circle cx="15.5" cy="22" r="1"/>
      <circle cx="43.7" cy="10.3" r="0.8"/><circle cx="20.3" cy="10.3" r="0.8"/><circle cx="43.7" cy="33.7" r="0.8"/><circle cx="20.3" cy="33.7" r="0.8"/>
    </g>
    <!-- verdigris -->
    <path d="M44 31 Q47 28 48.6 25 Q49 31 44.5 35.5 Z" fill="#3fae8f" opacity="0.55"/>
    <circle cx="18" cy="31" r="1.3" fill="#3fae8f" opacity="0.6"/>
    <!-- face highlights -->
    <path d="M23 18 Q25 12 31 10.5" fill="none" stroke="#fff8e6" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <path d="M24.5 23 L26.5 21" stroke="#fff8e6" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
    <!-- rim highlight -->
    <path d="M16.5 15 Q20 7 29 4.6" fill="none" stroke="#e9dfcc" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
