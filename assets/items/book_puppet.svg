      <path d="M0 -2 L0 3.4 M-3.6 -0.6 L-1.4 -1.6 L1.4 -1.6 L3.6 -0.6 M-1.6 6.8 L-1.2 3.4 L1.2 3.4 L1.6 6.8" fill="none" stroke="#efe2c4" stroke-width="1.1"/>
