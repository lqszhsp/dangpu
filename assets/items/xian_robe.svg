<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="xian_robe-cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f4fbff"/>
      <stop offset="1" stop-color="#cfe2ee"/>
    </linearGradient>
    <linearGradient id="xian_robe-trim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="0.5" stop-color="#4a8fb8"/>
      <stop offset="1" stop-color="#2f6f96"/>
    </linearGradient>
    <linearGradient id="xian_robe-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f2fa"/>
      <stop offset="1" stop-color="#a9c6da"/>
    </linearGradient>
    <filter id="xian_robe-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <!-- soft aura -->
  <rect x="10" y="14" width="108" height="100" rx="14" fill="#8fd3ff" opacity="0.45" filter="url(#xian_robe-glow)"/>
  <!-- shadow -->
  <path d="M12 104 L116 104 L118 120 L10 120 Z" fill="#14101a" opacity="0.35"/>
  <!-- folded stack: bottom layer thickness -->
  <path d="M9 96 L119 96 L119 112 Q64 118 9 112 Z" fill="url(#xian_robe-side)" stroke="#1f1626" stroke-width="2" stroke-linejoin="round"/>
  <path d="M9 104 Q64 110 119 104" fill="none" stroke="#4a8fb8" stroke-width="3.5"/>
  <path d="M9 104 Q64 110 119 104" fill="none" stroke="#8fd3ff" stroke-width="1"/>
  <!-- main top panel -->
  <path d="M12 26 Q14 20 22 19 L106 19 Q114 20 116 26 L119 96 Q64 102 9 96 Z" fill="url(#xian_robe-cloth)" stroke="#1f1626" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- collar (cross-collar 交领) -->
  <path d="M44 19 L64 50 L84 19" fill="none" stroke="#1f1626" stroke-width="10" stroke-linejoin="round"/>
  <path d="M44 19 L64 50 L84 19" fill="none" stroke="url(#xian_robe-trim)" stroke-width="7.4" stroke-linejoin="round"/>
  <path d="M46 19.5 L64 46.5 L82 19.5" fill="none" stroke="#cfefff" stroke-width="1" stroke-linejoin="round"/>
  <path d="M64 50 L70 58" stroke="#1f1626" stroke-width="1.4" stroke-linecap="round"/>
  <!-- inner layer peek -->
  <path d="M50.5 19 L64 39 L77.5 19 Z" fill="#e6f2fa" stroke="#1f1626" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M55 19 L64 32 L73 19" fill="none" stroke="#8fd3ff" stroke-width="1.4"/>
  <!-- sleeve fold lines -->
  <path d="M30 26 Q28 60 27 96 M98 26 Q100 60 101 96" fill="none" stroke="#a9c6da" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M31.8 28 Q30 60 29.2 94 M96.2 28 Q98 60 98.8 94" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
  <!-- front opening fold edge with trim -->
  <path d="M70 58 Q72 78 72 99" fill="none" stroke="#1f1626" stroke-width="6.6" stroke-linecap="round"/>
  <path d="M70 58 Q72 78 72 99" fill="none" stroke="url(#xian_robe-trim)" stroke-width="4.4" stroke-linecap="round"/>
  <!-- bottom hem trim -->
  <path d="M10 92 Q64 98 118.8 92" fill="none" stroke="#4a8fb8" stroke-width="4.2"/>
  <path d="M10 92 Q64 98 118.8 92" fill="none" stroke="#8fd3ff" stroke-width="1"/>
  <!-- sash -->
  <path d="M11 64 Q64 70 117.5 64 L117.8 72 Q64 78 10.8 72 Z" fill="#cfefff" stroke="#1f1626" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M12 67 Q64 73 117.6 67" fill="none" stroke="#4a8fb8" stroke-width="1"/>
  <!-- cloud emblem on chest (left breast) -->
  <circle cx="42" cy="46" r="10.5" fill="#f4fbff" stroke="#4a8fb8" stroke-width="1.8"/>
  <circle cx="42" cy="46" r="8.2" fill="none" stroke="#8fd3ff" stroke-width="0.8"/>
  <path d="M34.5 49 Q33 45 36.5 44 Q37 40 41 40.5 Q43 37.5 46.5 39.5 Q50 40 49.5 43.5 Q52 45 50 48.5 Q48 50.5 45 49 Q43.5 51.5 40 50 Q36.5 51.5 34.5 49 Z" fill="#8fd3ff" stroke="#2f6f96" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M38 46 q2 -2.5 4 0 M43 44 q2 -2.5 4 0" fill="none" stroke="#f4fbff" stroke-width="0.9" stroke-linecap="round"/>
  <!-- tassel tie end -->
  <path d="M86 72 Q88 82 84 90 M90 72 Q93 82 92 90" fill="none" stroke="#4a8fb8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="88" cy="72" r="2.6" fill="#8fd3ff" stroke="#1f1626" stroke-width="1"/>
  <!-- sheen -->
  <path d="M16 30 Q15 50 15 60" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>
  <path d="M90 24 L104 24" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- sparkles -->
  <path d="M112 8 L113 12 L117 13 L113 14 L112 18 L111 14 L107 13 L111 12 Z" fill="#f4fbff"/>
  <path d="M14 8 L14.6 10.4 L17 11 L14.6 11.6 L14 14 L13.4 11.6 L11 11 L13.4 10.4 Z" fill="#cfefff"/>
</svg>
