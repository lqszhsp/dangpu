<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 128">
  <defs>
    <linearGradient id="cult_corpse-robe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14101a"/>
      <stop offset="0.3" stop-color="#3d2350"/>
      <stop offset="0.55" stop-color="#5b3474"/>
      <stop offset="1" stop-color="#1f1626"/>
    </linearGradient>
    <linearGradient id="cult_corpse-inner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1838"/>
      <stop offset="0.5" stop-color="#3d2350"/>
      <stop offset="1" stop-color="#14101a"/>
    </linearGradient>
    <radialGradient id="cult_corpse-skin" cx="0.42" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#e9dfcc"/>
      <stop offset="0.6" stop-color="#c9c7b2"/>
      <stop offset="1" stop-color="#8a948a"/>
    </radialGradient>
    <linearGradient id="cult_corpse-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a1c"/>
      <stop offset="0.5" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
    <radialGradient id="cult_corpse-jade" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#cfefff"/>
      <stop offset="0.4" stop-color="#7fd6b5"/>
      <stop offset="1" stop-color="#1f5c4c"/>
    </radialGradient>
    <filter id="cult_corpse-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="cult_corpse-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <!-- residual spirit aura -->
  <g filter="url(#cult_corpse-blur)">
    <ellipse cx="32" cy="64" rx="24" ry="56" fill="#1f5c4c" opacity="0.55"/>
    <ellipse cx="32" cy="64" rx="10" ry="16" fill="#3fae8f" opacity="0.45"/>
  </g>
  <!-- shadow -->
  <ellipse cx="33" cy="121" rx="22" ry="4" fill="#14101a" opacity="0.5"/>
  <!-- cloth shoes -->
  <g fill="#1f1626" stroke="#14101a" stroke-width="1.5" stroke-linejoin="round">
    <path d="M21.5 108 L30 108 L30.5 117 Q26 121 21 117.5 Z"/>
    <path d="M34 108 L42.5 108 L43 117.5 Q38 121 33.5 117 Z"/>
  </g>
  <path d="M23 115.5 Q26 117.5 29 115.5 M35 115.5 Q38 117.5 41 115.5" fill="none" stroke="#5b3474" stroke-width="0.9"/>
  <!-- robe body -->
  <path d="M19 38 Q32 33 45 38 Q51 46 50.5 62 L49 88 L50.5 101 L47 106 L45 103 L42 110 L39 105 L35.5 111 L32 106 L28.5 111 L25 105.5 L22 110 L19 103 L16.5 106 L14 100 L15.5 88 L13.5 62 Q13 46 19 38 Z" fill="url(#cult_corpse-robe)" stroke="#14101a" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- robe folds -->
  <g fill="none" stroke="#14101a" stroke-width="1.2" stroke-linecap="round" opacity="0.7">
    <path d="M22 76 Q21 92 22 106 M42 76 Q43 92 42 106 M32 78 L32 104"/>
    <path d="M17 66 Q16 80 17 96 M47 66 Q48 80 47 96"/>
  </g>
  <path d="M17.5 44 Q15.5 60 16.5 84" fill="none" stroke="#7a5294" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  <!-- tears / holes -->
  <g fill="#14101a" stroke="#14101a" stroke-width="0.6" stroke-linejoin="round">
    <path d="M40 86 L43.5 84 L42 90 L44 94 L39.5 91 Z"/>
    <path d="M20 92 L23 95 L21 98 L18.5 95 Z"/>
    <path d="M44.5 52 L47 55 L45 57 Z"/>
  </g>
  <path d="M40.5 86.5 L42 89.5 M20.5 93 L21.5 95.5" stroke="#3a3f4a" stroke-width="0.8"/>
  <!-- gold-trimmed hem band -->
  <path d="M15.2 92 Q32 96 49 92" fill="none" stroke="#14101a" stroke-width="3.4"/>
  <path d="M15.2 92 Q32 96 49 92" fill="none" stroke="url(#cult_corpse-gold)" stroke-width="1.8" stroke-dasharray="7 2 4 3"/>
  <!-- crossed collar -->
  <path d="M22 37 L32 58 L42 37 L38 36 L32 50 L26 36 Z" fill="url(#cult_corpse-inner)" stroke="#14101a" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M24 36.5 L32 54 L40 36.5" fill="none" stroke="#d9a441" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M27 36 L32 47 L37 36" fill="none" stroke="#efe2c4" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- sash -->
  <path d="M14.5 66 Q32 70 49.5 66 L49.3 72 Q32 76 14.6 72 Z" fill="#2a1838" stroke="#14101a" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M15 68 Q32 72 49 68" fill="none" stroke="#d9a441" stroke-width="0.9" opacity="0.8"/>
  <!-- sleeves folded over chest -->
  <path d="M14.5 50 Q20 58 32 60 Q44 58 49.5 50 L50 58 Q44 66 32 67 Q20 66 14 58 Z" fill="url(#cult_corpse-robe)" stroke="#14101a" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M19 58 Q25 63 31 63 M45 58 Q39 63 33 63" fill="none" stroke="#14101a" stroke-width="0.9" opacity="0.7"/>
  <!-- pale clasped hands -->
  <path d="M26 59.5 Q32 56 38 59.5 Q38 65 32 66 Q26 65 26 59.5 Z" fill="url(#cult_corpse-skin)" stroke="#14101a" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M29 60 v4 M32 59.2 v5.5 M35 60 v4" stroke="#8a948a" stroke-width="0.8" stroke-linecap="round"/>
  <!-- cracked jade token held in hands -->
  <g filter="url(#cult_corpse-glow)">
    <circle cx="32" cy="69" r="5" fill="#7fd6b5" opacity="0.8"/>
  </g>
  <path d="M28.5 66 L35.5 66 L36 72 L32 74.5 L28 72 Z" fill="url(#cult_corpse-jade)" stroke="#14101a" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M31 66.5 L32.6 69.5 L31.2 72 L32.4 74" fill="none" stroke="#14101a" stroke-width="0.8"/>
  <circle cx="30" cy="67.8" r="0.8" fill="#f4fbff"/>
  <!-- neck -->
  <path d="M27.5 31 L36.5 31 L36 38 Q32 40 28 38 Z" fill="url(#cult_corpse-skin)" stroke="#14101a" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- head -->
  <path d="M22.5 20 Q22.5 9.5 32 9.5 Q41.5 9.5 41.5 20 Q41.5 28 38.5 31.5 Q35.5 35 32 35 Q28.5 35 25.5 31.5 Q22.5 28 22.5 20 Z" fill="url(#cult_corpse-skin)" stroke="#14101a" stroke-width="2" stroke-linejoin="round"/>
  <!-- hair -->
  <path d="M22.3 21 Q20.5 8 32 7.5 Q43.5 8 41.7 21 Q40 14 35.5 13 Q32 15.5 28.5 13 Q24 14 22.3 21 Z" fill="#1f1626" stroke="#14101a" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M22.5 18 Q19 26 20 34 M41.5 18 Q45 26 44 34" fill="none" stroke="#1f1626" stroke-width="1.8" stroke-linecap="round"/>
  <!-- daoist crown (guan) with hairpin -->
  <path d="M26 10 Q25.5 3.5 28 2.5 L32 4 L36 2.5 Q38.5 3.5 38 10 Q32 8.5 26 10 Z" fill="url(#cult_corpse-gold)" stroke="#14101a" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M32 4 V8.6" stroke="#8a5a1c" stroke-width="0.9"/>
  <circle cx="32" cy="7" r="1.1" fill="#3fae8f" stroke="#14101a" stroke-width="0.5"/>
  <path d="M24 7.2 L40.5 5.6" stroke="#14101a" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M24 7.2 L40.5 5.6" stroke="#7fd6b5" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M27.5 4.5 Q29 3.5 30.5 4" fill="none" stroke="#f2d27a" stroke-width="0.8" stroke-linecap="round"/>
  <!-- closed eyes, sunken -->
  <path d="M24.5 21.5 Q27 20 30 21.5 M34 21.5 Q37 20 39.5 21.5" fill="none" stroke="#8a948a" stroke-width="2.4" stroke-linecap="round" opacity="0.6"/>
  <path d="M25 22 Q27.3 23.6 29.6 22 M34.4 22 Q36.7 23.6 39 22" fill="none" stroke="#14101a" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M25 18 Q27.5 17 30 18 M34 18 Q36.5 17 39 18" fill="none" stroke="#14101a" stroke-width="1" stroke-linecap="round"/>
  <path d="M32 23 Q32.8 26 31.6 27.4" fill="none" stroke="#8a948a" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M29.5 30.5 Q32 31.5 34.5 30.5" fill="none" stroke="#5c6370" stroke-width="1" stroke-linecap="round"/>
  <path d="M24.5 25.5 Q25.5 29 27.5 30.5 M39.5 25.5 Q38.5 29 36.5 30.5" fill="none" stroke="#8a948a" stroke-width="0.8" opacity="0.8"/>
  <!-- forehead cultivation mark -->
  <path d="M32 13.5 Q33.2 15.5 32 17.5 Q30.8 15.5 32 13.5 Z" fill="#3fae8f" stroke="#1f5c4c" stroke-width="0.5"/>
  <path d="M25 13.5 Q27.5 11.8 30 12" fill="none" stroke="#f4fbff" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <!-- rising spirit motes -->
  <g fill="none" stroke-linecap="round">
    <path d="M32 74 Q38 80 35 86" stroke="#3fae8f" stroke-width="1.2" opacity="0.6"/>
    <path d="M47 30 Q52 24 49 18 Q47 14 51 10" stroke="#7fd6b5" stroke-width="1.3" opacity="0.8"/>
    <path d="M15 34 Q11 28 14 22" stroke="#7fd6b5" stroke-width="1.1" opacity="0.7"/>
  </g>
  <g fill="#7fd6b5">
    <circle cx="52" cy="40" r="1.2"/><circle cx="11" cy="46" r="1"/><circle cx="54" cy="70" r="0.9"/><circle cx="9" cy="78" r="1.1"/><circle cx="50" cy="7" r="0.9"/>
  </g>
  <g fill="#cfefff">
    <circle cx="52" cy="40" r="0.5"/><circle cx="9" cy="78" r="0.45"/>
  </g>
</svg>
