    <path d="M21.4 26.6 Q27 23.4 31 25 L31 43 Q27 44.6 21.4 41.4 Q19.4 34 21.4 26.6 Z" fill="url(#gold_bug-shell)" stroke="#14101a" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- elytra (domed) -->
    <path d="M30 34 L30 22 Q38 18.6 46 20.4 Q55.6 23.6 55.6 34 Z" fill="url(#gold_bug-shell)" stroke="#14101a" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M30 34 L30 46 Q38 49.4 46 47.6 Q55.6 44.4 55.6 34 Z" fill="url(#gold_bug-shell)" stroke="#14101a" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M30 46 Q38 49.4 46 47.6 Q55.6 44.4 55.6 34 L52 34 Q51 42 44 44 Q37 45.4 31 43.4 Z" fill="#8a5a1c" opacity="0.55"/>
    <path d="M30.2 34 L55.4 34" stroke="#14101a" stroke-width="1.3"/>
    <!-- metallic highlights -->
    <path d="M33 26 Q40 21.6 48 23.4" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
    <path d="M34 30 L38 29" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
    <path d="M33.4 38 Q40 39 46 38" fill="none" stroke="#fff3c8" stroke-width="1.1" stroke-linecap="round" opacity="0.8"/>
    <path d="M23 29 Q26 27 29 27.4" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.9"/>
  </g>
  <!-- iron filings flying -->
  <g fill="#cfd6dc" stroke="#14101a" stroke-width="0.5" stroke-linejoin="round">
    <path d="M3 32 L6 31 L4.8 33.6 Z"/>
    <path d="M18 34 L20.4 33 L19.6 35.6 Z"/>
    <path d="M22 50 L24.6 49.4 L23 52 Z"/>
    <path d="M9 30 L10.6 28 L11.2 30.6 Z"/>
    <path d="M2 50 L3.6 48.6 L4.2 51 Z"/>
  </g>
  <g fill="#f4fbff"><circle cx="14" cy="32" r="0.6"/><circle cx="20" cy="40" r="0.6"/><circle cx="6" cy="36" r="0.5"/><circle cx="24" cy="44" r="0.5"/></g>
  <path d="M19 39 L19.7 41.4 L22 42 L19.7 42.6 L19 45 L18.3 42.6 L16 42 L18.3 41.4 Z" fill="#fff3c8"/>
  <path d="M53 6 L53.7 8.6 L56.4 9.4 L53.7 10.2 L53 12.8 L52.3 10.2 L49.6 9.4 L52.3 8.6 Z" fill="#fff3c8"/>
