<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="fire_disk-face" cx="0.4" cy="0.35" r="0.72">
      <stop offset="0" stop-color="#9aa88a"/>
      <stop offset="0.5" stop-color="#6b7d5a"/>
      <stop offset="1" stop-color="#2f3a2a"/>
    </radialGradient>
    <linearGradient id="fire_disk-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d27a"/>
      <stop offset="0.35" stop-color="#a8823e"/>
      <stop offset="1" stop-color="#3a2e1c"/>
    </linearGradient>
    <radialGradient id="fire_disk-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c8"/>
      <stop offset="0.3" stop-color="#ffc56b"/>
      <stop offset="0.6" stop-color="#e0524a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c43a3a" stop-opacity="0"/>
    </radialGradient>
    <filter id="fire_disk-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
  </defs>
  <!-- shadow -->
  <circle cx="33.5" cy="34" r="28" fill="#14101a" opacity="0.4"/>
  <!-- rim -->
  <circle cx="32" cy="32" r="28" fill="url(#fire_disk-rim)" stroke="#14101a" stroke-width="2"/>
  <!-- outer ring with trigram marks -->
  <circle cx="32" cy="32" r="24.5" fill="url(#fire_disk-face)" stroke="#2a2014" stroke-width="1.2"/>
  <g stroke="#1f1626" stroke-width="1.5" stroke-linecap="butt">
    <g id="fire_disk-tri">
      <path d="M28.5 10 h7 M28.5 12.6 h2.8 M32.7 12.6 h2.8 M28.5 15.2 h7"/>
    </g>
    <use href="#fire_disk-tri" transform="rotate(45 32 32)"/>
    <use href="#fire_disk-tri" transform="rotate(90 32 32)"/>
    <use href="#fire_disk-tri" transform="rotate(135 32 32)"/>
    <use href="#fire_disk-tri" transform="rotate(180 32 32)"/>
    <use href="#fire_disk-tri" transform="rotate(225 32 32)"/>
    <use href="#fire_disk-tri" transform="rotate(270 32 32)"/>
    <use href="#fire_disk-tri" transform="rotate(315 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#2a2014" stroke-width="1.2"/>
  <circle cx="32" cy="32" r="16.8" fill="none" stroke="#c6d0b0" stroke-width="0.6" opacity="0.6"/>
  <!-- inner ring flame runes -->
  <circle cx="32" cy="32" r="15.4" fill="#3a3f4a" opacity="0.5"/>
  <g fill="#c43a3a" stroke="#5e0f1c" stroke-width="0.6" stroke-linejoin="round">
    <g id="fire_disk-flame">
      <path d="M32 18.2 Q34.6 21 33.2 23.4 Q32 24.4 30.8 23.4 Q30 21.6 31.6 20.6 Q31.2 19.6 32 18.2 Z"/>
    </g>
    <use href="#fire_disk-flame" transform="rotate(60 32 32)"/>
    <use href="#fire_disk-flame" transform="rotate(120 32 32)"/>
    <use href="#fire_disk-flame" transform="rotate(180 32 32)"/>
    <use href="#fire_disk-flame" transform="rotate(240 32 32)"/>
    <use href="#fire_disk-flame" transform="rotate(300 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="8" fill="none" stroke="#2a2014" stroke-width="1"/>
  <!-- core fire -->
  <circle cx="32" cy="32" r="9" fill="url(#fire_disk-core)" filter="url(#fire_disk-glow)"/>
  <path d="M32 26 Q36 29.5 35 33 Q34 36 32 36 Q30 36 29 33 Q28.5 30.5 30.5 29 Q30.5 31 31.8 31.5 Q31 28.5 32 26 Z" fill="#e0524a" stroke="#5e0f1c" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M32 30 Q33.8 32 33 34 Q32 35.2 31 34 Q30.6 32.4 32 30 Z" fill="#ffc56b"/>
  <!-- verdigris -->
  <g fill="#3fae8f" opacity="0.55">
    <circle cx="14" cy="40" r="1.6"/>
    <circle cx="47" cy="20" r="1.3"/>
    <circle cx="44" cy="49" r="1.1"/>
  </g>
  <!-- rim highlight -->
  <path d="M7.5 26 Q11 11 26 5.5" fill="none" stroke="#fff3c8" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
</svg>
