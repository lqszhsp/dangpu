<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="soul_pearl-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b3474" stop-opacity="0.7"/>
      <stop offset="0.65" stop-color="#3d2350" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#3d2350" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="soul_pearl-body" cx="0.42" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#5b3474"/>
      <stop offset="0.5" stop-color="#2a1838"/>
      <stop offset="0.85" stop-color="#1f1626"/>
      <stop offset="1" stop-color="#14101a"/>
    </radialGradient>
    <linearGradient id="soul_pearl-bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dfcc"/>
      <stop offset="0.55" stop-color="#d8c49a"/>
      <stop offset="1" stop-color="#8a7a5c"/>
    </linearGradient>
    <filter id="soul_pearl-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>
  <circle cx="32" cy="28" r="28" fill="url(#soul_pearl-halo)"/>
  <!-- shadow -->
  <ellipse cx="32" cy="58" rx="20" ry="3.6" fill="#14101a" opacity="0.5"/>
