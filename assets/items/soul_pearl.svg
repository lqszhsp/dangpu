  <ellipse cx="32" cy="29" rx="21.5" ry="6" fill="none" stroke="#5e0f1c" stroke-width="2" transform="rotate(-18 32 29)" opacity="0.7"/>
  <!-- pearl -->
  <circle cx="32" cy="29" r="19" fill="url(#soul_pearl-body)" stroke="#14101a" stroke-width="2.2"/>
  <!-- swirling soul threads inside -->
  <g fill="none" stroke-linecap="round" filter="url(#soul_pearl-blur)">
    <path d="M22 32 Q22 20 32 20 Q42 20 41.5 29 Q41 36 33 36 Q26 36 26.5 29 Q27 24.5 32 24.5 Q36.5 24.5 36.5 28.5" stroke="#8fd3ff" stroke-width="2.6"/>
  </g>
  <path d="M22 32 Q22 20 32 20 Q42 20 41.5 29 Q41 36 33 36 Q26 36 26.5 29 Q27 24.5 32 24.5 Q36.5 24.5 36.5 28.5" fill="none" stroke="#f4fbff" stroke-width="1" stroke-linecap="round"/>
  <path d="M24 38 Q30 42 38 39.5 M38.5 18 Q43 21 44 25" fill="none" stroke="#cfefff" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
  <circle cx="32.5" cy="29" r="1.6" fill="#f4fbff"/>
  <!-- blood rune ring (front) -->
  <path d="M10.5 29 A21.5 6 0 0 0 53.5 29" fill="none" stroke="#5e0f1c" stroke-width="2.8" transform="rotate(-18 32 29)"/>
  <path d="M10.5 29 A21.5 6 0 0 0 53.5 29" fill="none" stroke="#c43a3a" stroke-width="1.1" transform="rotate(-18 32 29)"/>
  <g stroke="#e0524a" stroke-width="1.1" stroke-linecap="round" fill="none" transform="rotate(-18 32 29)">
    <path d="M14.5 31 l2 1.5 M16 28.5 v4"/>
    <path d="M24 34.2 l1.5 -2 l1.5 2"/>
    <path d="M37 34.4 h3 M38.5 33 v3"/>
    <path d="M47 31.8 l1.6 -2.2 M47 29.6 l1.8 2"/>
  </g>
  <!-- rim light and highlight -->
  <path d="M46 36 Q42 45 32 47" fill="none" stroke="#5b3474" stroke-width="1.4" stroke-linecap="round"/>
  <ellipse cx="25" cy="19.5" rx="5" ry="3" fill="#cfefff" opacity="0.55" transform="rotate(-35 25 19.5)"/>
  <circle cx="22.5" cy="18.5" r="1.3" fill="#f4fbff"/>
</svg>
