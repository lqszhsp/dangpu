  <path d="M15 51 Q32 46 49 51 L47 56 Q32 60 17 56 Z" fill="url(#soul_pearl-bone)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M20 53.5 Q32 51 44 53.5" fill="none" stroke="#8a7a5c" stroke-width="0.9"/>
  <!-- bone claws -->
  <g fill="url(#soul_pearl-bone)" stroke="#14101a" stroke-width="1.6" stroke-linejoin="round">
    <path d="M18 51 Q12 44 13.5 35 Q15 38 17 40 Q18 46 22 49.5 Z"/>
    <path d="M46 51 Q52 44 50.5 35 Q49 38 47 40 Q46 46 42 49.5 Z"/>
    <path d="M28.5 49 Q32 44.5 35.5 49 Q32 52 28.5 49 Z"/>
