<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="book_brew-cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc56b"/>
      <stop offset="0.5" stop-color="#e8902f"/>
      <stop offset="1" stop-color="#9a4d12"/>
    </linearGradient>
    <linearGradient id="book_brew-pages" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe2c4"/>
      <stop offset="0.6" stop-color="#d8c49a"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
    <radialGradient id="book_brew-medal" cx="0.42" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#5e0f1c"/>
      <stop offset="1" stop-color="#2a1838"/>
    </radialGradient>
    <linearGradient id="book_brew-em" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe2c4"/>
      <stop offset="0.45" stop-color="#d8c49a"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
  </defs>
  <g transform="translate(32 32) rotate(-12) translate(-32.3 -32.3)">
    <!-- shadow -->
    <rect x="16" y="11" width="38.6" height="48.6" rx="2" fill="#14101a" opacity="0.45"/>
    <!-- page block -->
    <path d="M14 9.6 L51.6 10.6 L51.6 56.6 L15.6 56.6 Z" fill="url(#book_brew-pages)" stroke="#14101a" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M50 13 L50 55 M48.6 55.2 L17 55.2" fill="none" stroke="#8a5a1c" stroke-width="0.6" opacity="0.7"/>
    <path d="M51 16 L51 54" stroke="#fff8e6" stroke-width="0.5" opacity="0.6"/>
    <!-- cover -->
    <rect x="13" y="8" width="36" height="46" rx="1.4" fill="url(#book_brew-cover)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- spine strip -->
    <path d="M13 8 L19.8 8 L19.8 54 L13 54 Z" fill="#14101a" opacity="0.28"/>
    <path d="M19.8 8.6 L19.8 53.4" stroke="#14101a" stroke-width="0.8" opacity="0.6"/>
    <!-- inner border -->
    <rect x="22" y="10.6" width="24.6" height="40.8" rx="0.6" fill="none" stroke="#fff3c8" stroke-width="0.6" opacity="0.55"/>
    <!-- binding thread -->
    <g stroke="#efe2c4" stroke-width="1" stroke-linecap="round" fill="none">
      <path d="M16.8 12.4 L16.8 49.6"/>
      <path d="M12.6 12.4 L16.8 12.4 M12.6 24.8 L16.8 24.8 M12.6 37.2 L16.8 37.2 M12.6 49.6 L16.8 49.6"/>
    </g>
    <g fill="#14101a"><circle cx="16.8" cy="12.4" r="0.8"/><circle cx="16.8" cy="24.8" r="0.8"/><circle cx="16.8" cy="37.2" r="0.8"/><circle cx="16.8" cy="49.6" r="0.8"/></g>
    <!-- corner wraps -->
    <g fill="#8e1b2b" stroke="#14101a" stroke-width="0.8" stroke-linejoin="round">
      <path d="M12.4 7.6 L17 7.6 L17 10.2 L12.4 10.2 Z"/><path d="M12.4 51.8 L17 51.8 L17 54.4 L12.4 54.4 Z"/>
    </g>
    <!-- cover highlight -->
    <path d="M15 9.6 L47 9.6" stroke="#fff8e6" stroke-width="0.9" stroke-linecap="round" opacity="0.45"/>
    <path d="M47.6 11 L47.6 40" stroke="#fff8e6" stroke-width="0.7" stroke-linecap="round" opacity="0.25"/>
    <!-- medallion -->
    <circle cx="34.3" cy="31" r="12.4" fill="#14101a" opacity="0.35"/>
    <circle cx="34.3" cy="31" r="11.6" fill="url(#book_brew-medal)" stroke="#d9a441" stroke-width="1.4"/>
    <circle cx="34.3" cy="31" r="12.5" fill="none" stroke="#14101a" stroke-width="0.8"/>
    <circle cx="34.3" cy="31" r="10.2" fill="none" stroke="#8a5a1c" stroke-width="0.5"/>
    <g transform="translate(34.3 31)">
    <g stroke="#14101a" stroke-linejoin="round">
      <path d="M-3.4 -5 Q-8.6 -4 -8.4 2 Q-8 8.6 -3.6 9.6 L3.6 9.6 Q8 8.6 8.4 2 Q8.6 -4 3.4 -5 Z" fill="url(#book_brew-em)" stroke-width="1.1"/>
      <path d="M-3.4 -5 L-2.6 -7 L2.6 -7 L3.4 -5 Z" fill="#9a4d12" stroke-width="0.9"/>
      <path d="M-4.6 -6.8 Q0 -12.6 4.6 -6.8 Q0 -5.6 -4.6 -6.8 Z" fill="#c43a3a" stroke-width="1"/>
      <path d="M-3.2 -6.4 L-5.4 -3.6 M3.2 -6.4 L5 -4.2" stroke="#c43a3a" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M0 -1.6 L3.4 1.8 L0 5.2 L-3.4 1.8 Z" fill="#c43a3a" stroke-width="0.8"/>
    </g>
    <path d="M-1.4 1.8 L1.4 1.8 M0 0.4 L0 3.2" stroke="#f2d27a" stroke-width="0.6"/>
    <path d="M-6.6 0 Q-6.6 5 -4 7.6" fill="none" stroke="#fff8e6" stroke-width="0.9" stroke-linecap="round" opacity="0.8"/>
    </g>
    <path d="M25.4 25 Q27.6 20.6 32 19.6" fill="none" stroke="#f2d27a" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
