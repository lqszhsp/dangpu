<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 192">
  <defs>
    <linearGradient id="sword_std-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f1626"/>
      <stop offset="0.45" stop-color="#3a3f4a"/>
      <stop offset="0.5" stop-color="#5c6370"/>
      <stop offset="1" stop-color="#2a2a33"/>
    </linearGradient>
    <linearGradient id="sword_std-guard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c43a3a"/>
      <stop offset="0.5" stop-color="#8e1b2b"/>
      <stop offset="1" stop-color="#5e0f1c"/>
    </linearGradient>
    <linearGradient id="sword_std-grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14101a"/>
      <stop offset="0.4" stop-color="#3d2350"/>
