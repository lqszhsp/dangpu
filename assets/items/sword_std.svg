  <circle cx="32" cy="136" r="1.4" fill="#e0524a"/>
  <circle cx="9.5" cy="136" r="1.3" fill="#d9a441"/>
  <circle cx="54.5" cy="136" r="1.3" fill="#d9a441"/>
  <!-- grip -->
  <rect x="27.5" y="142" width="9" height="32" rx="1.5" fill="url(#sword_std-grip)" stroke="#14101a" stroke-width="1.8"/>
  <g stroke="#14101a" stroke-width="1.2">
    <path d="M27.5 146 L36.5 149 M27.5 151 L36.5 154 M27.5 156 L36.5 159 M27.5 161 L36.5 164 M27.5 166 L36.5 169"/>
  </g>
