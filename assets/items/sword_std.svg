    <path d="M27.8 144.3 L36.2 147.2 M27.8 149.3 L36.2 152.2 M27.8 154.3 L36.2 157.2 M27.8 159.3 L36.2 162.2 M27.8 164.3 L36.2 167.2 M27.8 169.3 L36.2 172"/>
  </g>
  <!-- pommel -->
  <path d="M26 174 L38 174 L40 179 L32 185 L24 179 Z" fill="url(#sword_std-guard)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M27 175.5 L37 175.5" stroke="#e0524a" stroke-width="0.8" opacity="0.8"/>
  <circle cx="32" cy="179" r="1.4" fill="#d9a441"/>
