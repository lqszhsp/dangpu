<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="xuan_essence-metal" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#cfefff"/>
      <stop offset="0.22" stop-color="#4a8fb8"/>
      <stop offset="0.42" stop-color="#2a3550"/>
      <stop offset="0.5" stop-color="#14101a"/>
      <stop offset="0.78" stop-color="#1f1626"/>
      <stop offset="1" stop-color="#2a5f86"/>
    </linearGradient>
    <radialGradient id="xuan_essence-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4a8fb8" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#4a8fb8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4a8fb8" stop-opacity="0"/>
    </radialGradient>
    <filter id="xuan_essence-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="36" r="29" fill="url(#xuan_essence-halo)"/>
  <ellipse cx="32" cy="56" rx="27" ry="4" fill="#14101a" opacity="0.5"/>
  <!-- cold rim light -->
  <path d="M5 45 Q3 35 11 31 Q13 20 25 19.4 Q34 12 45 17.6 Q57 20 57.6 32 Q62 41 56.6 48 Q48 55.6 32 55 Q11 55.4 5 45 Z" fill="none" stroke="#8fd3ff" stroke-width="3" opacity="0.6" filter="url(#xuan_essence-blur)"/>
  <!-- body -->
  <path d="M5 45 Q3 35 11 31 Q13 20 25 19.4 Q34 12 45 17.6 Q57 20 57.6 32 Q62 41 56.6 48 Q48 55.6 32 55 Q11 55.4 5 45 Z" fill="url(#xuan_essence-metal)" stroke="#14101a" stroke-width="2" stroke-linejoin="round"/>
  <!-- lobe divisions (flowing seams) -->
  <path d="M11 31 Q18 34 24 31 Q30 28 36 31" fill="none" stroke="#14101a" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <path d="M45 17.6 Q44 25 50 29 Q54 31 57.6 32" fill="none" stroke="#14101a" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <!-- horizon reflection line -->
  <path d="M7.6 39.6 Q16 36 26 38 Q38 40.6 48 36.6 Q54 34.4 59 37" fill="none" stroke="#8fd3ff" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <!-- liquid sheen streaks -->
  <path d="M14 29 Q16 23 24 22.4 Q30 22 33 19.4" fill="none" stroke="#f4fbff" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>
  <path d="M38 19.6 Q44 19 48 22" fill="none" stroke="#f4fbff" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <path d="M50 24 Q54 26 55 30" fill="none" stroke="#cfefff" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <ellipse cx="21" cy="25.6" rx="2" ry="1" fill="#ffffff" transform="rotate(-20 21 25.6)"/>
  <!-- bottom reflected cold light -->
  <path d="M10 47 Q20 53 34 52.6 Q48 52 55 46" fill="none" stroke="#4a8fb8" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  <path d="M18 50 Q26 52 34 51.6" fill="none" stroke="#8fd3ff" stroke-width="0.7" stroke-linecap="round" opacity="0.8"/>
  <!-- surface ripple -->
  <path d="M26 44 Q30 42.6 34 44 Q38 45.4 42 44" fill="none" stroke="#4a8fb8" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
  <!-- cold sparkles -->
  <g fill="#f4fbff">
    <path d="M51 5 L51.8 8.2 L55 9 L51.8 9.8 L51 13 L50.2 9.8 L47 9 L50.2 8.2 Z"/>
    <path d="M10 14 L10.5 16 L12.5 16.5 L10.5 17 L10 19 L9.5 17 L7.5 16.5 L9.5 16 Z" opacity="0.9"/>
    <path d="M30 6 L30.4 7.6 L32 8 L30.4 8.4 L30 10 L29.6 8.4 L28 8 L29.6 7.6 Z" opacity="0.8"/>
  </g>
  <g fill="#8fd3ff"><circle cx="60" cy="28" r="0.9"/><circle cx="4" cy="30" r="0.8"/><circle cx="40" cy="9" r="0.7"/></g>
