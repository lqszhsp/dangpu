<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 128">
  <defs>
    <linearGradient id="broken_relic-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3f4a"/>
      <stop offset="0.45" stop-color="#9aa88a"/>
      <stop offset="0.55" stop-color="#6b7d5a"/>
      <stop offset="1" stop-color="#3a3f4a"/>
    </linearGradient>
    <linearGradient id="broken_relic-bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa88a"/>
      <stop offset="0.5" stop-color="#6b7d5a"/>
      <stop offset="1" stop-color="#3a3f4a"/>
    </linearGradient>
    <linearGradient id="broken_relic-grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f1626"/>
      <stop offset="0.45" stop-color="#5e0f1c"/>
      <stop offset="1" stop-color="#14101a"/>
    </linearGradient>
    <radialGradient id="broken_relic-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fd6b5" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#3fae8f" stop-opacity="0"/>
    </radialGradient>
    <filter id="broken_relic-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>
  <!-- spirit halo at break -->
  <ellipse cx="32" cy="51" rx="24" ry="18" fill="url(#broken_relic-halo)"/>
  <ellipse cx="32" cy="121" rx="14" ry="2.6" fill="#14101a" opacity="0.45"/>
  <!-- ===== upper fragment (tip) ===== -->
  <g transform="rotate(7 32 30)">
    <path d="M32 6 L38.5 20 L38.6 44 L36.5 41.5 L34.8 46 L32.6 42.4 L30.4 46.6 L28 42 L25.6 44.8 L25.5 20 Z" fill="#3fae8f" opacity="0.7" filter="url(#broken_relic-glow)"/>
    <path d="M32 6 L38.5 20 L38.6 44 L36.5 41.5 L34.8 46 L32.6 42.4 L30.4 46.6 L28 42 L25.6 44.8 L25.5 20 Z" fill="url(#broken_relic-blade)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M32 9 L32 41" stroke="#3a3f4a" stroke-width="0.9" opacity="0.8"/>
    <path d="M29.6 15 L28.8 40" stroke="#e9dfcc" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
    <!-- rust -->
    <g fill="#9a4d12" opacity="0.85">
      <path d="M34 22 Q37.6 21 38.4 25 Q37.6 29 35 28 Q33 26 34 22 Z"/>
      <path d="M26 33 Q28.8 32 29.4 35.5 Q28 38 26 37 Z"/>
      <circle cx="35.6" cy="35" r="1.3"/>
    </g>
    <g fill="#e8902f" opacity="0.6"><circle cx="35.6" cy="24" r="0.8"/><circle cx="27.2" cy="34.6" r="0.6"/></g>
    <!-- crack -->
    <path d="M33 30 L34.6 33 L33.2 35.6 L35 39" fill="none" stroke="#14101a" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M33 30 L34.6 33 L33.2 35.6 L35 39" fill="none" stroke="#7fd6b5" stroke-width="0.5" stroke-linejoin="round"/>
  </g>
  <!-- ===== lower fragment ===== -->
  <path d="M25.5 92 L25.6 60 L28.4 55 L30.6 59.4 L33 54 L35 58.6 L37 56.4 L38.5 60.6 L38.5 92 Z" fill="#3fae8f" opacity="0.7" filter="url(#broken_relic-glow)"/>
  <path d="M25.5 92 L25.6 60 L28.4 55 L30.6 59.4 L33 54 L35 58.6 L37 56.4 L38.5 60.6 L38.5 92 Z" fill="url(#broken_relic-blade)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M32 60 L32 90" stroke="#3a3f4a" stroke-width="0.9" opacity="0.8"/>
  <path d="M28.8 63 L28.6 89" stroke="#e9dfcc" stroke-width="1.1" stroke-linecap="round" opacity="0.5"/>
  <!-- glowing break edge -->
  <path d="M25.8 60 L28.4 55 L30.6 59.4 L33 54 L35 58.6 L37 56.4 L38.3 60.6" fill="none" stroke="#7fd6b5" stroke-width="1" stroke-linejoin="round"/>
  <!-- cracks with light -->
  <path d="M30.6 59.4 L31.4 64 L29.6 68 L31 73" fill="none" stroke="#14101a" stroke-width="1" stroke-linejoin="round"/>
  <path d="M30.6 59.4 L31.4 64 L29.6 68 L31 73" fill="none" stroke="#7fd6b5" stroke-width="0.5" stroke-linejoin="round"/>
  <path d="M35 58.6 L34.2 62 L36 65" fill="none" stroke="#14101a" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- rust patches -->
  <g fill="#9a4d12" opacity="0.85">
    <path d="M33.4 68 Q38 67 38.4 72 Q37.6 77 34.4 76 Q32.4 72 33.4 68 Z"/>
    <path d="M25.8 78 Q29.6 77 30 82 Q28.6 85 25.8 84 Z"/>
    <circle cx="36" cy="84" r="1.5"/>
  </g>
  <g fill="#e8902f" opacity="0.55"><circle cx="35.4" cy="70.6" r="0.9"/><circle cx="27.6" cy="80" r="0.7"/></g>
  <!-- dirt clods near guard -->
  <path d="M25.6 92 Q25.4 86 28 85.6 Q30 87.6 33 87 Q36 85 38.4 88.4 L38.5 92 Z" fill="#8a5a1c" opacity="0.85"/>
  <path d="M27 88 Q30 89.6 33.6 88.6" fill="none" stroke="#3a2210" stroke-width="0.7" opacity="0.6"/>
  <!-- guard -->
  <path d="M15 91 Q24 89 32 91 Q40 89 49 91 Q50.5 94 47 96.5 Q40 95 32 97 Q24 95 17 96.5 Q13.5 94 15 91 Z" fill="url(#broken_relic-bronze)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M17 92.2 Q24 90.6 31 92" fill="none" stroke="#e9dfcc" stroke-width="0.8" opacity="0.6"/>
  <path d="M16 95.5 L13.6 98 M47.8 95.6 L51 97.6" stroke="#14101a" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="32" cy="93.6" r="2" fill="#1f5c4c" stroke="#14101a" stroke-width="0.9"/>
  <circle cx="31.5" cy="93.1" r="0.7" fill="#7fd6b5"/>
  <g fill="#9a4d12" opacity="0.8"><circle cx="21" cy="93" r="1.2"/><circle cx="43" cy="94" r="1"/></g>
  <!-- grip -->
  <rect x="28.4" y="96.8" width="7.2" height="17" rx="1.6" fill="url(#broken_relic-grip)" stroke="#14101a" stroke-width="1.6"/>
  <g stroke="#8e1b2b" stroke-width="0.8" opacity="0.8"><path d="M28.8 100 L35.2 102.4 M28.8 104.4 L35.2 106.8 M28.8 108.8 L35.2 111.2"/></g>
  <path d="M30 98.6 L30 112" stroke="#c43a3a" stroke-width="0.6" opacity="0.4"/>
  <!-- pommel -->
  <path d="M27 113.6 L37 113.6 Q39.6 116.6 36.4 119.4 L32 121 L27.6 119.4 Q24.4 116.6 27 113.6 Z" fill="url(#broken_relic-bronze)" stroke="#14101a" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="32" cy="117" r="1.4" fill="#9a4d12"/>
  <!-- spirit motes -->
  <g fill="#7fd6b5">
    <circle cx="18" cy="48" r="1.1" opacity="0.9"/>
    <circle cx="46" cy="54" r="1" opacity="0.9"/>
    <circle cx="42" cy="44" r="0.7" opacity="0.8"/>
    <circle cx="21" cy="60" r="0.7" opacity="0.8"/>
  </g>
  <path d="M47 46 L47.6 48.4 L50 49 L47.6 49.6 L47 52 L46.4 49.6 L44 49 L46.4 48.4 Z" fill="#cfefff"/>
  <path d="M15 53 L15.4 54.6 L17 55 L15.4 55.4 L15 57 L14.6 55.4 L13 55 L14.6 54.6 Z" fill="#cfefff" opacity="0.85"/>
</svg>
