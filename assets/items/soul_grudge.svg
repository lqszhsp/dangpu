<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="soul_grudge-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c43a3a" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#5e0f1c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5e0f1c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="soul_grudge-glass" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#5b3474" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#2a1838" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#14101a" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="soul_grudge-ghost" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#e0524a"/>
      <stop offset="0.5" stop-color="#8e1b2b" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3d2350" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="soul_grudge-paper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a1c"/>
      <stop offset="0.5" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
    <filter id="soul_grudge-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <circle cx="32" cy="38" r="28" fill="url(#soul_grudge-halo)"/>
