  <path d="M23.8 11.6 Q32 13.8 40.2 11.6" fill="none" stroke="#14101a" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M23.8 11.6 Q32 13.2 40.2 11.6" fill="none" stroke="#8e1b2b" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M24.5 12 Q20 15 21 20 M24.5 12 Q19 13 17.5 17" fill="none" stroke="#8e1b2b" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="24.4" cy="12" r="1.4" fill="#8e1b2b" stroke="#14101a" stroke-width="0.7"/>
