<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fu_paper-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3b8"/>
      <stop offset="0.5" stop-color="#f2d27a"/>
      <stop offset="1" stop-color="#d9a441"/>
    </linearGradient>
    <linearGradient id="fu_paper-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <path d="M15 12 L52 9 L54 60 L17 61.6 Z" fill="#14101a" opacity="0.4"/>
  <!-- back sheets -->
  <g stroke="#8a5a1c" stroke-width="1.3" stroke-linejoin="round">
    <path d="M17.6 7 L45.6 3.6 L50.4 55 L22 58 Z" fill="#d9a441"/>
    <path d="M14 7.6 L42.4 6 L44 57.6 L15.4 58.6 Z" fill="#f2d27a"/>
  </g>
  <!-- stack thickness -->
  <path d="M18 56 L48 56 L48 59.6 L18 59.6 Z" fill="url(#fu_paper-edge)" stroke="#14101a" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M47 9 L49.6 10 L49.6 58.6 L48 59.6 L48 56 Z" fill="#8a5a1c" stroke="#14101a" stroke-width="1.2" stroke-linejoin="round"/>
  <g stroke="#efe2c4" stroke-width="0.5" opacity="0.8">
    <path d="M18.6 57.2 L47.4 57.2 M18.6 58.4 L47.4 58.4"/>
    <path d="M48.4 12 L48.4 57"/>
  </g>
  <!-- top sheet -->
  <path d="M16.6 6 L47 6 L48 56 L18 56 Z" fill="url(#fu_paper-paper)" stroke="#14101a" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M18.6 8 L45 8" stroke="#fffbe6" stroke-width="1" stroke-linecap="round" opacity="0.9"/>
  <path d="M19 9.4 L19.8 53" stroke="#fffbe6" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  <!-- faint paper fibers -->
  <g fill="none" stroke="#d9a441" stroke-width="0.5" opacity="0.7">
    <path d="M24 14 q3 1 6 0 M34 20 q3 1 6 0 M23 44 q3 1 6 0 M36 48 q3 -1 6 0"/>
  </g>
  <!-- red cord band -->
  <g fill="none" stroke-linecap="round">
    <path d="M16 30 L49.6 30.4" stroke="#14101a" stroke-width="4"/>
    <path d="M16 30 L49.6 30.4" stroke="#c43a3a" stroke-width="2.4"/>
    <path d="M16 29.4 L49.6 29.8" stroke="#e0524a" stroke-width="0.7" opacity="0.8"/>
  </g>
  <!-- bow knot -->
  <g stroke="#14101a" stroke-width="1.3" stroke-linejoin="round">
    <path d="M32.6 30.2 Q26 22 22.6 25 Q20.6 28.6 32.6 30.2 Z" fill="#c43a3a"/>
    <path d="M32.6 30.2 Q39.4 22 42.6 25 Q44.6 28.6 32.6 30.2 Z" fill="#c43a3a"/>
    <path d="M32 31 Q29 37 25.4 41.6 L28 42.6 Q31 37.4 33 31.6 Z" fill="#8e1b2b"/>
    <path d="M33.2 31 Q36.6 36.4 40.6 40 L38.4 41.6 Q35 37 32.6 31.6 Z" fill="#8e1b2b"/>
    <circle cx="32.6" cy="30.4" r="2.4" fill="#e0524a"/>
  </g>
  <path d="M24.4 25.6 Q26 25 28 26.4 M40.6 25.6 Q39 25 37 26.4" fill="none" stroke="#ffc56b" stroke-width="0.6" opacity="0.8"/>
  <!-- tassel ends -->
  <g fill="#c43a3a" stroke="#14101a" stroke-width="0.8"><circle cx="26" cy="42.8" r="1.2"/><circle cx="39.8" cy="41.6" r="1.2"/></g>
</svg>
