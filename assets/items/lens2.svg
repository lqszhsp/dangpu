<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="lens2-jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd6b5"/>
      <stop offset="0.4" stop-color="#3fae8f"/>
      <stop offset="1" stop-color="#1f5c4c"/>
    </linearGradient>
    <radialGradient id="lens2-face" cx="0.4" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="0.3" stop-color="#8fd3ff"/>
      <stop offset="0.75" stop-color="#4a8fb8"/>
      <stop offset="1" stop-color="#1f5c4c"/>
    </radialGradient>
    <linearGradient id="lens2-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a1c"/>
      <stop offset="0.4" stop-color="#f2d27a"/>
      <stop offset="0.7" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
    <filter id="lens2-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>
  <g transform="rotate(-24 32 32)">
    <!-- aura -->
    <circle cx="32" cy="22" r="19" fill="#3fae8f" opacity="0.35" filter="url(#lens2-glow)"/>
    <!-- shadow -->
    <circle cx="34.5" cy="23.5" r="18.5" fill="#14101a" opacity="0.4"/>
    <!-- handle -->
    <path d="M29.4 42 L34.6 42 L35.4 55 L36.6 57 L32 61 L27.4 57 L28.6 55 Z" fill="url(#lens2-gold)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M28.9 47 L35.1 47 M28.7 52 L35.3 52" stroke="#8a5a1c" stroke-width="1"/>
    <circle cx="32" cy="57.2" r="1.4" fill="#3fae8f" stroke="#14101a" stroke-width="0.8"/>
    <path d="M31.2 44 L31.4 54" stroke="#fff3c8" stroke-width="0.9" stroke-linecap="round" opacity="0.8"/>
    <!-- collar (gold) -->
    <path d="M26.5 38.5 L37.5 38.5 L35.6 44 L28.4 44 Z" fill="url(#lens2-gold)" stroke="#14101a" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- cloud ears -->
    <g fill="url(#lens2-jade)" stroke="#14101a" stroke-width="1.6" stroke-linejoin="round">
      <path d="M14.5 26 Q9.5 26 9.6 21.5 Q10 17.5 14 18 Q12.6 21.5 15.4 22 Z"/>
      <path d="M49.5 26 Q54.5 26 54.4 21.5 Q54 17.5 50 18 Q51.4 21.5 48.6 22 Z"/>
      <path d="M26 5.5 Q26.5 1.6 32 1.8 Q37.5 1.6 38 5.5 Q35 4.2 32 6 Q29 4.2 26 5.5 Z"/>
    </g>
    <!-- rim -->
    <circle cx="32" cy="22" r="18" fill="url(#lens2-jade)" stroke="#14101a" stroke-width="2.2"/>
    <!-- carved cloud scrolls on rim -->
    <g fill="none" stroke="#1f5c4c" stroke-width="1.1" stroke-linecap="round">
      <path d="M22 8.6 Q19.5 8.6 19.6 10.8 Q20 12.6 21.8 12 Q22.6 10.4 21 10.2"/>
      <path d="M42 8.6 Q44.5 8.6 44.4 10.8 Q44 12.6 42.2 12 Q41.4 10.4 43 10.2"/>
      <path d="M17.4 31 Q16 33.5 18.2 34.6 Q20 35 20.2 33.2 Q19 32.4 18.6 33.6"/>
      <path d="M46.6 31 Q48 33.5 45.8 34.6 Q44 35 43.8 33.2 Q45 32.4 45.4 33.6"/>
      <path d="M27 38.6 Q29.5 37.2 32 38.6 Q34.5 37.2 37 38.6"/>
    </g>
    <circle cx="32" cy="22" r="14.4" fill="#1f5c4c" stroke="#14101a" stroke-width="1.2"/>
    <circle cx="32" cy="22" r="16.4" fill="none" stroke="#d9a441" stroke-width="0.8" opacity="0.9"/>
    <!-- face -->
    <circle cx="32" cy="22" r="13" fill="#8fd3ff" opacity="0.8" filter="url(#lens2-glow)"/>
    <circle cx="32" cy="22" r="13.2" fill="url(#lens2-face)" stroke="#d9a441" stroke-width="1"/>
    <!-- faint cloud reflection -->
    <path d="M27 28 Q28 25.5 31 26.4 Q32.5 24.2 35.4 25.4 Q38 25.6 37.6 28" fill="none" stroke="#cfefff" stroke-width="0.9" stroke-linecap="round" opacity="0.7"/>
    <!-- face highlights -->
    <path d="M23.4 18 Q25.5 12.4 31 11.2" fill="none" stroke="#f4fbff" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
    <path d="M24.8 23 L26.8 21" stroke="#f4fbff" stroke-width="1.3" stroke-linecap="round" opacity="0.75"/>
    <!-- rim highlight -->
    <path d="M17 14.5 Q20.5 7.4 28.5 5.2" fill="none" stroke="#cfefff" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>
  </g>
  <!-- sparkles -->
  <g fill="#cfefff">
    <path d="M53 40 L54 43 L57 44 L54 45 L53 48 L52 45 L49 44 L52 43 Z"/>
    <circle cx="8" cy="10" r="1"/>
  </g>
</svg>
