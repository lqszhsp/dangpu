<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="waste_pill-dish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dfcc"/>
      <stop offset="0.6" stop-color="#d8c49a"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
    <radialGradient id="waste_pill-pill" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#5c6370"/>
      <stop offset="0.45" stop-color="#2a1838"/>
      <stop offset="1" stop-color="#14101a"/>
    </radialGradient>
    <filter id="waste_pill-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>
  <!-- smoke -->
  <g fill="none" stroke-linecap="round" filter="url(#waste_pill-blur)">
    <path d="M24 34 Q18 26 24 20 Q30 14 24 6" stroke="#3a3f4a" stroke-width="5" opacity="0.85"/>
    <path d="M38 34 Q44 27 38 21 Q33 15 40 8" stroke="#3a3f4a" stroke-width="4.2" opacity="0.75"/>
    <path d="M31 30 Q34 24 30 19" stroke="#5c6370" stroke-width="3" opacity="0.6"/>
  </g>
  <g fill="none" stroke="#5c6370" stroke-width="1.2" stroke-linecap="round" opacity="0.8">
    <path d="M24 30 Q20 25 24 20 Q28 15 25 9"/>
    <path d="M38 30 Q42 26 38.6 21 Q35 16 39.6 11"/>
  </g>
  <!-- dish shadow -->
  <ellipse cx="32" cy="55" rx="27" ry="5" fill="#14101a" opacity="0.45"/>
  <!-- dish body -->
  <path d="M5 42 Q6 51 18 54 Q32 57 46 54 L48.5 50 L51.5 52.5 Q58 49 59 42 Z" fill="url(#waste_pill-dish)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- rim (with chip) -->
  <path d="M5 42 Q5 35 32 35 Q59 35 59 42 Q59 47.6 46 48.6 L48 45.6 L43.6 44.6 L42 49 Q36 49.4 32 49.4 Q5 49.4 5 42 Z" fill="#efe2c4" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
  <ellipse cx="32" cy="42.4" rx="22" ry="4.6" fill="#d8c49a"/>
  <path d="M10 40 Q14 37 24 36.6" fill="none" stroke="#fff8e6" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
  <!-- cracks on dish -->
  <path d="M18 49.2 L19.6 52 L18.4 54.4 M51.5 52.5 L50 49.6" fill="none" stroke="#14101a" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M8 46 Q10 49 13 49.6" fill="none" stroke="#4a8fb8" stroke-width="0.8" opacity="0.6"/>
  <path d="M42 51.6 Q46 51 48 50" fill="none" stroke="#4a8fb8" stroke-width="0.8" opacity="0.6"/>
  <!-- ash -->
  <ellipse cx="32" cy="43.4" rx="16" ry="2.6" fill="#3a3f4a" opacity="0.55"/>
  <!-- pills -->
  <g stroke="#14101a" stroke-width="1.6" stroke-linejoin="round">
    <path d="M14.4 38.6 Q14 31 21 30.6 Q28 31 27.4 38.4 Q26 44 21 44 Q15 43.6 14.4 38.6 Z" fill="url(#waste_pill-pill)"/>
    <path d="M36.4 39 Q36 32 42.6 31.6 Q49.4 32 49 39 Q48 44.4 42.6 44.4 Q37 44 36.4 39 Z" fill="url(#waste_pill-pill)"/>
    <path d="M24.8 36 Q24.4 26.6 32 26.4 Q39.6 26.6 39.2 36 Q38 43.6 32 43.6 Q26 43.4 24.8 36 Z" fill="url(#waste_pill-pill)"/>
  </g>
  <!-- glowing cracks -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M29 29 L31.4 33 L29.6 36 L32.6 39.6 M31.4 33 L35 32" stroke="#c43a3a" stroke-width="1.3"/>
    <path d="M29 29 L31.4 33 L29.6 36 L32.6 39.6 M31.4 33 L35 32" stroke="#ffc56b" stroke-width="0.5"/>
    <path d="M18 34 L20.6 37 L18.8 40.4 M20.6 37 L24 36.4" stroke="#8e1b2b" stroke-width="1.1"/>
    <path d="M18 34 L20.6 37 L18.8 40.4" stroke="#e8902f" stroke-width="0.4"/>
    <path d="M44 34.6 L42 38 L44.6 41.4" stroke="#8e1b2b" stroke-width="1.1"/>
    <path d="M44 34.6 L42 38 L44.6 41.4" stroke="#e8902f" stroke-width="0.4"/>
  </g>
  <!-- dull highlights -->
  <g fill="none" stroke="#9aa88a" stroke-width="0.9" stroke-linecap="round" opacity="0.6">
    <path d="M27.4 31 Q29 28.6 31.4 28.2"/>
    <path d="M16.6 35 Q17.6 33 19.6 32.6"/>
    <path d="M38.6 35.4 Q39.6 33.6 41.6 33.2"/>
  </g>
  <!-- crumbs -->
  <g fill="#14101a"><circle cx="13" cy="44.6" r="0.9"/><circle cx="50.6" cy="43.6" r="1"/><circle cx="27" cy="45.4" r="0.7"/></g>
  <g fill="#e8902f" opacity="0.8"><circle cx="20" cy="22" r="0.7"/><circle cx="45" cy="25" r="0.6"/></g>
</svg>
