<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 192">
  <defs>
    <linearGradient id="xian_sword-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="0.45" stop-color="#f4fbff"/>
      <stop offset="0.52" stop-color="#cfefff"/>
      <stop offset="1" stop-color="#4a8fb8"/>
    </linearGradient>
    <linearGradient id="xian_sword-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="0.4" stop-color="#cfefff"/>
      <stop offset="1" stop-color="#4a8fb8"/>
    </linearGradient>
    <linearGradient id="xian_sword-grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f5c4c"/>
      <stop offset="0.4" stop-color="#4a8fb8"/>
      <stop offset="1" stop-color="#1f3c58"/>
    </linearGradient>
    <filter id="xian_sword-glow" x="-60%" y="-10%" width="220%" height="120%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>
  <!-- aura -->
  <path d="M32 5 L41.5 27 L41 134 L23 134 L22.5 27 Z" fill="#8fd3ff" opacity="0.75" filter="url(#xian_sword-glow)"/>
  <!-- blade -->
  <path d="M32 6 L40.5 27 L40 133 L24 133 L23.5 27 Z" fill="url(#xian_sword-blade)" stroke="#1f1626" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M32 9 L32 131" stroke="#4a8fb8" stroke-width="0.9" opacity="0.7"/>
  <path d="M29.5 17 L28.5 128" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  <!-- inscribed cloud pattern near base -->
  <path d="M28.5 110 q3.5 -3.5 7 0 q-3.5 3.5 -7 0 M28.5 119 q3.5 -3.5 7 0" fill="none" stroke="#4a8fb8" stroke-width="0.9" opacity="0.8"/>
  <!-- guard: auspicious clouds -->
  <g stroke="#1f1626" stroke-width="1.8" stroke-linejoin="round" fill="url(#xian_sword-gold)">
    <path d="M32 129 Q38 129 42 132 Q46 127 51 129 Q56 131 54 136 Q51 140 47 137.5 Q48 134.5 45.5 134 Q43 135 41 139 Q37 142 32 142 Q27 142 23 139 Q21 135 18.5 134 Q16 134.5 17 137.5 Q13 140 10 136 Q8 131 13 129 Q18 127 22 132 Q26 129 32 129 Z"/>
  </g>
  <path d="M48 133 q2 -1.5 3.5 0.5 M16 133 q-2 -1.5 -3.5 0.5" fill="none" stroke="#4a8fb8" stroke-width="0.9"/>
  <path d="M23 133 Q32 129.5 41 133" fill="none" stroke="#ffffff" stroke-width="0.9" opacity="0.9"/>
  <circle cx="32" cy="136" r="2.6" fill="#7fd6b5" stroke="#1f5c4c" stroke-width="1"/>
  <circle cx="31.3" cy="135.3" r="0.8" fill="#f4fbff"/>
  <!-- grip -->
  <rect x="28" y="142" width="8" height="30" rx="2" fill="url(#xian_sword-grip)" stroke="#1f1626" stroke-width="1.6"/>
  <g stroke="#cfefff" stroke-width="0.8" opacity="0.7">
    <path d="M28.4 147 L35.6 150 M28.4 153 L35.6 156 M28.4 159 L35.6 162 M28.4 165 L35.6 168"/>
  </g>
  <!-- pommel -->
  <path d="M27 172 L37 172 Q40 176 36 179 L32 181 L28 179 Q24 176 27 172 Z" fill="url(#xian_sword-gold)" stroke="#1f1626" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- tassel -->
  <path d="M32 180.5 Q37 185 43 182.5" fill="none" stroke="#3fae8f" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M42 183.5 Q40.5 172 46 160 Q51 158 55 162 Q50 172 45.5 184.5 Z" fill="#7fd6b5" stroke="#1f5c4c" stroke-width="1.2" stroke-linejoin="round"/>
  <g fill="none" stroke-linecap="round">
    <path d="M43.2 182 Q43 171 47.5 161.5" stroke="#cfefff" stroke-width="1"/>
    <path d="M44.5 182.5 Q46.5 171 52 162" stroke="#cfefff" stroke-width="0.8" opacity="0.8"/>
    <path d="M42.6 180 Q42 172 45 165" stroke="#3fae8f" stroke-width="0.7"/>
  </g>
  <ellipse cx="43.5" cy="182.8" rx="3" ry="2.3" fill="#cfefff" stroke="#1f5c4c" stroke-width="1.1"/>
  <ellipse cx="42.8" cy="182.1" rx="1" ry="0.7" fill="#ffffff"/>
  <!-- sparkles -->
  <path d="M44 22 L44.8 25.2 L48 26 L44.8 26.8 L44 30 L43.2 26.8 L40 26 L43.2 25.2 Z" fill="#f4fbff"/>
  <path d="M18 80 L18.5 82 L20.5 82.5 L18.5 83 L18 85 L17.5 83 L15.5 82.5 L17.5 82 Z" fill="#cfefff"/>
</svg>
