<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="beast_feed-clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8902f"/>
      <stop offset="0.45" stop-color="#9a4d12"/>
      <stop offset="1" stop-color="#5e2a10"/>
    </linearGradient>
    <linearGradient id="beast_feed-meat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c43a3a"/>
      <stop offset="0.5" stop-color="#8e1b2b"/>
      <stop offset="1" stop-color="#5e0f1c"/>
    </linearGradient>
    <radialGradient id="beast_feed-grain" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff3c8"/>
      <stop offset="0.5" stop-color="#f2d27a"/>
      <stop offset="1" stop-color="#d9a441"/>
    </radialGradient>
    <filter id="beast_feed-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>
  <ellipse cx="32" cy="57" rx="28" ry="4" fill="#14101a" opacity="0.45"/>
  <!-- glow over feed -->
  <ellipse cx="32" cy="28" rx="22" ry="10" fill="#f2d27a" opacity="0.35" filter="url(#beast_feed-glow)"/>
  <!-- trough back rim / inner -->
  <path d="M5 30 L59 30 L56 36 L8 36 Z" fill="#3a2210" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- feed contents -->
  <g stroke="#14101a" stroke-width="1.3" stroke-linejoin="round">
    <path d="M11 33 L13 24.6 L22.6 23 L23.4 31 Z" fill="url(#beast_feed-meat)"/>
    <path d="M36 32 L38.6 21.6 L48 23.4 L46.6 33 Z" fill="url(#beast_feed-meat)"/>
    <path d="M22 33 L25 26 L33 27 L32.4 34 Z" fill="url(#beast_feed-meat)"/>
    <path d="M45 34 L49.6 26.6 L55 29.4 L52.4 35 Z" fill="url(#beast_feed-meat)"/>
  </g>
  <!-- meat fibers / fat -->
  <g fill="none" stroke-linecap="round">
    <path d="M14 27 L21.4 26 M13.6 29.6 L21.8 28.6" stroke="#5e0f1c" stroke-width="0.8"/>
    <path d="M40 25 L46.4 26.4 M39.4 28 L45.8 29.4" stroke="#5e0f1c" stroke-width="0.8"/>
    <path d="M14.2 25.6 L21.4 24.4" stroke="#efe2c4" stroke-width="0.9" opacity="0.8"/>
    <path d="M39.4 22.8 L46.8 24.2" stroke="#efe2c4" stroke-width="0.9" opacity="0.8"/>
    <path d="M26 27.6 L31.6 28.2" stroke="#efe2c4" stroke-width="0.8" opacity="0.7"/>
  </g>
  <!-- spirit grains -->
  <g fill="#ffc56b" opacity="0.9" filter="url(#beast_feed-glow)">
    <circle cx="30" cy="25" r="3"/><circle cx="18" cy="31" r="2.4"/><circle cx="42" cy="31" r="2.6"/>
  </g>
  <g fill="url(#beast_feed-grain)" stroke="#8a5a1c" stroke-width="0.7">
    <ellipse cx="28" cy="24" rx="1.8" ry="1.1" transform="rotate(-30 28 24)"/>
    <ellipse cx="31.6" cy="23.2" rx="1.8" ry="1.1" transform="rotate(20 31.6 23.2)"/>
    <ellipse cx="34" cy="26" rx="1.8" ry="1.1" transform="rotate(-10 34 26)"/>
    <ellipse cx="29.6" cy="27" rx="1.7" ry="1.1" transform="rotate(40 29.6 27)"/>
    <ellipse cx="17" cy="31.6" rx="1.7" ry="1.1" transform="rotate(10 17 31.6)"/>
    <ellipse cx="20" cy="30" rx="1.7" ry="1.1" transform="rotate(-40 20 30)"/>
    <ellipse cx="41" cy="30" rx="1.7" ry="1.1" transform="rotate(30 41 30)"/>
    <ellipse cx="44" cy="32" rx="1.7" ry="1.1" transform="rotate(-20 44 32)"/>
    <ellipse cx="35.4" cy="33" rx="1.6" ry="1" transform="rotate(10 35.4 33)"/>
    <ellipse cx="9.6" cy="33" rx="1.6" ry="1" transform="rotate(-20 9.6 33)"/>
    <ellipse cx="54" cy="33.4" rx="1.6" ry="1" transform="rotate(20 54 33.4)"/>
  </g>
  <g fill="#7fd6b5" stroke="#1f5c4c" stroke-width="0.6">
    <ellipse cx="25" cy="31" rx="1.5" ry="1" transform="rotate(25 25 31)"/>
    <ellipse cx="38" cy="27" rx="1.5" ry="1" transform="rotate(-25 38 27)"/>
    <ellipse cx="49" cy="25" rx="1.5" ry="1" transform="rotate(15 49 25)"/>
  </g>
  <!-- trough front -->
  <path d="M4 32 L60 32 L55.6 52 Q55 54.6 52 54.6 L12 54.6 Q9 54.6 8.4 52 Z" fill="url(#beast_feed-clay)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M4 32 L60 32 L59.4 35 L4.6 35 Z" fill="#d9a441" stroke="#14101a" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M7 33.2 L40 33.2" stroke="#fff3c8" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
  <!-- coarse clay texture -->
  <g fill="#5e2a10" opacity="0.7">
    <circle cx="14" cy="41" r="0.8"/><circle cx="22" cy="47" r="0.7"/><circle cx="35" cy="42" r="0.8"/><circle cx="46" cy="48" r="0.7"/><circle cx="51" cy="40" r="0.8"/><circle cx="28" cy="51" r="0.6"/>
  </g>
  <path d="M8.6 39 Q8 44 10 50" fill="none" stroke="#ffc56b" stroke-width="1.1" stroke-linecap="round" opacity="0.6"/>
  <!-- rope band / incised line -->
  <path d="M7 43.6 L57 43.6" stroke="#5e2a10" stroke-width="1.4"/>
  <path d="M10 43.6 l2 -1.6 l2 1.6 l2 -1.6 l2 1.6 M46 43.6 l2 -1.6 l2 1.6 l2 -1.6 l2 1.6" fill="none" stroke="#5e2a10" stroke-width="0.8"/>
  <!-- chip crack -->
  <path d="M40 35 L41.4 39 L39.8 42" fill="none" stroke="#14101a" stroke-width="0.9" stroke-linejoin="round"/>
  <!-- glints -->
  <path d="M30 10 L30.8 13.2 L34 14 L30.8 14.8 L30 18 L29.2 14.8 L26 14 L29.2 13.2 Z" fill="#fff3c8"/>
  <g fill="#f2d27a"><circle cx="18" cy="17" r="1"/><circle cx="46" cy="14" r="0.9"/><circle cx="53" cy="21" r="0.7"/><circle cx="11" cy="24" r="0.7"/></g>
</svg>
