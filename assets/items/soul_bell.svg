<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="soul_bell-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14101a"/>
      <stop offset="0.3" stop-color="#5c6370"/>
      <stop offset="0.5" stop-color="#3a3f4a"/>
      <stop offset="1" stop-color="#14101a"/>
    </linearGradient>
    <linearGradient id="soul_bell-tassel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b3474"/>
      <stop offset="1" stop-color="#9a6ac8"/>
    </linearGradient>
    <filter id="soul_bell-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
  </defs>
  <!-- sound waves -->
  <g fill="none" stroke="#9a6ac8" stroke-linecap="round" filter="url(#soul_bell-glow)">
    <path d="M10 22 Q5 31 10 40" stroke-width="2.2"/>
    <path d="M5 18 Q-1 31 5 44" stroke-width="1.8" opacity="0.6"/>
    <path d="M50 22 Q55 31 50 40" stroke-width="2.2"/>
    <path d="M55 18 Q61 31 55 44" stroke-width="1.8" opacity="0.6"/>
  </g>
  <g fill="none" stroke="#cfa8ff" stroke-width="0.8" stroke-linecap="round">
    <path d="M10 22 Q5 31 10 40 M50 22 Q55 31 50 40"/>
  </g>
  <!-- hanging loop -->
  <path d="M26 9 Q26 3 30 3 Q34 3 34 9" fill="none" stroke="#14101a" stroke-width="3.2"/>
  <path d="M26 9 Q26 3 30 3 Q34 3 34 9" fill="none" stroke="#5c6370" stroke-width="1.6"/>
  <!-- tassel cord -->
  <path d="M30 3 Q38 1 42 5" fill="none" stroke="#5b3474" stroke-width="1.6" stroke-linecap="round"/>
  <!-- bell body -->
  <path d="M22 11 Q30 8 38 11 Q41 14 41.5 24 Q42 36 47 41 Q48 44 44 45 L16 45 Q12 44 13 41 Q18 36 18.5 24 Q19 14 22 11 Z" fill="url(#soul_bell-body)" stroke="#14101a" stroke-width="2" stroke-linejoin="round" transform="translate(0 2)"/>
  <!-- rim band -->
  <path d="M13.5 43 Q30 49 46.5 43 L46 46 Q30 52 14 46 Z" fill="#2a1838" stroke="#14101a" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M15 44.4 Q30 49.5 45 44.4" fill="none" stroke="#9a6ac8" stroke-width="0.8" opacity="0.8"/>
  <path d="M20 17 Q30 14.5 40 17" fill="none" stroke="#9aa88a" stroke-width="0.9" opacity="0.7"/>
  <!-- skull relief -->
  <path d="M24 28 Q24 20 30 20 Q36 20 36 28 Q36 31.5 33.5 32.5 L33.2 35 L26.8 35 L26.5 32.5 Q24 31.5 24 28 Z" fill="#9aa88a" stroke="#14101a" stroke-width="1.2" stroke-linejoin="round"/>
  <ellipse cx="27.6" cy="27.5" rx="1.9" ry="2.1" fill="#14101a"/>
  <ellipse cx="32.4" cy="27.5" rx="1.9" ry="2.1" fill="#14101a"/>
  <circle cx="27.6" cy="27.5" r="0.8" fill="#cfa8ff"/>
  <circle cx="32.4" cy="27.5" r="0.8" fill="#cfa8ff"/>
  <path d="M30 29.6 l-0.9 1.6 h1.8 Z" fill="#14101a"/>
  <path d="M28.2 33 v2 M30 33 v2 M31.8 33 v2" stroke="#14101a" stroke-width="0.7"/>
  <!-- side scroll ornaments -->
  <path d="M21 36 Q19 32 22 30 M39 36 Q41 32 38 30" fill="none" stroke="#9aa88a" stroke-width="0.9" stroke-linecap="round" opacity="0.7"/>
  <!-- highlight -->
  <path d="M22.5 16 Q20.5 26 19.5 38" fill="none" stroke="#cfd6de" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
  <!-- clapper -->
  <ellipse cx="30" cy="51" rx="3" ry="2.6" fill="#3a3f4a" stroke="#14101a" stroke-width="1.2"/>
  <!-- purple tassel -->
  <path d="M42 5 Q47.5 8 48 14" fill="none" stroke="#5b3474" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="48" cy="15.5" r="2.4" fill="#9a6ac8" stroke="#14101a" stroke-width="1"/>
  <path d="M46.2 17.5 Q44.5 25 45.5 32 L51 32 Q52 25 49.8 17.5 Z" fill="url(#soul_bell-tassel)" stroke="#2a1838" stroke-width="1" stroke-linejoin="round"/>
  <path d="M47.4 20 L47 31 M49 20 L49.4 31" stroke="#cfa8ff" stroke-width="0.6" opacity="0.8"/>
  <path d="M45.8 19.5 h4.4" stroke="#d9a441" stroke-width="1.4"/>
</svg>
