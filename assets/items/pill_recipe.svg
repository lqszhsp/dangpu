<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="pill_recipe-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe2c4"/>
      <stop offset="0.6" stop-color="#e2cfa2"/>
      <stop offset="1" stop-color="#b89a62"/>
    </linearGradient>
    <linearGradient id="pill_recipe-fold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8c49a"/>
      <stop offset="1" stop-color="#a88a52"/>
    </linearGradient>
    <linearGradient id="pill_recipe-curl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6ecd2"/>
      <stop offset="0.6" stop-color="#d8c49a"/>
      <stop offset="1" stop-color="#a88a52"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <path d="M6 10 L54 7.5 L57 46.5 L47 57.5 L9 60 Z" fill="#14101a" opacity="0.35" transform="translate(1.5 1.5)"/>
  <!-- back panel (folded) -->
  <path d="M5.5 9 L31 7.8 L33 58 L8.5 59 Z" fill="url(#pill_recipe-fold)" stroke="#1f1626" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- front panel -->
  <path d="M31 7.8 L55 6.5 L58.5 46 L48 57.5 L33 58 Z" fill="url(#pill_recipe-paper)" stroke="#1f1626" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- fold crease -->
  <path d="M31 7.8 L33 58" stroke="#8a5a1c" stroke-width="1.2" opacity="0.8"/>
  <path d="M32.3 8 L34.2 57.8" stroke="#f6ecd2" stroke-width="0.8" opacity="0.8"/>
  <!-- stains -->
  <ellipse cx="18" cy="44" rx="5" ry="3.5" fill="#8a5a1c" opacity="0.15"/>
  <ellipse cx="46" cy="18" rx="4" ry="3" fill="#8a5a1c" opacity="0.12"/>
  <!-- brush strokes as script: columns right to left -->
  <g fill="none" stroke="#1f1626" stroke-linecap="round" stroke-linejoin="round">
    <path d="M51 11.5 l-2.5 0.5 M50 11.5 l0.3 5 M48 15 l3.5 -0.4 M49.8 18 l0.2 4 l-1.5 1.5 M48.6 25.5 l3 -0.3 M50 25.5 l0.3 5" stroke-width="1.4"/>
    <path d="M44 11.5 l2.6 -0.2 M45.3 12 l0.3 4 M43.4 17.5 l3.4 -0.2 M44.5 19.5 l1.4 1.2 M44.2 23 l2.8 -0.2 l0.2 3.8 M44.4 28.5 l2.8 -0.2" stroke-width="1.2"/>
    <path d="M38.6 12 l2.4 -0.2 M39.7 12.5 l0.2 6 M38.4 21 l2.8 -0.3 M39.5 23 l0.3 4.5 l1.4 -1 M38.7 31 l2.6 -0.2 M40 31.5 l0.3 4" stroke-width="1.2"/>
    <path d="M24.5 12.5 l2.6 -0.1 M25.8 13 l0.2 5 M24.2 20.5 l3 -0.2 M25.2 22.5 l1.6 1.4 M24.6 27 l2.8 -0.1 l0.1 4" stroke-width="1.2"/>
    <path d="M18 13 l2.6 -0.1 M19.2 13.5 l0.2 4.5 M18 20.5 l2.6 0 M18.7 22.5 l0.2 3.5 l1.6 -0.6 M18.4 29.5 l2.6 0 M19.6 30 l0.2 4.5" stroke-width="1.2"/>
    <path d="M12 14 l2.6 -0.1 M13.2 14.5 l0.2 4 M12.4 21 l2.6 0 M13 24 l1.6 1.3" stroke-width="1.1" opacity="0.85"/>
  </g>
  <!-- small pill diagram -->
  <circle cx="45" cy="40" r="3.6" fill="none" stroke="#1f1626" stroke-width="1.1"/>
  <circle cx="45" cy="40" r="1.2" fill="#8e1b2b"/>
  <!-- seal -->
  <rect x="13" y="45" width="10" height="10" rx="1.2" fill="#c43a3a" stroke="#5e0f1c" stroke-width="1" transform="rotate(-6 18 50)"/>
  <g fill="none" stroke="#efe2c4" stroke-width="1" stroke-linecap="round" transform="rotate(-6 18 50)">
    <path d="M15 47.5 h6 M18 47.5 v5.5 M15.2 50.2 h5.6 M15 53 h6"/>
  </g>
  <!-- curled corner -->
  <path d="M58.5 46 L48 57.5 L52.5 50 Z" fill="#14101a" opacity="0.3" transform="translate(-1.5 -1)"/>
  <path d="M58.5 46 Q53.5 46.8 50.6 49.4 Q49 52.5 48 57.5 Z" fill="url(#pill_recipe-curl)" stroke="#1f1626" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M56.5 47 Q53 47.8 51.4 50" fill="none" stroke="#fff8e6" stroke-width="0.8" opacity="0.9"/>
  <!-- edge highlight -->
  <path d="M33 9.5 L54 8.3" stroke="#fff8e6" stroke-width="1" opacity="0.8"/>
</svg>
