<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="blood_essence-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfefff" stop-opacity="0.25"/>
      <stop offset="0.3" stop-color="#f4fbff" stop-opacity="0.06"/>
      <stop offset="0.7" stop-color="#8fd3ff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#4a8fb8" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="blood_essence-blood" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#e0524a"/>
      <stop offset="0.35" stop-color="#c43a3a"/>
      <stop offset="0.75" stop-color="#8e1b2b"/>
      <stop offset="1" stop-color="#3a0a12"/>
    </radialGradient>
    <linearGradient id="blood_essence-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a1c"/>
      <stop offset="0.4" stop-color="#f2d27a"/>
      <stop offset="0.7" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
    <radialGradient id="blood_essence-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c43a3a" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#8e1b2b" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#5e0f1c" stop-opacity="0"/>
    </radialGradient>
    <filter id="blood_essence-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <circle cx="32" cy="38" r="26" fill="url(#blood_essence-halo)"/>
  <!-- shadow -->
  <ellipse cx="32" cy="58.5" rx="15" ry="3" fill="#14101a" opacity="0.55"/>
  <!-- inner glow -->
  <ellipse cx="32" cy="45" rx="15" ry="13" fill="#c43a3a" opacity="0.8" filter="url(#blood_essence-blur)"/>
  <!-- blood fill (faceted, lower part) -->
  <path d="M19.5 37 Q32 39.5 44.5 37 L46 47 L39 56.5 L25 56.5 L18 47 Z" fill="url(#blood_essence-blood)"/>
  <path d="M19.5 37 Q32 39.5 44.5 37 Q32 34.5 19.5 37 Z" fill="#c43a3a"/>
  <path d="M22 37.2 Q32 35.8 42 37" fill="none" stroke="#ffb4a8" stroke-width="0.8" opacity="0.8"/>
  <ellipse cx="31" cy="46" rx="5" ry="4" fill="#ff8a7a" opacity="0.5" filter="url(#blood_essence-blur)"/>
  <!-- facets inside blood -->
  <path d="M25 56.5 L28 46 L32 39 L36 46 L39 56.5 M18 47 L28 46 M46 47 L36 46" fill="none" stroke="#5e0f1c" stroke-width="0.9" opacity="0.6"/>
  <!-- glass vial (hexagonal crystal) -->
  <path d="M25.5 18 L38.5 18 L39 23 L45 30 L46 47 L39 56.5 L25 56.5 L18 47 L19 30 L25 23 Z" fill="url(#blood_essence-glass)" stroke="#14101a" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M25 23 L39 23 M19 30 L45 30 M25 23 L26.5 30 L28 46 M39 23 L37.5 30 L36 46" fill="none" stroke="#8fd3ff" stroke-width="0.7" opacity="0.45"/>
  <!-- highlight -->
  <path d="M21.5 31.5 L21 45.5 L25.5 52" fill="none" stroke="#f4fbff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M27.5 25 L28.5 29" stroke="#f4fbff" stroke-width="1.1" stroke-linecap="round" opacity="0.8"/>
  <path d="M43 32 L43.5 45" stroke="#4a8fb8" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <!-- gold neck band -->
  <path d="M24 15 L40 15 L40.5 20 L23.5 20 Z" fill="url(#blood_essence-gold)" stroke="#14101a" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M26 17.5 h2 M30.5 17.5 h3 M36 17.5 h2" stroke="#8a5a1c" stroke-width="1" stroke-linecap="round"/>
  <!-- stopper -->
  <path d="M26 15 Q25 9.5 27.5 8 L36.5 8 Q39 9.5 38 15 Z" fill="#3d2350" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M28 9.5 Q27.5 12 28 14" fill="none" stroke="#7a5294" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M27 8 Q32 3.5 37 8 Z" fill="#8e1b2b" stroke="#14101a" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="32" cy="6.3" r="1" fill="#e0524a"/>
  <!-- blood seep and beading drop -->
  <path d="M38 12 Q40.5 12.5 40.6 15 L40.6 17.5 Q40.6 19 41.5 19.5" fill="none" stroke="#14101a" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M38 12 Q40.5 12.5 40.6 15 L40.6 17.5 Q40.6 19 41.5 19.5" fill="none" stroke="#c43a3a" stroke-width="1" stroke-linecap="round"/>
  <path d="M42 19.5 Q45.5 24 45.5 26 Q45.5 28.6 42.8 28.6 Q40 28.6 40 26 Q40 24 42 19.5 Z" fill="url(#blood_essence-blood)" stroke="#14101a" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="41.6" cy="25.4" r="0.8" fill="#ffd6cc"/>
  <!-- blood motes -->
  <g fill="#e0524a">
    <circle cx="13" cy="28" r="1"/><circle cx="51" cy="40" r="0.9"/><circle cx="16" cy="18" r="0.7"/>
  </g>
</svg>
