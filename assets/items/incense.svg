<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="incense-bronze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3f4a"/>
      <stop offset="0.35" stop-color="#9aa88a"/>
      <stop offset="0.6" stop-color="#6b7d5a"/>
      <stop offset="1" stop-color="#3a3f4a"/>
    </linearGradient>
    <linearGradient id="incense-smoke" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f4fbff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7fd6b5" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="incense-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
  </defs>
  <!-- smoke -->
  <path d="M32 21 Q27 16 32 11.6 Q37 7.6 33 4 M32 21 Q40 18 41 12 Q41.4 7.6 37.6 7.6" fill="none" stroke="#7fd6b5" stroke-width="4" stroke-linecap="round" opacity="0.45" filter="url(#incense-blur)"/>
  <path d="M32 21 Q27 16 32 11.6 Q37 7.6 33 4" fill="none" stroke="url(#incense-smoke)" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M32 17 Q40 17 41 12 Q41.4 7.6 37.6 7.6 Q35.6 8.4 36.6 10.4" fill="none" stroke="#cfefff" stroke-width="1.1" stroke-linecap="round" opacity="0.75"/>
  <path d="M31.6 15 Q24 15 22.6 10 Q22 6 25.4 5.8 Q27.4 6.6 26.4 8.6" fill="none" stroke="#cfefff" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <!-- incense stick -->
  <path d="M32 22 L32 41" stroke="#14101a" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M32 24 L32 41" stroke="#c43a3a" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M32 22.4 L32 24.4" stroke="#5c6370" stroke-width="1.3" stroke-linecap="round"/>
  <!-- ember -->
  <circle cx="32" cy="22" r="2.8" fill="#e8902f" opacity="0.85" filter="url(#incense-blur)"/>
  <circle cx="32" cy="22.2" r="1.2" fill="#ffc56b"/>
  <circle cx="32" cy="22" r="0.5" fill="#fff3c8"/>
  <!-- censer shadow -->
  <ellipse cx="32" cy="59.4" rx="19" ry="3" fill="#14101a" opacity="0.45"/>
  <!-- legs -->
  <g fill="url(#incense-bronze)" stroke="#14101a" stroke-width="1.4" stroke-linejoin="round">
    <path d="M19 52 L16.4 59.6 L20.6 59.6 L23 53.6 Z"/>
    <path d="M45 52 L47.6 59.6 L43.4 59.6 L41 53.6 Z"/>
  </g>
  <!-- bowl -->
  <path d="M14 39 Q13 55 32 56 Q51 55 50 39 Z" fill="url(#incense-bronze)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- ears -->
  <g stroke="#14101a" stroke-width="1.4" stroke-linejoin="round" fill="url(#incense-bronze)">
    <path d="M17 39 L15.6 30.6 L19.6 30.6 L20.6 39 Z"/>
    <path d="M47 39 L48.4 30.6 L44.4 30.6 L43.4 39 Z"/>
  </g>
  <path d="M16.4 32 L18.6 32 M45.4 32 L47.6 32" stroke="#e9dfcc" stroke-width="0.7" opacity="0.6"/>
  <!-- rim -->
  <ellipse cx="32" cy="39" rx="19" ry="4" fill="#6b7d5a" stroke="#14101a" stroke-width="1.6"/>
  <ellipse cx="32" cy="39.4" rx="15.6" ry="2.6" fill="#3a3f4a"/>
  <ellipse cx="32" cy="40" rx="13.6" ry="1.7" fill="#d8c49a" opacity="0.6"/>
  <g fill="#efe2c4" opacity="0.8"><circle cx="27" cy="40" r="0.6"/><circle cx="37" cy="40.2" r="0.6"/></g>
  <!-- decor band -->
  <path d="M15 46 Q32 50.6 49 46" fill="none" stroke="#14101a" stroke-width="0.8" opacity="0.6"/>
  <path d="M21 47.6 q2.2 -2.2 4.4 0 q2.2 -2.2 4.4 0 M34.2 47.6 q2.2 -2.2 4.4 0 q2.2 -2.2 4.4 0" fill="none" stroke="#d9a441" stroke-width="0.9" stroke-linecap="round" opacity="0.9"/>
  <circle cx="32" cy="49.4" r="1.6" fill="#d9a441" stroke="#14101a" stroke-width="0.7"/>
  <path d="M17 43 Q18.6 50 25 53.4" fill="none" stroke="#e9dfcc" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
  <g fill="#1f5c4c" opacity="0.7"><circle cx="44" cy="50" r="1"/><circle cx="21" cy="52" r="0.8"/></g>
  <!-- motes -->
  <g fill="#cfefff" opacity="0.8"><circle cx="48" cy="18" r="0.8"/><circle cx="16" cy="20" r="0.7"/><circle cx="52" cy="28" r="0.6"/></g>
</svg>
