<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ic_secret-cloak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b3474"/>
      <stop offset="0.5" stop-color="#3d2350"/>
      <stop offset="1" stop-color="#1f1626"/>
    </linearGradient>
    <radialGradient id="ic_secret-shade" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#2a1838"/>
      <stop offset="1" stop-color="#14101a"/>
    </radialGradient>
    <radialGradient id="ic_secret-iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2d27a"/>
      <stop offset="0.5" stop-color="#ffc56b"/>
      <stop offset="1" stop-color="#e8902f"/>
    </radialGradient>
    <radialGradient id="ic_secret-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc56b" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#e8902f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- hood + cloak -->
  <path d="M32 3 Q46 4 52 18 Q56 28 55 40 Q58 50 61 60 L3 60 Q6 50 9 40 Q8 28 12 18 Q18 4 32 3 Z" fill="url(#ic_secret-cloak)" stroke="#14101a" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- hood opening -->
  <path d="M32 13 Q44 14 46 28 Q47 40 42 47 Q36 52 32 52 Q28 52 22 47 Q17 40 18 28 Q20 14 32 13 Z" fill="url(#ic_secret-shade)" stroke="#14101a" stroke-width="2.2"/>
  <!-- hood rim highlight -->
  <path d="M19.5 26 Q22 15 32 14.5" fill="none" stroke="#8e1b2b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M14 22 Q19 8 32 6" fill="none" stroke="#5b3474" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <!-- cloak folds -->
  <path d="M14 42 Q12 52 10 59 M50 42 Q52 52 54 59 M32 52 L32 59" fill="none" stroke="#14101a" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <!-- clasp -->
  <circle cx="32" cy="55" r="3" fill="#c43a3a" stroke="#14101a" stroke-width="1.4"/>
  <!-- the eye (half-shadowed) -->
  <ellipse cx="32" cy="33" rx="14" ry="9" fill="url(#ic_secret-glow)"/>
  <path d="M21 33 Q32 23 43 33 Q32 41 21 33 Z" fill="#efe2c4" stroke="#14101a" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="32" cy="33" r="5" fill="url(#ic_secret-iris)" stroke="#14101a" stroke-width="1.4"/>
  <ellipse cx="32" cy="33" rx="1.4" ry="3.8" fill="#14101a"/>
  <circle cx="30.3" cy="31.2" r="1.1" fill="#f4fbff"/>
  <!-- shadow of brim over upper eye -->
  <path d="M18.4 27 Q19.5 14.5 32 13.5 Q44.5 14.5 45.6 27 Q32 33 18.4 27 Z" fill="#14101a" opacity="0.6"/>
  <path d="M20.5 28.5 Q32 32 43.5 28.5" fill="none" stroke="#14101a" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
</svg>
