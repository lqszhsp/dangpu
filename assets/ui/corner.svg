<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="corner-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d27a"/>
      <stop offset="0.5" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <!-- outline pass -->
    <g stroke="#14101a" stroke-width="5.4">
      <path d="M4 62 L4 4 L62 4"/>
      <path d="M10 62 L10 10 L62 10"/>
      <path d="M16 40 L16 16 L40 16"/>
      <path d="M22 30 L22 22 L30 22 L30 28 L26 28"/>
    </g>
    <!-- gold pass -->
    <g stroke="url(#corner-gold)" stroke-width="2.8">
      <path d="M4 62 L4 4 L62 4"/>
      <path d="M10 62 L10 10 L62 10"/>
      <path d="M16 40 L16 16 L40 16"/>
      <path d="M22 30 L22 22 L30 22 L30 28 L26 28"/>
    </g>
  </g>
  <!-- cloud curls at arm ends -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 16 Q47 16 47 21 Q47 25 43 25 Q40 25 40.6 22" stroke="#14101a" stroke-width="5"/>
    <path d="M16 40 Q16 47 21 47 Q25 47 25 43 Q25 40 22 40.6" stroke="#14101a" stroke-width="5"/>
    <path d="M40 16 Q47 16 47 21 Q47 25 43 25 Q40 25 40.6 22" stroke="url(#corner-gold)" stroke-width="2.6"/>
    <path d="M16 40 Q16 47 21 47 Q25 47 25 43 Q25 40 22 40.6" stroke="url(#corner-gold)" stroke-width="2.6"/>
  </g>
  <!-- corner jewel -->
  <path d="M4 0.6 L7.4 4 L4 7.4 L0.6 4 Z" fill="#c43a3a" stroke="#14101a" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- highlights -->
  <path d="M5 58 L5 5 L58 5" fill="none" stroke="#f4fbff" stroke-width="0.8" opacity="0.5"/>
</svg>
