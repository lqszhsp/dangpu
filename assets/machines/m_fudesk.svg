<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="m_fudesk-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e0f1c"/>
      <stop offset="0.5" stop-color="#8e1b2b"/>
      <stop offset="1" stop-color="#c43a3a"/>
    </linearGradient>
    <linearGradient id="m_fudesk-lac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e0f1c"/>
      <stop offset="0.3" stop-color="#c43a3a"/>
      <stop offset="0.6" stop-color="#8e1b2b"/>
      <stop offset="1" stop-color="#5e0f1c"/>
    </linearGradient>
    <linearGradient id="m_fudesk-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d27a"/>
      <stop offset="1" stop-color="#d9a441"/>
    </linearGradient>
    <radialGradient id="m_fudesk-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2d27a" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#d9a441" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8a5a1c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m_fudesk-lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc56b" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#e8902f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m_fudesk-bronze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3f4a"/>
      <stop offset="0.45" stop-color="#9aa88a"/>
      <stop offset="1" stop-color="#3a3f4a"/>
    </linearGradient>
    <filter id="m_fudesk-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="76" cy="140" rx="66" ry="8.5" fill="#14101a" opacity="0.5"/>
  <!-- back legs -->
  <g stroke="#14101a" stroke-width="2" stroke-linejoin="round">
    <path d="M30 96 L36 96 L36 128 L30 128 Z" fill="#5e0f1c"/>
    <path d="M112 96 L118 96 L118 128 L112 128 Z" fill="#5e0f1c"/>
  </g>
  <!-- table top surface -->
  <path d="M28 70 L120 70 L134 96 L12 96 Z" fill="url(#m_fudesk-top)" stroke="#14101a" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- front edge -->
  <path d="M12 96 L134 96 L134 104 L12 104 Z" fill="url(#m_fudesk-lac)" stroke="#14101a" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M14 98 L132 98" stroke="#e0524a" stroke-width="1.1" opacity="0.8"/>
  <!-- apron with cloud cut -->
  <path d="M24 104 L122 104 L122 110 Q110 110 104 114 Q96 110 88 113 Q80 110 73 113 Q66 110 58 113 Q50 110 42 114 Q36 110 24 110 Z" fill="#8e1b2b" stroke="#14101a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M40 106.5 Q73 108 106 106.5" fill="none" stroke="#d9a441" stroke-width="1.2"/>
  <!-- front horse-hoof legs -->
  <g stroke="#14101a" stroke-width="2.2" stroke-linejoin="round">
    <path d="M14 104 L26 104 L25 128 Q26 134 30 136 L20 137 Q15 136 15 130 Z" fill="url(#m_fudesk-lac)"/>
    <path d="M132 104 L120 104 L121 128 Q120 134 116 136 L126 137 Q131 136 131 130 Z" fill="url(#m_fudesk-lac)"/>
  </g>
  <path d="M17 107 L17.5 128" stroke="#e0524a" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <g fill="#d9a441" stroke="#14101a" stroke-width="0.9">
    <path d="M14 104 L26 104 L25.6 108 L14.4 108 Z"/>
    <path d="M132 104 L120 104 L120.4 108 L131.6 108 Z"/>
  </g>
  <!-- top highlight -->
  <path d="M30 72 L118 72" stroke="#e0524a" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- stacked blank talismans (left) -->
  <g stroke="#14101a" stroke-width="1.4" stroke-linejoin="round">
    <path d="M24 88 L36 74 L50 76 L40 91 Z" fill="#d9a441"/>
    <path d="M27 89 L38 75 L52 78 L43 92 Z" fill="url(#m_fudesk-paper)"/>
  </g>
  <path d="M38 78 L48 79.6 M36 81 L45 82.4" stroke="#c43a3a" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <!-- glowing finished talisman -->
  <ellipse cx="78" cy="78" rx="30" ry="20" fill="url(#m_fudesk-glow)"/>
  <path d="M60 92 L66 70 L94 70 L98 92 Z" fill="#f2d27a" filter="url(#m_fudesk-blur)" opacity="0.9"/>
  <path d="M60 92 L66 70 L94 70 L98 92 Z" fill="url(#m_fudesk-paper)" stroke="#8a5a1c" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M63 89.5 L68 72.5 L92 72.5 L95.5 89.5 Z" fill="none" stroke="#c43a3a" stroke-width="1"/>
  <!-- rune strokes -->
  <g fill="none" stroke="#c43a3a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M73 75 L87 75 M80 75 L80 80 M74 80 L86 80 L78 85 L88 87"/>
    <path d="M72 88 Q76 84 79 88 Q82 92 85 88"/>
    <circle cx="80" cy="83" r="1.4"/>
  </g>
  <!-- golden light rays from talisman -->
  <g stroke="#f2d27a" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
    <path d="M80 64 L80 52 M70 65 L65 55 M90 65 L95 55 M62 70 L54 64 M98 70 L106 64"/>
  </g>
  <g fill="#f4fbff">
    <path d="M80 44 L81.3 48.7 L86 50 L81.3 51.3 L80 56 L78.7 51.3 L74 50 L78.7 48.7 Z"/>
    <circle cx="62" cy="56" r="1"/><circle cx="99" cy="54" r="1.1"/>
  </g>
  <!-- paperweight bar on talisman -->
  <path d="M58 92.5 L98 92.5 L99 95.5 L57 95.5 Z" fill="url(#m_fudesk-bronze)" stroke="#14101a" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M72 92.5 Q78 89 84 92.5 Z" fill="#6b7d5a" stroke="#14101a" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- inkstone with cinnabar -->
  <path d="M100 76 L118 76 L124 90 L104 90 Z" fill="#3a3f4a" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M104 90 L124 90 L124 93 L104 93 Z" fill="#14101a"/>
  <path d="M103.5 79 L116 79 L119 84 L106 84 Z" fill="#c43a3a" stroke="#14101a" stroke-width="1"/>
  <path d="M106 80.4 L113 80.4" stroke="#e0524a" stroke-width="1" stroke-linecap="round"/>
  <path d="M106 86 L120 86 L121.4 88.4 L107 88.4 Z" fill="#14101a" opacity="0.6"/>
  <!-- brush (resting across inkstone towards talisman) -->
  <path d="M128 60 L100 84" stroke="#14101a" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M128 60 L100 84" stroke="#8a5a1c" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M126 62 L119 68" stroke="#d9a441" stroke-width="1" stroke-linecap="round"/>
  <path d="M101.5 82.4 L96.6 86 Q92 90 90 92 Q93.6 91.6 98 88.8 L103 85.4 Z" fill="#c43a3a" stroke="#14101a" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M100.6 83 L103.2 85.6" stroke="#efe2c4" stroke-width="2" stroke-linecap="round"/>
  <circle cx="129" cy="59" r="1.6" fill="#d9a441" stroke="#14101a" stroke-width="1"/>
  <!-- cinnabar drip -->
  <circle cx="92" cy="94.4" r="1.3" fill="#c43a3a"/>
  <g transform="translate(-3 0)">
  <!-- oil lamp on stand beside desk -->
  <ellipse cx="144" cy="64" rx="14" ry="14" fill="url(#m_fudesk-lamp)"/>
  <ellipse cx="144" cy="140" rx="10" ry="2.6" fill="#14101a" opacity="0.6"/>
  <g stroke="#14101a" stroke-linejoin="round">
    <path d="M138 140 L150 140 L148 134 L140 134 Z" fill="url(#m_fudesk-bronze)" stroke-width="1.8"/>
    <path d="M142.6 134 L142.6 78 L145.4 78 L145.4 134 Z" fill="url(#m_fudesk-bronze)" stroke-width="1.6"/>
    <path d="M140 104 Q144 101 148 104 Q144 107 140 104 Z" fill="#6b7d5a" stroke-width="1.2"/>
    <path d="M135 72 Q144 70 153 72 Q151 79 144 79 Q137 79 135 72 Z" fill="url(#m_fudesk-bronze)" stroke-width="1.8"/>
  </g>
  <ellipse cx="144" cy="72" rx="8.6" ry="1.8" fill="#14101a"/>
  <path d="M144 72 Q139 66 143 60 Q144 56 144 54 Q148 60 147 66 Q146.5 70 144 72 Z" fill="#e8902f" stroke="#8e1b2b" stroke-width="1" stroke-linejoin="round"/>
  <path d="M144 71 Q142 67 144 62 Q146 66 144 71 Z" fill="#f4fbff"/>
  </g>
</svg>
