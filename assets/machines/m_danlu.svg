<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="m_danlu-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14101a"/>
      <stop offset="0.2" stop-color="#3d2350"/>
      <stop offset="0.45" stop-color="#5b3474"/>
      <stop offset="0.6" stop-color="#8a5a1c"/>
      <stop offset="0.72" stop-color="#5b3474"/>
      <stop offset="1" stop-color="#14101a"/>
    </linearGradient>
    <linearGradient id="m_danlu-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f1626"/>
      <stop offset="0.35" stop-color="#8a5a1c"/>
      <stop offset="0.55" stop-color="#f2d27a"/>
      <stop offset="0.75" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#1f1626"/>
    </linearGradient>
    <radialGradient id="m_danlu-fire" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#f2d27a"/>
      <stop offset="0.4" stop-color="#e8902f"/>
      <stop offset="0.75" stop-color="#c43a3a"/>
      <stop offset="1" stop-color="#5e0f1c"/>
    </radialGradient>
    <radialGradient id="m_danlu-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8902f" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c43a3a" stop-opacity="0"/>
    </radialGradient>
    <filter id="m_danlu-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="80" cy="145" rx="54" ry="8" fill="#14101a" opacity="0.5"/>
  <ellipse cx="80" cy="140" rx="24" ry="4" fill="#e8902f" opacity="0.4" filter="url(#m_danlu-blur)"/>
  <!-- green smoke -->
  <g fill="none" stroke-linecap="round" filter="url(#m_danlu-blur)">
    <path d="M78 34 Q66 24 76 16 Q88 8 78 2" stroke="#3fae8f" stroke-width="8" opacity="0.6"/>
    <path d="M86 34 Q98 26 90 18 Q82 10 94 4" stroke="#1f5c4c" stroke-width="7" opacity="0.7"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M78 34 Q68 25 77 17 Q86 10 79 4" stroke="#7fd6b5" stroke-width="2" opacity="0.85"/>
    <path d="M86 32 Q96 25 89.5 18 Q84 12 92 6" stroke="#3fae8f" stroke-width="1.6" opacity="0.85"/>
    <path d="M70 28 Q62 24 64 16" stroke="#7fd6b5" stroke-width="1.1" opacity="0.6"/>
  </g>
  <!-- legs -->
  <g stroke="#14101a" stroke-width="2.2" stroke-linejoin="round">
    <path d="M46 116 Q40 128 34 140 Q42 144 50 140 Q52 130 58 120 Z" fill="#3d2350"/>
    <path d="M114 116 Q120 128 126 140 Q118 144 110 140 Q108 130 102 120 Z" fill="#3d2350"/>
    <path d="M72 124 Q72 134 70 142 Q80 146 90 142 Q88 134 88 124 Z" fill="#5b3474"/>
  </g>
  <path d="M36 139 Q42 141 48 139 M72 141 Q80 143 88 141" stroke="#d9a441" stroke-width="1.2" fill="none"/>
  <!-- ears (handles) -->
  <g stroke="#14101a" stroke-width="2.2" stroke-linejoin="round">
    <path d="M38 56 L34 36 Q34 32 38 32 L46 32 L48 40 L42 40 L44 56 Z" fill="url(#m_danlu-gold)"/>
    <path d="M122 56 L126 36 Q126 32 122 32 L114 32 L112 40 L118 40 L116 56 Z" fill="url(#m_danlu-gold)"/>
  </g>
  <!-- bowl body -->
  <path d="M32 62 Q28 100 50 118 Q80 132 110 118 Q132 100 128 62 Z" fill="url(#m_danlu-body)" stroke="#14101a" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M40 70 Q38 98 54 112" fill="none" stroke="#9aa88a" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
  <!-- fire window (belly glow) -->
  <ellipse cx="80" cy="96" rx="26" ry="18" fill="url(#m_danlu-halo)"/>
  <path d="M64 86 Q80 78 96 86 L96 106 Q80 114 64 106 Z" fill="#14101a" stroke="#14101a" stroke-width="2"/>
  <path d="M66.5 88 Q80 81 93.5 88 L93.5 104.5 Q80 111 66.5 104.5 Z" fill="url(#m_danlu-fire)"/>
  <!-- grill lattice -->
  <g stroke="#1f1626" stroke-width="1.8" stroke-linecap="round">
    <path d="M73 84.4 L73 108.4 M80 82.4 L80 110 M87 84.4 L87 108.4"/>
    <path d="M65 96 Q80 92 95 96"/>
  </g>
  <path d="M64 86 Q80 78 96 86 L96 106 Q80 114 64 106 Z" fill="none" stroke="#d9a441" stroke-width="1.6"/>
  <!-- gold cloud scroll ornaments -->
  <g fill="none" stroke="#d9a441" stroke-width="1.5" stroke-linecap="round">
    <path d="M42 90 Q44 84 50 86 Q54 90 50 93 Q47 94 47 91"/>
    <path d="M118 90 Q116 84 110 86 Q106 90 110 93 Q113 94 113 91"/>
    <path d="M52 110 Q62 116 70 116 M108 110 Q98 116 90 116"/>
  </g>
  <!-- rim band -->
  <path d="M30 58 Q80 70 130 58 L129 68 Q80 80 31 68 Z" fill="url(#m_danlu-gold)" stroke="#14101a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M40 66 Q80 76 120 66" fill="none" stroke="#5e0f1c" stroke-width="1" stroke-dasharray="2 3"/>
  <!-- lid -->
  <ellipse cx="80" cy="58" rx="50" ry="8" fill="#3d2350" stroke="#14101a" stroke-width="2.4"/>
  <path d="M38 56 Q44 40 80 38 Q116 40 122 56 Q80 66 38 56 Z" fill="url(#m_danlu-body)" stroke="#14101a" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M48 50 Q60 43 78 42" fill="none" stroke="#cfefff" stroke-width="1.3" opacity="0.5" stroke-linecap="round"/>
  <!-- vent holes on lid -->
  <g fill="#14101a">
    <ellipse cx="62" cy="50" rx="3" ry="1.6"/><ellipse cx="98" cy="50" rx="3" ry="1.6"/>
  </g>
  <g fill="#e8902f"><ellipse cx="62" cy="50.3" rx="1.8" ry="0.9"/><ellipse cx="98" cy="50.3" rx="1.8" ry="0.9"/></g>
  <!-- lid knob (gourd finial) -->
  <path d="M72 40 Q72 34 80 33 Q88 34 88 40 Z" fill="url(#m_danlu-gold)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="80" cy="28" r="5.5" fill="url(#m_danlu-gold)" stroke="#14101a" stroke-width="1.8"/>
  <circle cx="78.4" cy="26.4" r="1.6" fill="#f2d27a"/>
  <!-- smoke wisps from vents -->
  <g fill="none" stroke="#7fd6b5" stroke-width="1.2" stroke-linecap="round" opacity="0.7">
    <path d="M62 48 Q58 42 62 38"/>
    <path d="M98 48 Q102 42 98 37"/>
  </g>
  <!-- embers -->
  <g fill="#ffc56b"><circle cx="66" cy="132" r="1"/><circle cx="96" cy="134" r="1.1"/><circle cx="84" cy="136" r="0.8"/></g>
</svg>
