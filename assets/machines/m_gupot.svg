<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <radialGradient id="m_gupot-jar" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#5c6370"/>
      <stop offset="0.35" stop-color="#3a3f4a"/>
      <stop offset="0.75" stop-color="#1f1626"/>
      <stop offset="1" stop-color="#14101a"/>
    </radialGradient>
    <linearGradient id="m_gupot-lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c6370"/>
      <stop offset="0.6" stop-color="#3a3f4a"/>
      <stop offset="1" stop-color="#1f1626"/>
    </linearGradient>
    <linearGradient id="m_gupot-leg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14101a"/>
      <stop offset="0.5" stop-color="#5b3474"/>
      <stop offset="1" stop-color="#2a1838"/>
    </linearGradient>
    <radialGradient id="m_gupot-mist" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b3474" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#3d2350" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2a1838" stop-opacity="0"/>
    </radialGradient>
    <filter id="m_gupot-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <!-- poison mist back -->
  <ellipse cx="80" cy="96" rx="72" ry="50" fill="url(#m_gupot-mist)"/>
  <!-- ground shadow -->
  <ellipse cx="80" cy="140" rx="54" ry="8.5" fill="#14101a" opacity="0.6"/>
