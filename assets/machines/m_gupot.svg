  <path d="M62 50 Q64 40 76 38 Q90 38 94 48 Q80 54 62 50 Z" fill="#2a1838" stroke="#14101a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M68 42 Q74 39 80 39.6" fill="none" stroke="#5b3474" stroke-width="1.2" stroke-linecap="round"/>
  <g filter="url(#m_gupot-blur)" fill="#e0524a" opacity="0.9"><ellipse cx="78" cy="45" rx="13" ry="5"/></g>
  <circle cx="69" cy="46" r="3" fill="#e0524a" stroke="#5e0f1c" stroke-width="1"/>
  <circle cx="78.5" cy="44.4" r="3.6" fill="#e0524a" stroke="#5e0f1c" stroke-width="1"/>
  <circle cx="87.6" cy="46.2" r="2.6" fill="#e0524a" stroke="#5e0f1c" stroke-width="1"/>
  <g fill="#f2d27a"><circle cx="68.2" cy="45.2" r="1"/><circle cx="77.6" cy="43.4" r="1.2"/><circle cx="87" cy="45.4" r="0.8"/></g>
  <!-- mandibles -->
  <path d="M70 50 Q68 56 72 58 M86 50 Q88 56 84 58" fill="none" stroke="#14101a" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M70 50 Q68 56 72 58 M86 50 Q88 56 84 58" fill="none" stroke="#8e1b2b" stroke-width="1" stroke-linecap="round"/>
  <!-- tilted lid, half open on right -->
  <g transform="translate(18 -4) rotate(-30 108 46)">
    <ellipse cx="96" cy="44" rx="27" ry="6.4" fill="#1f1626" stroke="#14101a" stroke-width="2.2"/>
    <path d="M70 44 Q72 30 96 28 Q120 30 122 44 Q96 52 70 44 Z" fill="url(#m_gupot-lid)" stroke="#14101a" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M78 38 Q86 32 98 31.6" fill="none" stroke="#9aa88a" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
    <path d="M90 28.6 Q90 22 96 21 Q102 22 102 28.6 Z" fill="#3a3f4a" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M76 42 Q96 46 116 42" fill="none" stroke="#8e1b2b" stroke-width="1.4"/>
  </g>
  <!-- front mist wisps -->
  <g filter="url(#m_gupot-blur)" opacity="0.7">
    <ellipse cx="40" cy="134" rx="22" ry="6" fill="#5b3474"/>
    <ellipse cx="124" cy="132" rx="20" ry="6" fill="#5b3474"/>
    <ellipse cx="62" cy="30" rx="16" ry="6" fill="#3d2350"/>
  </g>
  <g fill="none" stroke="#5b3474" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
    <path d="M22 118 Q16 108 24 100 Q30 94 24 86"/>
    <path d="M138 116 Q146 106 138 98 Q132 92 138 84"/>
  </g>
  <g fill="#3fae8f" opacity="0.8"><circle cx="26" cy="96" r="1.4"/><circle cx="134" cy="92" r="1.2"/><circle cx="120" cy="24" r="1.1"/></g>
</svg>
