  <path d="M56 54 Q30 66 30 96 Q30 126 52 136 Q80 144 108 136 Q130 126 130 96 Q130 66 104 54 Z" fill="url(#m_gupot-jar)" stroke="#14101a" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M42 80 Q36 96 42 116" fill="none" stroke="#9aa88a" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <!-- red rope band with talisman -->
  <path d="M32 84 Q80 98 128 84" fill="none" stroke="#14101a" stroke-width="5"/>
  <path d="M32 84 Q80 98 128 84" fill="none" stroke="#8e1b2b" stroke-width="3"/>
  <path d="M34 85 Q80 98.4 126 85" fill="none" stroke="#e0524a" stroke-width="0.9" stroke-dasharray="2 2"/>
  <!-- paper talisman -->
  <path d="M86 92 L100 90 L103 120 L89 122 Z" fill="#d8c49a" stroke="#14101a" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M92 96 L97 95.4 M94 95.6 L95.6 106 M91 102 L98 101 M92 110 Q95 106 98 109 Q96 114 93 113" fill="none" stroke="#8e1b2b" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M88 118 L101 116.4" stroke="#8e1b2b" stroke-width="1" opacity="0.6"/>
  <!-- glaze drips -->
  <g fill="#3d2350" opacity="0.8">
