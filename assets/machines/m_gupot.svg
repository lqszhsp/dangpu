    <path d="M70 60 Q69 70 72 76 Q74 68 74 60 Z"/>
    <path d="M112 62 Q114 70 110 76 Q108 68 108 62 Z"/>
  </g>
  <!-- neck / mouth -->
  <path d="M54 48 L106 48 L104 58 Q80 64 56 58 Z" fill="#3a3f4a" stroke="#14101a" stroke-width="2.4" stroke-linejoin="round"/>
  <ellipse cx="80" cy="48" rx="28" ry="7" fill="#5c6370" stroke="#14101a" stroke-width="2.4"/>
  <ellipse cx="80" cy="48.6" rx="22" ry="4.6" fill="#14101a"/>
  <ellipse cx="74" cy="49" rx="12" ry="2.6" fill="#5b3474" opacity="0.7"/>
