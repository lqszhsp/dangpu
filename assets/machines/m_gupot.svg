    <path d="M66 48 Q56 38 46 40 Q40 42 36 36" stroke="url(#m_gupot-leg)" stroke-width="2.6"/>
    <path d="M70 46 Q64 30 54 26 Q48 24 46 18" stroke="#14101a" stroke-width="4.6"/>
    <path d="M70 46 Q64 30 54 26 Q48 24 46 18" stroke="#5b3474" stroke-width="2.6"/>
    <path d="M78 45 Q80 30 74 20 Q72 14 76 9" stroke="#14101a" stroke-width="4"/>
    <path d="M78 45 Q80 30 74 20 Q72 14 76 9" stroke="#5b3474" stroke-width="2.2"/>
    <path d="M62 50 Q50 50 44 56 Q40 60 34 58" stroke="#14101a" stroke-width="4"/>
    <path d="M62 50 Q50 50 44 56 Q40 60 34 58" stroke="#5b3474" stroke-width="2.2"/>
  </g>
