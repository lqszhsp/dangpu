<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="m_puppet-wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f1626"/>
      <stop offset="0.4" stop-color="#9a4d12"/>
      <stop offset="0.65" stop-color="#e8902f"/>
      <stop offset="1" stop-color="#1f1626"/>
    </linearGradient>
    <linearGradient id="m_puppet-shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a1c"/>
      <stop offset="0.5" stop-color="#5e0f1c"/>
      <stop offset="1" stop-color="#1f1626"/>
    </linearGradient>
    <radialGradient id="m_puppet-brass" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f2d27a"/>
      <stop offset="0.5" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </radialGradient>
    <radialGradient id="m_puppet-eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fd3ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4a8fb8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m_puppet-lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0524a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8e1b2b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="80" cy="142" rx="66" ry="8.5" fill="#14101a" opacity="0.55"/>
  <!-- lantern glow -->
  <circle cx="136" cy="44" r="22" fill="url(#m_puppet-lamp)"/>
  <!-- puppet ===== -->
  <!-- arms (upper) -->
  <g stroke="#14101a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M56 66 L44 84 L50 87 L60 70 Z" fill="url(#m_puppet-wood)"/>
    <path d="M104 66 L118 80 L113 85 L100 72 Z" fill="url(#m_puppet-wood)"/>
  </g>
  <!-- torso -->
  <path d="M60 58 L100 58 Q104 72 98 92 L62 92 Q56 72 60 58 Z" fill="url(#m_puppet-wood)" stroke="#14101a" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- chest plate with gear -->
  <path d="M68 64 L92 64 L90 82 L70 82 Z" fill="#5e0f1c" stroke="#14101a" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="80" cy="73" r="6" fill="url(#m_puppet-brass)" stroke="#14101a" stroke-width="1.4"/>
  <g stroke="#8a5a1c" stroke-width="1.6" stroke-linecap="round">
    <path d="M80 65.4 L80 67.6 M80 78.4 L80 80.6 M72.4 73 L74.6 73 M85.4 73 L87.6 73"/>
  </g>
  <circle cx="80" cy="73" r="2" fill="#4a8fb8" stroke="#14101a" stroke-width="1"/>
  <!-- shoulder joints -->
  <circle cx="58" cy="64" r="5" fill="url(#m_puppet-brass)" stroke="#14101a" stroke-width="1.8"/>
  <circle cx="102" cy="64" r="5" fill="url(#m_puppet-brass)" stroke="#14101a" stroke-width="1.8"/>
  <!-- neck -->
  <path d="M75 50 L85 50 L85 58 L75 58 Z" fill="#8a5a1c" stroke="#14101a" stroke-width="1.8"/>
  <path d="M74 54 L86 54" stroke="#d9a441" stroke-width="2"/>
  <!-- head -->
  <path d="M64 30 Q64 18 80 17 Q96 18 96 30 L95 44 Q90 52 80 52 Q70 52 65 44 Z" fill="url(#m_puppet-wood)" stroke="#14101a" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- hat (small black gauze cap) -->
  <path d="M62 26 Q64 12 80 11 Q96 12 98 26 Q80 22 62 26 Z" fill="#1f1626" stroke="#14101a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M58 24 L102 24 L101 28 L59 28 Z" fill="#2a1838" stroke="#14101a" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M68 16 Q74 13 80 13" fill="none" stroke="#5b3474" stroke-width="1.2" stroke-linecap="round"/>
  <!-- face seams -->
  <path d="M66 40 L94 40" stroke="#1f1626" stroke-width="1.2"/>
  <path d="M74 46 L86 46" stroke="#14101a" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M74 46 L74 49 M80 46 L80 49.4 M86 46 L86 49" stroke="#1f1626" stroke-width="1"/>
  <!-- glowing eyes -->
  <circle cx="72.5" cy="34" r="7" fill="url(#m_puppet-eye)"/>
  <circle cx="87.5" cy="34" r="7" fill="url(#m_puppet-eye)"/>
  <circle cx="72.5" cy="34" r="3.2" fill="#14101a"/>
  <circle cx="87.5" cy="34" r="3.2" fill="#14101a"/>
  <circle cx="72.5" cy="34" r="2.2" fill="#8fd3ff"/>
  <circle cx="87.5" cy="34" r="2.2" fill="#8fd3ff"/>
  <circle cx="72.5" cy="34" r="0.9" fill="#f4fbff"/>
  <circle cx="87.5" cy="34" r="0.9" fill="#f4fbff"/>
  <!-- ear bolts -->
  <circle cx="64" cy="36" r="2.2" fill="url(#m_puppet-brass)" stroke="#14101a" stroke-width="1"/>
  <circle cx="96" cy="36" r="2.2" fill="url(#m_puppet-brass)" stroke="#14101a" stroke-width="1"/>
  <!-- elbow joints & forearms resting on counter -->
  <circle cx="47" cy="85" r="4" fill="url(#m_puppet-brass)" stroke="#14101a" stroke-width="1.6"/>
  <circle cx="116" cy="83" r="4" fill="url(#m_puppet-brass)" stroke="#14101a" stroke-width="1.6"/>
  <g stroke="#14101a" stroke-width="2" stroke-linejoin="round">
    <path d="M44 86 L48 98 L54 97 L50 85 Z" fill="url(#m_puppet-wood)"/>
    <path d="M114 86 L106 96 L111 99 L119 87 Z" fill="url(#m_puppet-wood)"/>
  </g>
  <!-- hand holding a small item (right) -->
  <circle cx="108" cy="98" r="3.4" fill="#9a4d12" stroke="#14101a" stroke-width="1.4"/>
  <!-- counter / goods shelf ===== -->
  <!-- counter top -->
  <path d="M14 96 L146 96 L150 104 L10 104 Z" fill="#8a5a1c" stroke="#14101a" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M16 98 L144 98" stroke="#ffc56b" stroke-width="1" opacity="0.5"/>
  <!-- counter body -->
  <path d="M14 104 L146 104 L146 136 L14 136 Z" fill="url(#m_puppet-shelf)" stroke="#14101a" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- shelf cubbies -->
  <g stroke="#14101a" stroke-width="1.8" stroke-linejoin="round">
    <path d="M20 108 L56 108 L56 132 L20 132 Z" fill="#1f1626"/>
    <path d="M62 108 L98 108 L98 132 L62 132 Z" fill="#1f1626"/>
    <path d="M104 108 L140 108 L140 132 L104 132 Z" fill="#1f1626"/>
  </g>
  <!-- goods: pill bottle, jade pendant, scroll -->
  <g stroke="#14101a" stroke-width="1.4" stroke-linejoin="round">
    <path d="M30 130 Q26 124 30 118 L30 114 L36 114 L36 118 Q40 124 36 130 Z" fill="#7fd6b5"/>
    <path d="M29 112 L37 112 L37 115 L29 115 Z" fill="#c43a3a"/>
    <path d="M44 130 Q42 124 46 120 L46 117 L50 117 L50 120 Q54 124 52 130 Z" fill="#e0524a"/>
    <circle cx="80" cy="123" r="6" fill="#3fae8f"/>
    <circle cx="80" cy="123" r="2" fill="#1f1626"/>
    <path d="M80 117 L80 111" fill="none" stroke="#c43a3a" stroke-width="1.4"/>
    <path d="M108 122 L136 122 L136 130 L108 130 Z" fill="#d8c49a"/>
    <ellipse cx="108" cy="126" rx="2" ry="4" fill="#8a5a1c"/>
    <ellipse cx="136" cy="126" rx="2" ry="4" fill="#8a5a1c"/>
    <path d="M118 122 L118 130" stroke="#c43a3a" stroke-width="2"/>
  </g>
  <path d="M74 120 Q76 118 79 118" fill="none" stroke="#cfefff" stroke-width="1" stroke-linecap="round"/>
  <path d="M32 120 L32 127" stroke="#f4fbff" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <!-- price-tag strips hanging off counter -->
  <g stroke="#14101a" stroke-width="1.2">
    <path d="M40 104 L46 104 L46 112 L43 114 L40 112 Z" fill="#efe2c4"/>
    <path d="M114 104 L120 104 L120 112 L117 114 L114 112 Z" fill="#efe2c4"/>
  </g>
  <!-- lantern on pole -->
  <path d="M142 96 L142 30 L128 30" fill="none" stroke="#14101a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M142 96 L142 30 L128 30" fill="none" stroke="#8a5a1c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M130 30 L130 34" stroke="#14101a" stroke-width="1.4"/>
  <path d="M124 36 Q122 44 124 52 L136 52 Q138 44 136 36 Z" fill="#c43a3a" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M123 34 L137 34 L137 37 L123 37 Z M123 51 L137 51 L137 54 L123 54 Z" fill="#1f1626" stroke="#14101a" stroke-width="1"/>
  <path d="M127 40 Q126 44 127 48" fill="none" stroke="#ffc56b" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M130 54 L130 60" stroke="#c43a3a" stroke-width="1.4"/>
</svg>
