<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <radialGradient id="m_array-floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b3474"/>
      <stop offset="0.6" stop-color="#3d2350"/>
      <stop offset="0.92" stop-color="#2a1838"/>
      <stop offset="1" stop-color="#1f1626"/>
    </radialGradient>
    <linearGradient id="m_array-pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b3474" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#5b3474" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#f4fbff" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#5b3474" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5b3474" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="m_array-fade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5b3474" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#5b3474" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#3d2350" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="m_array-gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="0.4" stop-color="#e9dfcc"/>
      <stop offset="1" stop-color="#5b3474"/>
    </linearGradient>
    <filter id="m_array-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>
  <!-- ground disc (shadow) -->
  <ellipse cx="80" cy="118" rx="72" ry="28" fill="#14101a" opacity="0.55"/>
  <!-- array floor -->
  <ellipse cx="80" cy="114" rx="68" ry="26" fill="url(#m_array-floor)" stroke="#14101a" stroke-width="2.4"/>
  <!-- outer glowing ring -->
  <ellipse cx="80" cy="114" rx="62" ry="23" fill="none" stroke="#e9dfcc" stroke-width="4" opacity="0.5" filter="url(#m_array-blur)"/>
  <ellipse cx="80" cy="114" rx="62" ry="23" fill="none" stroke="#e9dfcc" stroke-width="1.8"/>
  <ellipse cx="80" cy="114" rx="56" ry="20.6" fill="none" stroke="#5b3474" stroke-width="1.2"/>
  <!-- rune ticks between rings -->
  <g stroke="#e9dfcc" stroke-width="1.3" stroke-linecap="round" fill="none">
    <path d="M22 112 L26 116 M28 103 L31 107 M42 97 L44 101 M60 93 L61 97 M80 91.6 L80 95.6 M100 93 L99 97 M118 97 L116 101 M132 103 L129 107 M138 112 L134 116"/>
    <path d="M28 124 L31 121 M42 131 L44 127 M60 135 L61 131 M80 136.4 L80 132.4 M100 135 L99 131 M118 131 L116 127 M132 124 L129 121"/>
  </g>
  <!-- inner hexagram (squashed) -->
  <g fill="none" stroke="#e9dfcc" stroke-width="1.6" stroke-linejoin="round">
    <path d="M80 98 L116 122 L44 122 Z"/>
    <path d="M80 130 L44 106 L116 106 Z"/>
  </g>
  <ellipse cx="80" cy="114" rx="22" ry="8" fill="none" stroke="#e0524a" stroke-width="1.4"/>
  <!-- four small spirit stones at cardinal points -->
  <g stroke="#14101a" stroke-width="1.2" stroke-linejoin="round">
    <path d="M18 114 L22 108 L26 114 L22 117 Z" fill="#7fd6b5"/>
    <path d="M134 114 L138 108 L142 114 L138 117 Z" fill="#7fd6b5"/>
    <path d="M76 90 L80 85 L84 90 L80 92.6 Z" fill="#7fd6b5"/>
    <path d="M76 138 L80 132 L84 138 L80 141 Z" fill="#7fd6b5"/>
  </g>
  <!-- light pillar -->
  <path d="M50 114 Q52 60 58 8 L102 8 Q108 60 110 114 Z" fill="url(#m_array-fade)"/>
  <path d="M58 114 Q60 60 66 14 L94 14 Q100 60 102 114 Z" fill="url(#m_array-fade)"/>
  <path d="M64 114 L77 12 L83 12 L96 114 Z" fill="url(#m_array-pillar)" opacity="0.8"/>
  <path d="M75 114 L80 4 L85 114 Z" fill="#f4fbff" opacity="0.55"/>
  <ellipse cx="80" cy="114" rx="22" ry="8" fill="#e9dfcc" opacity="0.6" filter="url(#m_array-blur)"/>
  <!-- rising motes / rings on pillar -->
  <g fill="none" stroke="#e9dfcc" stroke-width="1" opacity="0.7">
    <ellipse cx="80" cy="74" rx="15" ry="4"/>
    <ellipse cx="80" cy="44" rx="12" ry="3"/>
  </g>
  <g fill="#f4fbff">
    <circle cx="70" cy="60" r="1.3"/><circle cx="92" cy="50" r="1.1"/><circle cx="76" cy="28" r="1"/><circle cx="88" cy="84" r="1.2"/><circle cx="54" cy="86" r="1"/><circle cx="108" cy="78" r="1"/>
  </g>
  <!-- central spirit stone -->
  <g stroke="#14101a" stroke-width="1.8" stroke-linejoin="round">
    <path d="M80 92 L90 106 L80 118 L70 106 Z" fill="url(#m_array-gem)"/>
    <path d="M80 92 L84 106 L80 118 L76 106 Z" fill="#f4fbff" opacity="0.5" stroke="none"/>
    <path d="M70 106 L90 106" fill="none" stroke-width="1"/>
  </g>
  <path d="M77 97 L74 104" stroke="#f4fbff" stroke-width="1.4" stroke-linecap="round"/>
  <!-- stone socket -->
  <path d="M70 116 Q80 121 90 116 L92 119 Q80 125 68 119 Z" fill="#3a3f4a" stroke="#14101a" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
