<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="m_furnace-bronze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f1626"/>
      <stop offset="0.18" stop-color="#3a3f4a"/>
      <stop offset="0.42" stop-color="#6b7d5a"/>
      <stop offset="0.58" stop-color="#9aa88a"/>
      <stop offset="0.8" stop-color="#5c6370"/>
      <stop offset="1" stop-color="#1f1626"/>
    </linearGradient>
    <linearGradient id="m_furnace-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f1626"/>
      <stop offset="0.35" stop-color="#8a5a1c"/>
      <stop offset="0.55" stop-color="#d9a441"/>
      <stop offset="0.8" stop-color="#8a5a1c"/>
      <stop offset="1" stop-color="#1f1626"/>
    </linearGradient>
    <radialGradient id="m_furnace-fire" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#f2d27a"/>
      <stop offset="0.3" stop-color="#ffc56b"/>
      <stop offset="0.6" stop-color="#e0524a"/>
      <stop offset="0.85" stop-color="#8e1b2b"/>
      <stop offset="1" stop-color="#5e0f1c"/>
    </radialGradient>
    <radialGradient id="m_furnace-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0524a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8e1b2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m_furnace-flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f2d27a"/>
      <stop offset="0.35" stop-color="#e0524a"/>
      <stop offset="1" stop-color="#8e1b2b"/>
    </linearGradient>
    <filter id="m_furnace-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="80" cy="144" rx="58" ry="8.5" fill="#14101a" opacity="0.5"/>
  <ellipse cx="80" cy="140" rx="34" ry="5" fill="#c43a3a" opacity="0.25" filter="url(#m_furnace-blur)"/>
  <!-- top flame glow -->
  <ellipse cx="80" cy="38" rx="40" ry="30" fill="url(#m_furnace-halo)"/>
  <!-- feet -->
  <g stroke="#14101a" stroke-width="2.2" stroke-linejoin="round">
    <path d="M40 124 Q34 134 30 141 Q38 145 50 142 Q50 133 54 126 Z" fill="#3a3f4a"/>
    <path d="M120 124 Q126 134 130 141 Q122 145 110 142 Q110 133 106 126 Z" fill="#3a3f4a"/>
    <path d="M70 132 Q68 139 66 144 Q80 147 94 144 Q92 139 90 132 Z" fill="#5c6370"/>
  </g>
  <path d="M33 140 Q38 142 46 141 M115 141 Q122 142 127 140 M70 144 Q80 145.5 90 144" fill="none" stroke="#9aa88a" stroke-width="1" opacity="0.6"/>
  <!-- side ring handles -->
  <g fill="none" stroke-linecap="round">
    <circle cx="28" cy="90" r="9" stroke="#14101a" stroke-width="5"/>
    <circle cx="28" cy="90" r="9" stroke="#8a5a1c" stroke-width="2.6"/>
    <circle cx="132" cy="90" r="9" stroke="#14101a" stroke-width="5"/>
    <circle cx="132" cy="90" r="9" stroke="#8a5a1c" stroke-width="2.6"/>
    <path d="M22 86 Q24 82 28 81" stroke="#f2d27a" stroke-width="1"/>
    <path d="M126 86 Q128 82 132 81" stroke="#f2d27a" stroke-width="1"/>
  </g>
  <!-- body -->
  <path d="M38 58 Q30 96 40 128 Q80 140 120 128 Q130 96 122 58 Z" fill="url(#m_furnace-bronze)" stroke="#14101a" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M44 66 Q38 96 45 122" fill="none" stroke="#9aa88a" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>
  <path d="M116 66 Q121 96 115 122" fill="none" stroke="#14101a" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- upper band -->
  <path d="M37.5 64 Q80 74 122.5 64 L123.6 76 Q80 86 36.4 76 Z" fill="url(#m_furnace-band)" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
