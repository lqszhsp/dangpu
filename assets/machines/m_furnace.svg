  <g fill="#d9a441" stroke="#14101a" stroke-width="1">
    <circle cx="45" cy="72" r="2.2"/><circle cx="58" cy="75.2" r="2.2"/><circle cx="71" cy="76.8" r="2.2"/>
    <circle cx="89" cy="76.8" r="2.2"/><circle cx="102" cy="75.2" r="2.2"/><circle cx="115" cy="72" r="2.2"/>
    <circle cx="45" cy="123" r="2.2"/><circle cx="58" cy="126" r="2.2"/><circle cx="71" cy="127.6" r="2.2"/>
    <circle cx="89" cy="127.6" r="2.2"/><circle cx="102" cy="126" r="2.2"/><circle cx="115" cy="123" r="2.2"/>
  </g>
  <g fill="#f2d27a">
    <circle cx="44.4" cy="71.3" r="0.8"/><circle cx="57.4" cy="74.5" r="0.8"/><circle cx="70.4" cy="76.1" r="0.8"/>
    <circle cx="88.4" cy="76.1" r="0.8"/><circle cx="101.4" cy="74.5" r="0.8"/><circle cx="114.4" cy="71.3" r="0.8"/>
  </g>
  <!-- rune marks on sides -->
  <g fill="none" stroke="#e0524a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M44 88 L50 86 L48 94 L54 92 M46 100 Q50 97 53 101 Q50 105 46 103"/>
    <path d="M116 88 L110 86 L112 94 L106 92 M114 100 Q110 97 107 101 Q110 105 114 103"/>
  </g>
  <!-- rim -->
  <ellipse cx="80" cy="58" rx="44" ry="9.5" fill="#5c6370" stroke="#14101a" stroke-width="2.6"/>
  <path d="M38 57 Q80 49 122 57" fill="none" stroke="#9aa88a" stroke-width="1.4" opacity="0.8"/>
  <ellipse cx="80" cy="58" rx="34" ry="6" fill="#14101a"/>
  <ellipse cx="80" cy="59" rx="30" ry="4.6" fill="url(#m_furnace-fire)"/>
  <!-- top flames -->
  <g filter="url(#m_furnace-blur)" opacity="0.8">
    <path d="M56 58 Q50 40 62 30 Q60 42 70 46 Q66 28 80 14 Q78 32 90 40 Q94 30 100 28 Q108 42 104 58 Z" fill="#c43a3a"/>
  </g>
  <path d="M58 59 Q54 44 63 35 Q63 45 71 49 Q68 32 80 19 Q79 35 90 43 Q93 35 98 32 Q104 45 102 59 Z" fill="url(#m_furnace-flame)" stroke="#5e0f1c" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M66 59 Q64 50 70 45 Q71 52 76 54 Q75 42 81 34 Q82 46 88 50 Q92 46 93 44 Q96 52 94 59 Z" fill="#ffc56b"/>
  <path d="M73 59 Q72 53 77 50 Q79 54 82 52 Q84 55 87 54 Q88 57 87 59 Z" fill="#f2d27a"/>
  <!-- sparks -->
  <g fill="#ffc56b">
    <circle cx="52" cy="28" r="1.4"/><circle cx="108" cy="22" r="1.2"/><circle cx="96" cy="14" r="1"/><circle cx="64" cy="18" r="1"/>
  </g>
  <!-- beast face -->
  <ellipse cx="80" cy="104" rx="26" ry="18" fill="url(#m_furnace-halo)"/>
  <path d="M54 84 Q60 78 70 82 Q76 86 80 92 Q84 86 90 82 Q100 78 106 84 Q100 84 94 88 Q86 92 80 100 Q74 92 66 88 Q60 84 54 84 Z" fill="#3a3f4a" stroke="#14101a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M54 84 Q50 78 54 74 Q56 78 60 79 M106 84 Q110 78 106 74 Q104 78 100 79" fill="none" stroke="#14101a" stroke-width="2" stroke-linecap="round"/>
  <path d="M58 82 Q64 80 70 83 M102 82 Q96 80 90 83" fill="none" stroke="#d9a441" stroke-width="1.2" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="67" cy="90" rx="5" ry="3.2" fill="#14101a"/>
  <ellipse cx="93" cy="90" rx="5" ry="3.2" fill="#14101a"/>
  <ellipse cx="67.5" cy="90" rx="3.4" ry="2" fill="#e0524a"/>
  <ellipse cx="92.5" cy="90" rx="3.4" ry="2" fill="#e0524a"/>
  <circle cx="67.5" cy="89.6" r="1" fill="#f2d27a"/>
  <circle cx="92.5" cy="89.6" r="1" fill="#f2d27a"/>
  <!-- nose -->
  <path d="M74 98 Q80 94 86 98 Q84 102 80 101 Q76 102 74 98 Z" fill="#5c6370" stroke="#14101a" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- mouth / furnace port -->
  <path d="M58 106 Q64 102 72 104 Q80 102 88 104 Q96 102 102 106 Q102 120 80 122 Q58 120 58 106 Z" fill="#14101a" stroke="#14101a" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M61 108 Q80 104 99 108 Q98 118 80 119 Q62 118 61 108 Z" fill="url(#m_furnace-fire)"/>
  <!-- fangs -->
  <g fill="#efe2c4" stroke="#14101a" stroke-width="1" stroke-linejoin="round">
    <path d="M64 106.6 L67 113 L70 105.4 Z"/><path d="M96 106.6 L93 113 L90 105.4 Z"/>
    <path d="M74 105 L76 109 L78 104.6 Z"/><path d="M86 105 L84 109 L82 104.6 Z"/>
  </g>
  <!-- fire glow spilling from port -->
  <path d="M64 112 Q70 108 74 112 Q77 106 80 111 Q83 106 86 112 Q90 108 96 112 Q92 118 80 118 Q68 118 64 112 Z" fill="#f2d27a" opacity="0.85"/>
  <g fill="#ffc56b"><circle cx="58" cy="132" r="1.1"/><circle cx="103" cy="134" r="1"/><circle cx="96" cy="140" r="0.9"/></g>
  <g fill="#e0524a" filter="url(#m_furnace-blur)" opacity="0.7">
    <ellipse cx="80" cy="113" rx="16" ry="6"/>
  </g>
</svg>
