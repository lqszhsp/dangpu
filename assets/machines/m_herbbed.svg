<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="m_herbbed-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a4d12"/>
      <stop offset="0.5" stop-color="#8a5a1c"/>
      <stop offset="1" stop-color="#1f1626"/>
    </linearGradient>
    <linearGradient id="m_herbbed-soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2350"/>
      <stop offset="1" stop-color="#1f1626"/>
    </linearGradient>
    <radialGradient id="m_herbbed-cap" cx="0.4" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#e0524a"/>
      <stop offset="0.5" stop-color="#8e1b2b"/>
      <stop offset="1" stop-color="#5e0f1c"/>
    </radialGradient>
    <linearGradient id="m_herbbed-leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd6b5"/>
      <stop offset="0.5" stop-color="#3fae8f"/>
      <stop offset="1" stop-color="#1f5c4c"/>
    </linearGradient>
    <radialGradient id="m_herbbed-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fd6b5" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3fae8f" stop-opacity="0"/>
    </radialGradient>
    <filter id="m_herbbed-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="80" cy="136" rx="70" ry="10" fill="#14101a" opacity="0.5"/>
  <!-- glows -->
  <ellipse cx="48" cy="72" rx="30" ry="30" fill="url(#m_herbbed-halo)"/>
  <ellipse cx="116" cy="66" rx="28" ry="30" fill="url(#m_herbbed-halo)"/>
  <!-- back frame plank -->
  <path d="M24 88 L136 88 L136 94 L24 94 Z" fill="#1f1626" stroke="#14101a" stroke-width="2" stroke-linejoin="round"/>
  <!-- soil top -->
  <path d="M24 92 L136 92 L146 108 L14 108 Z" fill="url(#m_herbbed-soil)" stroke="#14101a" stroke-width="2" stroke-linejoin="round"/>
  <g fill="#5b3474" opacity="0.7">
    <ellipse cx="40" cy="100" rx="4" ry="1.4"/><ellipse cx="70" cy="104" rx="5" ry="1.4"/><ellipse cx="100" cy="98" rx="4" ry="1.2"/><ellipse cx="126" cy="104" rx="4" ry="1.3"/>
  </g>
  <!-- glowing spirit grass 1 (left) -->
  <g stroke="#14101a" stroke-width="1.5" stroke-linejoin="round">
    <path d="M46 102 Q36 84 26 78 Q38 80 47 96 Z" fill="url(#m_herbbed-leaf)"/>
    <path d="M48 102 Q42 74 46 56 Q54 76 50 102 Z" fill="url(#m_herbbed-leaf)"/>
    <path d="M51 102 Q60 82 72 76 Q64 88 53 102 Z" fill="url(#m_herbbed-leaf)"/>
  </g>
  <path d="M47 98 Q45 78 46 62 M48 98 Q38 86 30 80 M52 98 Q60 86 68 79" fill="none" stroke="#cfefff" stroke-width="0.9" opacity="0.8"/>
  <g filter="url(#m_herbbed-blur)" fill="#cfefff" opacity="0.8">
    <circle cx="46" cy="54" r="4"/>
  </g>
  <circle cx="46" cy="54" r="3" fill="#f4fbff" stroke="#3fae8f" stroke-width="1.2"/>
  <circle cx="27" cy="77" r="2" fill="#cfefff"/>
  <circle cx="72" cy="75" r="2" fill="#cfefff"/>
  <!-- spirit grass 2 (right) -->
  <g stroke="#14101a" stroke-width="1.5" stroke-linejoin="round">
    <path d="M114 102 Q104 86 96 82 Q108 82 115 96 Z" fill="url(#m_herbbed-leaf)"/>
    <path d="M116 102 Q112 70 118 48 Q124 74 119 102 Z" fill="url(#m_herbbed-leaf)"/>
    <path d="M120 102 Q128 84 138 80 Q130 92 122 102 Z" fill="url(#m_herbbed-leaf)"/>
  </g>
  <path d="M117 98 Q116 74 118 54 M115 98 Q108 88 100 83" fill="none" stroke="#cfefff" stroke-width="0.9" opacity="0.8"/>
  <g filter="url(#m_herbbed-blur)" fill="#cfefff" opacity="0.8">
    <circle cx="118" cy="46" r="4.4"/>
  </g>
  <circle cx="118" cy="46" r="3.2" fill="#f4fbff" stroke="#3fae8f" stroke-width="1.2"/>
  <circle cx="139" cy="79" r="1.8" fill="#cfefff"/>
  <!-- blood lingzhi cluster (center) -->
  <g stroke="#14101a" stroke-width="1.8" stroke-linejoin="round">
    <path d="M78 104 Q76 90 82 74 L87 75 Q82 90 85 104 Z" fill="#5e0f1c"/>
    <path d="M95 104 Q94 96 98 88 L102 89 Q99 96 100 104 Z" fill="#5e0f1c"/>
    <path d="M62 72 Q58 60 70 54 Q84 48 98 56 Q106 62 102 72 Q94 68 86 73 Q76 68 62 72 Z" fill="url(#m_herbbed-cap)"/>
    <path d="M88 90 Q86 82 96 79 Q106 77 112 84 Q114 90 110 92 Q104 89 99 92 Q94 89 88 90 Z" fill="url(#m_herbbed-cap)"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M66 68 Q66 60 76 57 Q88 54 96 60 Q100 64 99 68" stroke="#e0524a" stroke-width="1.1"/>
    <path d="M71 66 Q72 61 80 60 Q88 59 93 63" stroke="#e0524a" stroke-width="1"/>
    <path d="M64 71 Q63 62 70 57" stroke="#d9a441" stroke-width="1.4"/>
    <path d="M91 88 Q92 83 98 82 Q105 82 108 86" stroke="#e0524a" stroke-width="1"/>
    <path d="M89 89 Q89 84 93 81.6" stroke="#d9a441" stroke-width="1.1"/>
    <path d="M70 58 Q76 54.4 84 54.4" stroke="#ffc56b" stroke-width="1.3" opacity="0.8"/>
  </g>
  <!-- front frame plank -->
  <path d="M12 106 L148 106 L148 124 Q80 128 12 124 Z" fill="url(#m_herbbed-wood)" stroke="#14101a" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M14 108.4 L146 108.4" stroke="#ffc56b" stroke-width="1" opacity="0.45"/>
  <g fill="none" stroke="#1f1626" stroke-width="1.1" stroke-linecap="round" opacity="0.8">
    <path d="M24 114 Q44 112 62 116 M84 118 Q104 114 126 117 M40 120 Q52 119 60 121"/>
  </g>
  <!-- corner posts -->
  <g stroke="#14101a" stroke-width="2" stroke-linejoin="round">
    <path d="M8 102 L18 102 L18 128 L8 128 Z" fill="#8a5a1c"/>
    <path d="M142 102 L152 102 L152 128 L142 128 Z" fill="#8a5a1c"/>
    <path d="M76 106 L84 106 L84 128 L76 128 Z" fill="#9a4d12"/>
  </g>
  <path d="M10 104 L10 126 M144 104 L144 126" stroke="#ffc56b" stroke-width="1" opacity="0.5"/>
  <!-- iron nails -->
  <g fill="#9aa88a" stroke="#14101a" stroke-width="0.8">
    <circle cx="13" cy="110" r="1.4"/><circle cx="13" cy="120" r="1.4"/><circle cx="147" cy="110" r="1.4"/><circle cx="147" cy="120" r="1.4"/><circle cx="80" cy="112" r="1.3"/><circle cx="80" cy="122" r="1.3"/>
  </g>
  <!-- fireflies -->
  <g fill="#cfefff"><circle cx="30" cy="60" r="1.2"/><circle cx="84" cy="44" r="1"/><circle cx="138" cy="56" r="1.1"/><circle cx="62" cy="40" r="0.9"/></g>
</svg>
