      <stop offset="0.5" stop-color="#3fae8f"/>
      <stop offset="1" stop-color="#1f5c4c"/>
    </linearGradient>
    <filter id="m_forgery-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
