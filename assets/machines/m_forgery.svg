<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="m_forgery-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e0f1c"/>
      <stop offset="0.5" stop-color="#8a5a1c"/>
      <stop offset="1" stop-color="#5e0f1c"/>
    </linearGradient>
    <linearGradient id="m_forgery-front" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14101a"/>
      <stop offset="0.45" stop-color="#3a2e1c"/>
      <stop offset="0.8" stop-color="#8a5a1c"/>
      <stop offset="1" stop-color="#1f1626"/>
    </linearGradient>
    <radialGradient id="m_forgery-lampglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc56b" stop-opacity="0.75"/>
      <stop offset="0.25" stop-color="#d9a441" stop-opacity="0.4"/>
      <stop offset="0.65" stop-color="#3d2350" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2a1838" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m_forgery-skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe2c4"/>
      <stop offset="0.6" stop-color="#e9dfcc"/>
      <stop offset="1" stop-color="#d8c49a"/>
    </linearGradient>
    <linearGradient id="m_forgery-clay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2e1c"/>
      <stop offset="0.4" stop-color="#9a4d12"/>
      <stop offset="1" stop-color="#1f1626"/>
    </linearGradient>
    <radialGradient id="m_forgery-ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc56b"/>
      <stop offset="0.5" stop-color="#e0524a"/>
      <stop offset="1" stop-color="#5e0f1c"/>
    </radialGradient>
    <linearGradient id="m_forgery-bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d27a"/>
      <stop offset="0.45" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
    <linearGradient id="m_forgery-jade" x1="0" y1="0" x2="1" y2="1">
