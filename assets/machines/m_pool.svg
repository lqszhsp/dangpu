<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="m_pool-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa88a"/>
      <stop offset="0.5" stop-color="#5c6370"/>
      <stop offset="1" stop-color="#3a3f4a"/>
    </linearGradient>
    <linearGradient id="m_pool-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c6370"/>
      <stop offset="0.6" stop-color="#3a3f4a"/>
      <stop offset="1" stop-color="#1f1626"/>
    </linearGradient>
    <radialGradient id="m_pool-water" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="0.3" stop-color="#cfefff"/>
      <stop offset="0.7" stop-color="#7fd6b5"/>
      <stop offset="1" stop-color="#1f5c4c"/>
    </radialGradient>
    <radialGradient id="m_pool-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfefff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7fd6b5" stop-opacity="0"/>
    </radialGradient>
    <filter id="m_pool-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="80" cy="134" rx="70" ry="11" fill="#14101a" opacity="0.5"/>
  <!-- glow -->
  <ellipse cx="80" cy="72" rx="62" ry="40" fill="url(#m_pool-halo)"/>
  <!-- back flags (behind rim) -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M36 76 L36 40" stroke="#14101a" stroke-width="3.2"/>
    <path d="M36 76 L36 40" stroke="#8a5a1c" stroke-width="1.6"/>
    <path d="M36.8 41 L52 43 L48 49 L52 55 L36.8 54 Z" fill="#8e1b2b" stroke="#14101a" stroke-width="1.6"/>
    <path d="M40 45 L46 47 L41 51" fill="none" stroke="#f2d27a" stroke-width="1"/>
    <circle cx="36" cy="39" r="1.8" fill="#d9a441" stroke="#14101a" stroke-width="1"/>
    <path d="M124 76 L124 40" stroke="#14101a" stroke-width="3.2"/>
    <path d="M124 76 L124 40" stroke="#8a5a1c" stroke-width="1.6"/>
    <path d="M123.2 41 L108 43 L112 49 L108 55 L123.2 54 Z" fill="#8e1b2b" stroke="#14101a" stroke-width="1.6"/>
    <path d="M120 45 L114 47 L119 51" fill="none" stroke="#f2d27a" stroke-width="1"/>
    <circle cx="124" cy="39" r="1.8" fill="#d9a441" stroke="#14101a" stroke-width="1"/>
  </g>
  <!-- front wall -->
  <path d="M12 102 L148 102 L148 122 Q80 128 12 122 Z" fill="url(#m_pool-wall)" stroke="#14101a" stroke-width="2.4" stroke-linejoin="round"/>
  <g stroke="#14101a" stroke-width="1" opacity="0.75" fill="none">
    <path d="M12 112 Q80 116 148 112"/>
    <path d="M34 102 L34 112 M60 102 L60 113 M86 102 L86 113.4 M112 102 L112 113 M136 102 L136 112"/>
    <path d="M22 112.4 L22 122.6 M47 113 L47 124.4 M73 113.6 L73 125 M99 113.6 L99 125 M124 113 L124 124 M146 112 L146 122"/>
  </g>
  <path d="M14 104 L146 104" stroke="#9aa88a" stroke-width="1" opacity="0.5"/>
  <!-- rim top (trapezoid) -->
  <path d="M30 72 L130 72 L148 102 L12 102 Z" fill="url(#m_pool-stone)" stroke="#14101a" stroke-width="2.4" stroke-linejoin="round"/>
  <g stroke="#14101a" stroke-width="1" opacity="0.6">
    <path d="M80 72 L80 77 M80 97 L80 102 M38 80 L44 82 M122 80 L116 82"/>
  </g>
  <!-- water basin -->
  <path d="M40 77 L120 77 L134 97 L26 97 Z" fill="#14101a" stroke="#14101a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M42 79.4 L118 79.4 L131 95.6 L29 95.6 Z" fill="url(#m_pool-water)"/>
  <path d="M42 79.6 L118 79.6" stroke="#1f5c4c" stroke-width="2.4" opacity="0.7"/>
  <!-- ripples -->
  <g fill="none" stroke="#f4fbff" stroke-width="1.2">
    <ellipse cx="80" cy="88" rx="18" ry="4.4" opacity="0.9"/>
    <ellipse cx="80" cy="88" rx="34" ry="7" opacity="0.4"/>
  </g>
  <path d="M50 84 Q60 82 70 82.6" stroke="#f4fbff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- rim highlight -->
  <path d="M31 73.4 L129 73.4" stroke="#e9dfcc" stroke-width="1.2" opacity="0.6"/>
  <!-- rising wisps -->
  <g fill="none" stroke-linecap="round" filter="url(#m_pool-blur)">
    <path d="M68 86 Q60 70 70 58 Q78 48 70 34" stroke="#cfefff" stroke-width="5" opacity="0.6"/>
    <path d="M94 88 Q102 72 92 60 Q86 50 96 38" stroke="#7fd6b5" stroke-width="5" opacity="0.6"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M68 86 Q60 70 70 58 Q76 50 72 42" stroke="#f4fbff" stroke-width="1.3" opacity="0.85"/>
    <path d="M94 88 Q102 72 92 60" stroke="#cfefff" stroke-width="1.3" opacity="0.85"/>
  </g>
  <g fill="#f4fbff"><circle cx="82" cy="46" r="1.4"/><circle cx="58" cy="54" r="1"/><circle cx="106" cy="50" r="1.1"/><circle cx="80" cy="26" r="0.9"/></g>
  <!-- front flags -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M16 104 L16 60" stroke="#14101a" stroke-width="3.6"/>
    <path d="M16 104 L16 60" stroke="#8a5a1c" stroke-width="1.9"/>
    <path d="M16.9 61 L35 63.4 L30.4 70.4 L35 77.6 L16.9 76.4 Z" fill="#c43a3a" stroke="#14101a" stroke-width="1.8"/>
    <path d="M20.6 66 L27.6 68.4 L21.8 72.6" fill="none" stroke="#f2d27a" stroke-width="1.2"/>
    <circle cx="16" cy="59" r="2.2" fill="#d9a441" stroke="#14101a" stroke-width="1"/>
    <path d="M144 104 L144 60" stroke="#14101a" stroke-width="3.6"/>
    <path d="M144 104 L144 60" stroke="#8a5a1c" stroke-width="1.9"/>
    <path d="M143.1 61 L125 63.4 L129.6 70.4 L125 77.6 L143.1 76.4 Z" fill="#c43a3a" stroke="#14101a" stroke-width="1.8"/>
    <path d="M139.4 66 L132.4 68.4 L138.2 72.6" fill="none" stroke="#f2d27a" stroke-width="1.2"/>
    <circle cx="144" cy="59" r="2.2" fill="#d9a441" stroke="#14101a" stroke-width="1"/>
  </g>
  <!-- pole bases -->
  <g fill="#3a3f4a" stroke="#14101a" stroke-width="1.4">
    <ellipse cx="16" cy="102" rx="4" ry="1.8"/><ellipse cx="144" cy="102" rx="4" ry="1.8"/>
  </g>
</svg>
